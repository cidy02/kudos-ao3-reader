<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Challenge Settings</title><meta name="csrf-token" content="csrf-challenge"></head>
<body>
<form action="/collections/winter_exchange/gift_exchange" method="post">
  <input type="hidden" name="_method" value="put">
  <input type="hidden" name="authenticity_token" value="csrf-challenge">
  <input type="checkbox" name="gift_exchange[signup_open]" value="1">
  <select name="gift_exchange[time_zone]"><option value="UTC" selected>UTC</option></select>
  <input name="gift_exchange[signups_open_at_string]" value="2026-01-01 00:00:00">
  <input name="gift_exchange[signups_close_at_string]" value="2026-02-01 00:00:00">
  <input name="gift_exchange[assignments_due_at_string]" value="2026-03-01 00:00:00">
  <input name="gift_exchange[works_reveal_at_string]" value="2026-04-01 00:00:00">
  <input name="gift_exchange[authors_reveal_at_string]" value="2026-05-01 00:00:00">
  <input name="gift_exchange[requests_num_required]" value="1">
  <input name="gift_exchange[requests_num_allowed]" value="3">
  <input name="gift_exchange[offers_num_required]" value="1">
  <input name="gift_exchange[offers_num_allowed]" value="2">
  <input name="gift_exchange[request_restriction_attributes][fandom_num_required]" value="1">
  <input name="gift_exchange[request_restriction_attributes][fandom_num_allowed]" value="3">
  <input name="gift_exchange[request_restriction_attributes][relationship_num_required]" value="0">
  <input name="gift_exchange[request_restriction_attributes][relationship_num_allowed]" value="2">
  <input name="gift_exchange[request_restriction_attributes][character_num_required]" value="0">
  <input name="gift_exchange[request_restriction_attributes][character_num_allowed]" value="4">
  <input type="checkbox" name="gift_exchange[request_restriction_attributes][optional_tags_allowed]" value="1" checked>
  <input type="checkbox" name="gift_exchange[request_restriction_attributes][allow_any_character]" value="1" checked>
  <input type="hidden" name="utf8" value="✓">
  <input type="hidden" name="gift_exchange[request_restriction_attributes][id]" value="301">
  <input name="gift_exchange[request_url_label]" value="Link to inspiration">
  <textarea name="gift_exchange[signup_instructions_general]">Leave an original prompt about a lantern by the sea.</textarea>
  <textarea name="gift_exchange[signup_instructions_requests]">Keep requests welcoming.</textarea>
  <input type="hidden" name="gift_exchange[request_restriction_attributes][url_allowed]" value="0">
  <input type="checkbox" name="gift_exchange[request_restriction_attributes][url_allowed]" value="1" checked>
  <input type="hidden" name="gift_exchange[request_restriction_attributes][description_required]" value="0">
  <input type="checkbox" name="gift_exchange[request_restriction_attributes][description_required]" value="1" checked>
  <input type="hidden" name="gift_exchange[request_restriction_attributes][allow_any_fandom]" value="0">
  <input type="checkbox" name="gift_exchange[request_restriction_attributes][allow_any_fandom]" value="1">
  <input name="gift_exchange[unmodeled_caption]" value="  Keep this spacing  ">
  <textarea name="gift_exchange[unmodeled_notes]">An original harbor note.
Second line.</textarea>
  <input type="hidden" name="gift_exchange[unmodeled_ids][]" value="71">
  <input type="hidden" name="gift_exchange[unmodeled_ids][]" value="72">
  <input type="submit" name="commit" value="Update Challenge">
  <fieldset id="match_settings"><input type="hidden" name="gift_exchange[potential_match_settings_attributes][id]" value="501">
  <select name="gift_exchange[potential_match_settings_attributes][num_required_prompts]"><option value="-1">All</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
  <select name="gift_exchange[potential_match_settings_attributes][num_required_fandoms]"><option value="-1">All</option><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
  <select name="gift_exchange[potential_match_settings_attributes][num_required_characters]"><option value="-1">All</option><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
  <select name="gift_exchange[potential_match_settings_attributes][num_required_relationships]"><option value="-1">All</option><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
  <select name="gift_exchange[potential_match_settings_attributes][num_required_freeforms]"><option value="-1">All</option><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
  <select name="gift_exchange[potential_match_settings_attributes][num_required_categories]"><option value="-1">All</option><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
  <select name="gift_exchange[potential_match_settings_attributes][num_required_ratings]"><option value="-1">All</option><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
  <select name="gift_exchange[potential_match_settings_attributes][num_required_archive_warnings]"><option value="-1">All</option><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
  <input type="hidden" name="gift_exchange[potential_match_settings_attributes][include_optional_fandoms]" value="0"><input type="checkbox" name="gift_exchange[potential_match_settings_attributes][include_optional_fandoms]" value="1">
  <input type="hidden" name="gift_exchange[potential_match_settings_attributes][include_optional_characters]" value="0"><input type="checkbox" name="gift_exchange[potential_match_settings_attributes][include_optional_characters]" value="1">
  <input type="hidden" name="gift_exchange[potential_match_settings_attributes][include_optional_relationships]" value="0"><input type="checkbox" name="gift_exchange[potential_match_settings_attributes][include_optional_relationships]" value="1">
  <input type="hidden" name="gift_exchange[potential_match_settings_attributes][include_optional_freeforms]" value="0"><input type="checkbox" name="gift_exchange[potential_match_settings_attributes][include_optional_freeforms]" value="1">
  <input type="hidden" name="gift_exchange[potential_match_settings_attributes][include_optional_categories]" value="0"><input type="checkbox" name="gift_exchange[potential_match_settings_attributes][include_optional_categories]" value="1">
  <input type="hidden" name="gift_exchange[potential_match_settings_attributes][include_optional_ratings]" value="0"><input type="checkbox" name="gift_exchange[potential_match_settings_attributes][include_optional_ratings]" value="1">
  <input type="hidden" name="gift_exchange[potential_match_settings_attributes][include_optional_archive_warnings]" value="0"><input type="checkbox" name="gift_exchange[potential_match_settings_attributes][include_optional_archive_warnings]" value="1">
  </fieldset>
</form>
</body>
</html>

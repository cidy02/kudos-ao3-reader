<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Summer Prompt Meme Settings</title><meta name="csrf-token" content="csrf-challenge"></head>
<body>
<form action="/collections/summer_meme/prompt_meme" method="post">
  <input type="hidden" name="_method" value="put">
  <input type="hidden" name="authenticity_token" value="csrf-challenge">
  <input type="checkbox" name="prompt_meme[signup_open]" value="1" checked>
  <select name="prompt_meme[time_zone]"><option value="UTC" selected>UTC</option></select>
  <input name="prompt_meme[signups_open_at_string]" value="2026-06-01 00:00:00">
  <input name="prompt_meme[signups_close_at_string]" value="2026-06-30 00:00:00">
  <input name="prompt_meme[assignments_due_at_string]" value="2026-07-15 00:00:00">
  <input name="prompt_meme[works_reveal_at_string]" value="2026-07-20 00:00:00">
  <input name="prompt_meme[authors_reveal_at_string]" value="2026-07-21 00:00:00">
  <input name="prompt_meme[requests_num_required]" value="1">
  <input name="prompt_meme[requests_num_allowed]" value="3">
  <input name="prompt_meme[offers_num_required]" value="1">
  <input name="prompt_meme[offers_num_allowed]" value="2">
  <input disabled name="prompt_meme[request_restriction_attributes][fandom_num_required]" value="1">
  <input disabled name="prompt_meme[request_restriction_attributes][fandom_num_allowed]" value="3">
  <input name="prompt_meme[request_restriction_attributes][relationship_num_required]" value="0">
  <input name="prompt_meme[request_restriction_attributes][relationship_num_allowed]" value="2">
  <input name="prompt_meme[request_restriction_attributes][character_num_required]" value="0">
  <input name="prompt_meme[request_restriction_attributes][character_num_allowed]" value="4">
  <input type="checkbox" disabled name="prompt_meme[request_restriction_attributes][optional_tags_allowed]" value="1" checked>
  <input type="checkbox" name="prompt_meme[request_restriction_attributes][allow_any_character]" value="1" checked>
  <input type="checkbox" name="prompt_meme[anonymous]" value="1" checked>
  <input type="hidden" name="utf8" value="✓">
  <input type="hidden" name="prompt_meme[request_restriction_attributes][id]" value="301">
  <input name="prompt_meme[request_url_label]" value="Link to inspiration">
  <textarea name="prompt_meme[signup_instructions_general]">Leave an original prompt about a lantern by the sea.</textarea>
  <textarea name="prompt_meme[signup_instructions_requests]">Keep requests welcoming.</textarea>
  <input type="hidden" name="prompt_meme[request_restriction_attributes][url_allowed]" value="0">
  <input type="checkbox" name="prompt_meme[request_restriction_attributes][url_allowed]" value="1" checked>
  <input type="hidden" name="prompt_meme[request_restriction_attributes][description_required]" value="0">
  <input type="checkbox" name="prompt_meme[request_restriction_attributes][description_required]" value="1" checked>
  <input type="hidden" disabled name="prompt_meme[request_restriction_attributes][allow_any_fandom]" value="0">
  <input type="checkbox" disabled name="prompt_meme[request_restriction_attributes][allow_any_fandom]" value="1">
  <input name="prompt_meme[unmodeled_caption]" value="  Keep this spacing  ">
  <textarea name="prompt_meme[unmodeled_notes]">An original harbor note.
Second line.</textarea>
  <input type="hidden" name="prompt_meme[unmodeled_ids][]" value="71">
  <input type="hidden" name="prompt_meme[unmodeled_ids][]" value="72">
  <input type="submit" name="commit" value="Update Challenge">
</form>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; background: {{rowBg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #000000">
  <sc-if value="{{isHidden}}" hint-placeholder-val="{{false}}">
    <div style="position: relative; display: flex; gap: 12px; align-items: center; padding: 12px 16px">
      <div aria-hidden="true" style="flex: 1; display: flex; gap: 12px; align-items: center; filter: blur(5px)">
        <span style="width: 51px; height: 51px; flex-shrink: 0; border-radius: 12px; background: rgba(224,112,0,0.45)"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 7px"><span style="height: 13px; width: 72%; border-radius: 4px; background: rgba(0,0,0,0.28)"></span><span style="height: 10px; width: 50%; border-radius: 4px; background: rgba(0,0,0,0.18)"></span><span style="height: 10px; width: 84%; border-radius: 4px; background: rgba(0,0,0,0.14)"></span></span>
      </div>
      <button style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 30px; padding: 0 11px; border: none; border-radius: 15px; background: rgba(255,255,255,0.92); box-shadow: 0 1px 4px rgba(0,0,0,0.12); color: #3A3A3C; font-family: inherit; font-size: 13px; display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4.5 9.5 6-.4.7-1.3 1.9-2.6 3.1"></path><path d="M6.6 7.6C4.6 8.9 3.2 10.8 2.5 12c1 1.5 4.5 6 9.5 6 1.6 0 3-.4 4.3-1.1"></path></svg>Tap to reveal
      </button>
    </div>
  </sc-if>
  <sc-if value="{{isShown}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; gap: 12px; padding: 12px 16px">
      <sc-if value="{{selecting}}" hint-placeholder-val="{{false}}">
        <span aria-hidden="true" style="width: 24px; height: 24px; flex-shrink: 0; align-self: center; border-radius: 12px; box-sizing: border-box; border: {{checkBorder}}; background: {{checkBg}}; display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.6L19.2 7.4"></path></svg>
        </span>
      </sc-if>
      <dc-import name="Symbols" rating="{{w.rating}}" category="{{w.category}}" warnings="{{w.warnings}}" status="{{w.status}}" warning-count="{{w.warningCount}}" size="24" hint-size="51px,51px"></dc-import>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <sc-if value="{{ledger}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: {{fandomColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.fandom}}</span>
        </sc-if>
        <div style="display: flex; align-items: flex-start; gap: 6px">
          <span style="flex: 1; min-width: 0; font-size: 17px; line-height: 22px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{w.title}}</span>
          <sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; margin-top: 2px; padding: 1px 7px; border-radius: 9px; background: {{accent}}; color: #FFFFFF; font-size: 11px; line-height: 16px; font-weight: 700">{{w.badge}}</span>
          </sc-if>
        </div>
        <span style="font-size: 13px; line-height: 18px; color: #6C6C70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{byline}}</span>
        <sc-if value="{{showSummary}}" hint-placeholder-val="{{false}}">
          <span style="margin-top: 2px; font-size: 14px; line-height: 19px; color: #3A3A3C; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{w.summary}}</span>
        </sc-if>
        <span style="font-size: 12px; line-height: 16px; color: #6C6C70">{{stats}}</span>
        <sc-if value="{{hasSignal}}" hint-placeholder-val="{{false}}">
          <span style="margin-top: 4px; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; line-height: 16px">
            <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 6px; border-radius: 9px; background: {{signalBg}}; color: {{signalFg}}; font-weight: 600; white-space: nowrap">
              <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{signalD}}"></path></svg>{{signalLabel}}
            </span>
            <span style="min-width: 0; color: #6C6C70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{signalNote}}</span>
          </span>
        </sc-if>
        <sc-if value="{{hasBars}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: flex-end; gap: 8px; margin-top: 5px">
            <div role="img" aria-label="{{barsLabel}}" style="flex: 1; max-width: {{barsW}}; height: 16px; display: flex; align-items: flex-end; gap: 2px">
              <sc-for list="{{bars}}" as="b" hint-placeholder-count="12">
                <span style="flex: 1; min-width: 0; box-sizing: border-box; border-radius: 2px; height: {{b.h}}; background: {{b.bg}}; border: {{b.bd}}"></span>
              </sc-for>
            </div>
            <span style="margin-left: auto; font-size: 12px; line-height: 16px; color: #6C6C70">{{progressLabel}}</span>
          </div>
        </sc-if>
        <sc-if value="{{hasPlainProgress}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
            <div style="flex: 1; height: 3px; border-radius: 2px; background: #E5E5EA"><div style="width: {{pct}}; height: 3px; border-radius: 2px; background: {{accent}}"></div></div>
            <span style="font-size: 12px; line-height: 16px; color: #6C6C70">{{progressLabel}}</span>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{divider}}" hint-placeholder-val="{{false}}">
    <div style="height: 0.5px; margin-left: {{dividerInset}}px; background: #D1D1D6"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"work":{"editor":null},"selecting":{"editor":"boolean","default":false},"selected":{"editor":"boolean","default":false},"showSummary":{"editor":"boolean","default":false},"divider":{"editor":"boolean","default":false},"ledger":{"editor":"boolean","default":false},"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":112}}'>
class Component extends DCLogic {
  renderVals() {
    const on = (v) => v === true || v === 'true';
    const accent = this.props.accent ?? '#990000';
    const w = this.props.work ?? {
      title: "The Cartographer's Daughter", author: 'inkwell_moth', fandom: 'Original Work',
      rating: 'T', category: 'FM', warnings: 'none', status: 'wip', chapters: '12/20',
      words: '84,210', kudos: '3,104', hits: '41.2k', updated: 'Oct 21', progress: 58, progressLabel: 'Ch 7 · 58%'
    };
    const selecting = on(this.props.selecting);
    const selected = on(this.props.selected);
    const hex = accent.replace('#', '');
    const tint = 'rgba(' + parseInt(hex.slice(0, 2), 16) + ',' + parseInt(hex.slice(2, 4), 16) + ',' + parseInt(hex.slice(4, 6), 16) + ',0.08)';
    const ledger = on(this.props.ledger);
    const parts = [];
    if (ledger && w.language) parts.push(w.language);
    if (w.words) parts.push(w.words + ' words');
    if (w.chapters) parts.push(w.chapters + ' ch');
    if (ledger && w.comments) parts.push(w.comments + ' comments');
    if (w.kudos) parts.push((ledger ? '♥ ' : '') + w.kudos + (ledger ? '' : ' kudos'));
    if (ledger && w.bookmarks) parts.push(w.bookmarks + ' bookmarks');
    if (w.hits) parts.push(w.hits + ' hits');
    if (w.updated) parts.push(w.updated);
    const hasProgress = typeof w.progress === 'number';
    // Reader Response: one optional signal under the figures (ranked search results only).
    const sig = w.signal || null;
    const TONES = {
      high: ['rgba(' + parseInt(hex.slice(0, 2), 16) + ',' + parseInt(hex.slice(2, 4), 16) + ',' + parseInt(hex.slice(4, 6), 16) + ',0.10)', accent, 'M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z'],
      good: ['#E3F1E6', '#1E6B34', 'M5 12.5l4.6 4.6L19.2 7.4'],
      late: ['#FBF0DC', '#8A5A00', 'M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 8v4l3 2'],
      neutral: ['#EFEFF4', '#3A3A3C', 'M12 5v14M5 12h14'],
      unusual: ['#EFEFF4', '#6C6C70', 'M12 4 2.5 20h19zM12 10v4M12 17h.01']
    };
    const tone = sig ? (TONES[sig.tone] || TONES.high) : TONES.neutral;
    // Ledger: the fandom as a coloured label (identity, not a tinted card); progress as chapter bars.
    const seedOf = (t) => { let h = 7; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h; };
    const FAN = { 'Original Work': 188, 'Persuasion': 335, 'Sherlock Holmes': 32, 'Jane Eyre': 262, 'Northanger Abbey': 290, 'Pride and Prejudice': 150, 'To the Lighthouse': 205 };
    const fk = (w.fandom || '').split(' - ')[0];
    const fhue = FAN[fk] !== undefined ? FAN[fk] : seedOf(w.fandom || 'x') % 360;
    const hasBars = ledger && typeof w.planned === 'number';
    const bars = [];
    if (hasBars) {
      let x = seedOf((w.title || '').replace('’', "'") + ' chapters') || 1;
      const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return (x % 1000) / 1000; };
      for (let i = 0; i < w.planned; i++) {
        const hgt = Math.round(42 + rnd() * 58);
        if (i >= w.posted) bars.push({ h: '46%', bg: 'transparent', bd: '1.5px dashed #C7C7CC' });
        else bars.push({ h: hgt + '%', bg: i < (w.read || 0) ? accent : (i === w.read && w.cur ? 'linear-gradient(to top, ' + accent + ' ' + w.cur + '%, #E5E5EA ' + w.cur + '%)' : '#E5E5EA'), bd: 'none' });
      }
    }
    return {
      w: { ...w, warningCount: w.warningCount || 1, badge: w.badge || '' },
      accent,
      byline: ledger ? (w.author || '') : [w.author, w.fandom].filter(Boolean).join(' · '),
      ledger,
      fandomColor: 'hsl(' + fhue + ', 56%, 33%)',
      hasBars,
      hasPlainProgress: hasProgress && !hasBars,
      bars,
      barsW: Math.min(100, (w.planned || 0) * 8) + '%',
      barsLabel: hasBars ? (w.read || 0) + ' of ' + w.posted + ' posted chapters read' + (w.planned > w.posted ? ', ' + (w.planned - w.posted) + ' not posted yet' : '') : '',
      stats: parts.join(' · '),
      hasSignal: !!sig,
      signalLabel: sig ? sig.label : '',
      signalNote: sig ? (sig.note || '') : '',
      signalBg: tone[0],
      signalFg: tone[1],
      signalD: tone[2],
      isHidden: !!w.hidden,
      isShown: !w.hidden,
      hasBadge: !!w.badge,
      hasProgress,
      pct: hasProgress ? w.progress + '%' : '0%',
      progressLabel: w.progressLabel || (hasProgress ? w.progress + '%' : ''),
      selecting,
      checkBg: selected ? accent : 'transparent',
      checkBorder: selected ? 'none' : '1.5px solid #C7C7CC',
      rowBg: selecting && selected ? tint : 'transparent',
      showSummary: (on(this.props.showSummary) || ledger) && !!w.summary,
      divider: on(this.props.divider),
      dividerInset: selecting ? 115 : 79
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kudos app icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span role="img" aria-label="Kudos" style="display: block; width: {{size}}px; height: {{size}}px; border-radius: {{radius}}px; overflow: hidden; box-shadow: {{shadow}}">
<svg xmlns="http://www.w3.org/2000/svg" width="{{size}}" height="{{size}}" viewBox="0 0 1024 1024" style="display: block">
  <defs>
    <linearGradient id="kudosIconBook" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5392F"/>
      <stop offset="1" stop-color="#C72219"/>
    </linearGradient>
    <linearGradient id="kudosIconSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B71D15"/>
      <stop offset="1" stop-color="#D32A20"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#F4EFE6"/>

  <ellipse cx="520" cy="812" rx="232" ry="34" fill="#000000" opacity="0.10"/>

  <path d="M452 690 L556 690 L556 902 L504 862 L452 902 Z" fill="#161616"/>

  <rect x="312" y="742" width="408" height="56" rx="16" fill="#F7F3EC"/>

  <rect x="300" y="196" width="70" height="572" rx="30" fill="url(#kudosIconSpine)"/>

  <rect x="344" y="196" width="392" height="572" rx="34" fill="url(#kudosIconBook)"/>
  <rect x="360" y="210" width="6" height="544" rx="3" fill="#ffffff" opacity="0.16"/>

  <path transform="translate(404,322) scale(2.45)"
        d="M56,90 C56,90 14,60 14,34 C14,18 30,12 41,18 C48,21.5 53,29 56,34 C59,29 64,21.5 71,18 C82,12 98,18 98,34 C98,60 56,90 56,90 Z"
        fill="#F7F3EC"/>
</svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":96,"min":20,"max":240},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    // The shipping icon (Design/AppIcon.svg) inside the iOS icon mask.
    const size = Number(this.props.size ?? 96);
    return { size, radius: Math.round(size * 0.225), shadow: size >= 48 ? '0 6px 18px rgba(0,0,0,0.14), 0 0 0 0.5px rgba(0,0,0,0.06)' : '0 0 0 0.5px rgba(0,0,0,0.08)' };
  }
}
</script>
</body>
</html>

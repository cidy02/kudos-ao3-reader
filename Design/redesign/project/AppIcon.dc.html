<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kudos app icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span role="img" aria-label="Kudos" style="display: block; width: {{size}}px; height: {{size}}px; border-radius: {{radius}}px; overflow: hidden; box-shadow: {{shadow}}">
<svg xmlns="http://www.w3.org/2000/svg" width="{{size}}" height="{{size}}" viewBox="0 0 1024 1024" style="display: block">
  <defs>
    <linearGradient id="kudosIconHeart" x1="392" y1="290" x2="632" y2="558" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#EFE8DD"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <ellipse cx="512" cy="900" rx="220" ry="36" fill="#000000" opacity="0.08"/>
  <g transform="translate(-277.8956301208592,472.1030828500418) translate(512,512) scale(0.85) translate(-512,-512)">
    <path fill="#080808" d="M656 122H720c8 0 14 6 14 14v278l-46-37-46 37V136c0-8 6-14 14-14z"/>
  </g>
  <g transform="translate(512,512) scale(0.85) translate(-512,-512)">
    <rect x="220" y="140" width="584" height="744" rx="84" fill="#A40303"/>
    <rect x="246" y="182" width="28" height="660" rx="14" fill="#5C0000" opacity="0.24"/>
  </g>
  <g transform="translate(0,68.25) translate(512,512) scale(0.75) translate(-512,-512)">
    <path d="M512 566 C496 552 364 448 356 374 C350 317 394 276 447 276 C478 276 501 289 512 312 C523 289 546 276 577 276 C630 276 674 317 668 374 C660 448 528 552 512 566 Z" fill="url(#kudosIconHeart)"/>
  </g>
</svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":96,"min":20,"max":240},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    // The shipping icon (kudos-ao3-reader/Kudos.icon, flat art Design/IconComposer/AppIconArt-composite.svg:
    // white ground, deep red book, white heart, black bookmark) inside the iOS icon mask.
    const size = Number(this.props.size ?? 96);
    return { size, radius: Math.round(size * 0.225), shadow: size >= 48 ? '0 6px 18px rgba(0,0,0,0.14), 0 0 0 0.5px rgba(0,0,0,0.08)' : '0 0 0 0.5px rgba(0,0,0,0.10)' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account, regrouped</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1240px; position: relative; overflow: hidden; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div style="position: absolute; right: 16px; top: 54px; height: 44px; border-radius: 22px; display: flex; align-items: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
    <button style="height: 44px; padding: 0 14px; border: none; background: transparent; font-family: inherit; font-size: 16px; color: #1C1C1E">Edit</button>
    <button aria-label="Settings" style="width: 46px; height: 44px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"></path></svg>
    </button>
  </div>
  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 20px">
    <section aria-label="Profile" style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 60px; height: 60px; border-radius: 30px; background: #23506B; color: #FFFFFF; font-size: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center">S</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <h1 style="margin: 0; font-size: 24px; line-height: 29px; font-weight: 700">saltwindow</h1>
          <span style="font-size: 14px; color: #3A3A3C">Posting as saltwindow ▾</span>
        </div>
        <button style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: #F2F2F7; font-family: inherit; font-size: 14px; font-weight: 600; color: {{accent}}">Profile</button>
      </div>
      <dl style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center">
        <sc-for list="{{counts}}" as="c" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 1px; border-right: {{c.border}}">
            <dd style="margin: 0; font-size: 18px; font-weight: 700">{{c.value}}</dd>
            <dt style="font-size: 12px; color: #6C6C70">{{c.label}}</dt>
          </div>
        </sc-for>
      </dl>
    </section>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 20px; line-height: 25px; font-weight: 700">{{g.title}}</h2>
        <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; height: 48px; padding-left: 16px; gap: 12px">
              <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
              <div style="flex: 1; height: 48px; display: flex; align-items: center; gap: 8px; padding-right: 16px; border-top: {{r.sep}}">
                <span style="flex: 1; font-size: 16px; color: {{r.color}}">{{r.label}}</span>
                <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 8px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 700">{{r.badge}}</span></sc-if>
                <span style="font-size: 15px; color: #6C6C70">{{r.count}}</span>
                <sc-if value="{{r.chevron}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg></sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
    <p style="margin: 0 4px; font-size: 13px; line-height: 18px; color: #6C6C70">Tap Edit to pin, hide or reorder rows, the way Music's Library works. That replaces the old shortcuts grid without losing it.</p>
  </main>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(242,242,247,0), rgba(242,242,247,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="account" accent="{{accent}}" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const I = {
      later: 'M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 8v4l3 2', bookmark: 'M7 4h10v16l-5-4-5 4z', bell: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4',
      history: 'M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4M12 8v4l3 2', works: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5', series: 'M4 6h16M4 12h16M4 18h16',
      drafts: 'M5 19h4L19 9l-4-4L5 15zM13 7l4 4', inbox: 'M4 13l2.5-8h11L20 13v6H4zM4 13h5l1 2h4l1-2h5', stack: 'M6 8h12v12H6zM8 5h8',
      prefs: 'M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6', dash: 'M4 4h7v9H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 15h7v5H4z', more: 'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6', logout: 'M10 5H5v14h5M14 8l4 4-4 4M18 12H9'
    };
    const row = (label, d, count, extra) => ({ label, d, count: count || '', badge: '', hasBadge: false, chevron: true, color: '#000000', iconColor: accent, ...extra });
    const groups = [
      { title: 'Reading on AO3', rows: [row('Marked for Later', I.later, '31'), row('Bookmarks', I.bookmark, '142'), row('Subscriptions', I.bell, '27', { badge: '4 new', hasBadge: true }), row('AO3 History', I.history, '')] },
      { title: 'Writing', rows: [row('Works', I.works, '6'), row('Series', I.series, '1'), row('Drafts', I.drafts, '2')] },
      { title: 'Community', rows: [row('Inbox', I.inbox, '', { badge: '3', hasBadge: true }), row('AO3 Collections & Challenges', I.stack, '4')] },
      { title: 'Account', rows: [row('Preferences', I.prefs), row('Dashboard', I.dash), row('More on AO3', I.more), row('Log Out', I.logout, '', { color: '#D70015', iconColor: '#D70015', chevron: false })] }
    ].map((g) => ({ ...g, rows: g.rows.map((r, i) => ({ ...r, sep: i ? '0.5px solid #E5E5EA' : 'none' })) }));
    return {
      accent,
      counts: [['6', 'Works'], ['142', 'Bookmarks'], ['27', 'Subscribed'], ['3', 'Unread']].map(([value, label], i) => ({ value, label, border: i < 3 ? '0.5px solid #E5E5EA' : 'none' })),
      groups
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
a{color:#821019}a:hover{color:#6E0000}
</style>
</helmet>
<div style="width: 951px; height: 669px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <dc-import name="Duo-Open-Home" hint-size="951px,669px"></dc-import>
  </div>
  <section aria-label="Account inspector" style="position: absolute; left: 475px; top: 0; width: 476px; height: 669px; background: #F2F2F7; box-shadow: -0.5px 0 0 rgba(0,0,0,0.14); overflow: hidden; z-index: 3">
    <div style="position: absolute; left: 0; top: 0; width: 396px">
      <dc-import name="Account-Sheet" presentation="inspector" hint-size="396px,1200px"></dc-import>
    </div>
    <div style="position: absolute; right: 8px; top: 0">
      <dc-import name="DuoSideBar" height="669" nav="close" tabs="home" actions="{{none}}" accent="#821019" hint-size="64px,669px"></dc-import>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":951,"height":669}}'>
class Component extends DCLogic {
  renderVals() {
    // Open, flat: the Account sheet becomes an inspector on the trailing pane, from the fold to
    // the side controls. Home stays live on the leading pane. Close sits where Back would.
    return { none: [] };
  }
}
</script>
</body>
</html>

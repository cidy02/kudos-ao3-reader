<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow: write and post</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1290px; height: 620px; box-sizing: border-box; padding: 26px 34px; background: #FFFFFF; color: #1C1C1E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <header style="display: flex; align-items: baseline; gap: 14px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Write and post a chapter</h1>
    <p style="margin: 0; font-size: 15px; color: #3A3A3C">Everything AO3's posting form has, as a native form that saves as you type.</p>
  </header>
  <div style="display: flex; align-items: flex-start; gap: 14px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 195px">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 26px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0"><dc-import name="Account" hint-size="390px,1360px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>1</b> Account → Writing: Works, Series, Drafts with their counts.</figcaption>
    </figure>
    <span aria-hidden="true" style="align-self: center; margin-top: -60px; font-size: 26px; color: #C7C7CC">→</span>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 195px">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 26px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0"><dc-import name="My-Works" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>2</b> Your Writing: pick a work to add a chapter, or + for a new one.</figcaption>
    </figure>
    <span aria-hidden="true" style="align-self: center; margin-top: -60px; font-size: 26px; color: #C7C7CC">→</span>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 195px">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 26px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0"><dc-import name="Work-Editor" hint-size="390px,1500px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>3</b> The form opens on Required Tags, each with its symbol, then fandoms and the rest.</figcaption>
    </figure>
    <span aria-hidden="true" style="align-self: center; margin-top: -60px; font-size: 26px; color: #C7C7CC">→</span>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 195px">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 26px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0"><dc-import name="Text-Editor" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>4</b> Write the chapter with AO3's HTML above the keyboard. Done, then Post; AO3 asks once before it goes live.</figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1290,"height":620}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading History · Month</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 110px; right: 110px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Reading History</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between; z-index: 2">
    <button aria-label="Back to Library" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button style="height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: inherit; font-size: 17px; color: #1C1C1E; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">Select</button>
  </div>

  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 22px">
    <div role="tablist" aria-label="Range" style="height: 32px; border-radius: 16px; background: rgba(118,118,128,0.12); padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))"><button role="tab" aria-selected="false" style="border: none; border-radius: 14px; background: transparent; box-shadow: none; font-family: inherit; font-size: 13px; font-weight: 400">Week</button><button role="tab" aria-selected="true" style="border: none; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12); font-family: inherit; font-size: 13px; font-weight: 600">Month</button><button role="tab" aria-selected="false" style="border: none; border-radius: 14px; background: transparent; box-shadow: none; font-family: inherit; font-size: 13px; font-weight: 400">Year</button></div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 13px; line-height: 18px; color: #6C6C70">October 2026</span>
        <span style="font-size: 28px; line-height: 34px; font-weight: 700">19 h 40 m</span>
        <span style="font-size: 13px; line-height: 18px; color: #6C6C70">38 works · 9 finished · read on 24 of 28 days</span>
      </div>
    </div>
    <div role="img" aria-label="{{calLabel}}" style="display: flex; flex-direction: column; gap: 6px">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{dow}}" as="d" hint-placeholder-count="7"><span style="text-align: center; font-size: 11px; color: #8E8E93">{{d}}</span></sc-for>
      </div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <span style="height: 42px; border-radius: 10px; background: {{c.bg}}; box-shadow: {{c.ring}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
            <span style="font-size: 13px; font-weight: 600; color: {{c.fg}}">{{c.day}}</span>
            <span style="font-size: 9px; color: {{c.sub}}">{{c.mins}}</span>
          </span>
        </sc-for>
      </div>
      <div aria-hidden="true" style="display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11px; color: #6C6C70">Less <span style="width: 12px; height: 12px; border-radius: 3px; background: #F2F2F7"></span><span style="width: 12px; height: 12px; border-radius: 3px; background: rgba(130,16,25,0.18)"></span><span style="width: 12px; height: 12px; border-radius: 3px; background: rgba(130,16,25,0.42)"></span><span style="width: 12px; height: 12px; border-radius: 3px; background: rgba(130,16,25,0.75)"></span> More</div>
    </div>
    <section aria-label="Most read this month" style="display: flex; flex-direction: column">
      <h2 style="margin: 0 0 4px; font-size: 20px; line-height: 25px; font-weight: 700">Most Read</h2>
      <sc-for list="{{top}}" as="t" hint-placeholder-count="3">
        <a href="iPhone-WorkDetail.dc.html" style="color: #000000; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: {{t.sep}}">
          <span style="width: 18px; font-size: 15px; font-weight: 700; color: #8E8E93">{{t.n}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.ink}}">{{t.fandom}}</span><span style="font-size: 16px; line-height: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span></span>
          <span style="font-size: 15px; color: #6C6C70">{{t.time}}</span>
        </a>
      </sc-for>
    </section>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="library" accent="#821019" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mins = [0,0,48,22,0,65,31, 74,55,40,12,90,35,20, 0,44,61,30,25,70,48, 33,0,52,41,66,28,74, 55,0,0,0,0,0,0];
    const lvl = (m) => (m === 0 ? '#F2F2F7' : m < 30 ? 'rgba(130,16,25,0.18)' : m < 60 ? 'rgba(130,16,25,0.42)' : 'rgba(130,16,25,0.75)');
    const hue = { 'Original Work': 188, 'Persuasion': 335, 'Sherlock Holmes': 32, 'Jane Eyre': 262 };
    return {
      calLabel: 'Reading in October 2026: read on 24 of 28 days so far, most on Oct 12 (1 h 30 m)',
      dow: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],
      cells: mins.map((m, i) => {
        const day = i - 2; // October 2026 starts on a Thursday
        const real = day >= 1 && day <= 31;
        const future = day > 28;
        return { day: real ? String(day) : '', mins: real && m ? m + 'm' : '', bg: !real || future ? 'transparent' : lvl(m), fg: !real ? 'transparent' : future ? '#C7C7CC' : m >= 60 ? '#FFFFFF' : '#1C1C1E', sub: m >= 60 ? 'rgba(255,255,255,0.85)' : '#6C6C70', ring: day === 28 ? '0 0 0 2px #821019' : 'none' };
      }),
      top: [['Original Work', 'Salt & Starlight', '4 h 10 m'], ['Persuasion', 'Letters Never Sent', '2 h 5 m'], ['Jane Eyre', 'Moor and Mist', '1 h 50 m']].map(([fandom, title, time], i) => ({ n: i + 1, fandom, title, time, ink: 'hsl(' + hue[fandom] + ', 56%, 33%)', sep: i ? '0.5px solid #E5E5EA' : 'none' }))
    };
  }
}
</script>
</body>
</html>

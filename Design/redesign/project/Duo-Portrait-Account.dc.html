<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duo portrait · Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 669px; height: 951px; position: relative; overflow: hidden; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <section aria-label="Account" style="position: absolute; left: 0; top: 0; width: 669px; height: 951px; padding: 88px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <section aria-label="Profile" style="flex-shrink: 0; background: #FFFFFF; border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: #23506B; color: #FFFFFF; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center">S</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <p style="margin: 0; font-size: 24px; line-height: 29px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">saltwindow</p>
            <button aria-label="Posting as saltwindow, change pseud" style="align-self: flex-start; max-width: 100%; border: none; background: none; padding: 0; font-family: inherit; font-size: 13px; line-height: 19px; color: #3A3A3C; display: flex; align-items: center; gap: 4px; white-space: nowrap">Posting as saltwindow
              <svg aria-hidden="true" width="9" height="13" viewBox="0 0 12 16" fill="none" stroke="#6C6C70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6 6 2.5 9.5 6M2.5 10 6 13.5 9.5 10"></path></svg>
            </button>
          </div>
          <button style="height: 44px; flex-shrink: 0; padding: 0 14px; border: none; border-radius: 22px; background: {{accentTint}}; font-family: inherit; font-size: 15px; font-weight: 600; color: {{accent}}">Profile</button>
        </div>
        <dl style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center">
          <sc-for list="{{counts}}" as="c" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column-reverse; border-right: {{c.border}}">
              <dt style="font-size: 12px; line-height: 16px; color: #6C6C70">{{c.label}}</dt>
              <dd style="margin: 0; font-size: 18px; line-height: 22px; font-weight: 700">{{c.value}}</dd>
            </div>
          </sc-for>
        </dl>
      </section>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{groupsA}}" as="g" hint-placeholder-count="4">
        <section style="display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">{{g.title}}</h2>
          <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
              <button aria-current="{{r.current}}" style="width: 100%; height: 44px; border: none; padding: 0 0 0 16px; display: flex; align-items: center; gap: 12px; background: {{r.bg}}; font-family: inherit; text-align: left; color: #000000">
                <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
                <span style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding-right: 16px; border-top: {{r.sep}}">
                  <span style="flex: 1; min-width: 0; font-size: 16px; color: {{r.color}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span>
                  <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 8px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 700">{{r.badge}}</span></sc-if>
                  <span style="font-size: 15px; color: #6C6C70">{{r.count}}</span>
                  <sc-if value="{{r.chevron}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg></sc-if>
                </span>
              </button>
            </sc-for>
          </div>
        </section>
      </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{groupsB}}" as="g" hint-placeholder-count="4">
        <section style="display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">{{g.title}}</h2>
          <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
              <button aria-current="{{r.current}}" style="width: 100%; height: 44px; border: none; padding: 0 0 0 16px; display: flex; align-items: center; gap: 12px; background: {{r.bg}}; font-family: inherit; text-align: left; color: #000000">
                <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{r.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
                <span style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding-right: 16px; border-top: {{r.sep}}">
                  <span style="flex: 1; min-width: 0; font-size: 16px; color: {{r.color}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span>
                  <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 8px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 700">{{r.badge}}</span></sc-if>
                  <span style="font-size: 15px; color: #6C6C70">{{r.count}}</span>
                  <sc-if value="{{r.chevron}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg></sc-if>
                </span>
              </button>
            </sc-for>
          </div>
        </section>
      </sc-for>
      </div>
    </div>
  </section>


  <div style="position: absolute; left: 0; top: 0; z-index: 2">
    <dc-import name="DuoTopBar" title="Account" title-style="large" actions="{{side}}" accent="#990000" hint-size="669px,80px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center">
    <dc-import name="TabBar" selected="account" accent="#990000" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":669,"height":951}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const hex = accent.replace('#', '');
    const accentTint = 'rgba(' + parseInt(hex.slice(0, 2), 16) + ',' + parseInt(hex.slice(2, 4), 16) + ',' + parseInt(hex.slice(4, 6), 16) + ',0.10)';
    const S = {
      home: 'M3.5 10.5 12 3.5l8.5 7M5.5 9v11h5v-6h3v6h5V9',
      library: 'M3.5 4h4v16h-4zM9.5 4h4v16h-4zM15.6 5.4l3.4-.9 3 15.2-3.4.9z',
      all: 'M6 8h12v12H6zM8 5h8',
      reading: 'M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6.5v13',
      upnext: 'M5 6h14M5 12h14M5 18h9',
      downloaded: 'M12 4v11M7 10.5l5 5 5-5M5 20h14',
      later: 'M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 8v4l3 2',
      history: 'M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4M12 8v4l3 2',
      browse: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      account: 'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4.5 20c1.4-3.8 4.2-5.8 7.5-5.8s6.1 2 7.5 5.8'
    };
    const side = [
      { label: 'Home', d: S.home },
      { label: 'Library', d: S.library, chev: true, bold: true },
      { label: 'All Works', d: S.all, count: '214', sub: true },
      { label: 'Reading', d: S.reading, count: '6', sub: true },
      { label: 'Up Next', d: S.upnext, count: '12', sub: true },
      { label: 'Downloaded', d: S.downloaded, count: '98', sub: true },
      { label: 'Marked for Later', d: S.later, count: '31', sub: true },
      { label: 'History', d: S.history, sub: true },
      { label: 'Browse', d: S.browse },
      { label: 'Account', d: S.account, selected: true }
    ];
    const I = {
      later: S.later, bookmark: 'M7 4h10v16l-5-4-5 4z', bell: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4',
      history: S.history, works: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5', series: 'M4 6h16M4 12h16M4 18h16',
      drafts: 'M5 19h4L19 9l-4-4L5 15zM13 7l4 4', inbox: 'M4 13l2.5-8h11L20 13v6H4zM4 13h5l1 2h4l1-2h5', stack: 'M6 8h12v12H6zM8 5h8',
      prefs: 'M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6', dash: 'M4 4h7v9H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 15h7v5H4z', more: 'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6', logout: 'M10 5H5v14h5M14 8l4 4-4 4M18 12H9'
    };
    const row = (label, d, count, extra) => ({ label, d, count: count || '', badge: '', hasBadge: false, chevron: true, color: '#000000', iconColor: accent, ...extra });
    const groups = [
      { title: 'Reading on AO3', rows: [row('Marked for Later', I.later, '31'), row('Bookmarks', I.bookmark, '142'), row('Subscriptions', I.bell, '27', { badge: '4 new', hasBadge: true }), row('AO3 History', I.history, '')] },
      { title: 'Writing', rows: [row('Works', I.works, '6'), row('Series', I.series, '1'), row('Drafts', I.drafts, '2')] },
      { title: 'Community', rows: [row('Inbox', I.inbox, '', { badge: '3', hasBadge: true }), row('AO3 Collections & Challenges', I.stack, '4')] },
      { title: 'Account', rows: [row('Preferences', I.prefs), row('Dashboard', I.dash), row('More on AO3', I.more), row('Log Out', I.logout, '', { color: '#D70015', iconColor: '#D70015', chevron: false })] }
    ].map((g) => ({
      ...g,
      rows: g.rows.map((r, i) => ({ ...r, sep: i ? '0.5px solid #E5E5EA' : 'none', bg: r.selected ? accentTint : 'transparent', current: r.selected ? 'true' : 'false' }))
    }));
    const items = [
      { from: 'tidewright', time: '9:12', on: 'on Keeper of the Northern Light · Chapter 7', body: 'The bit with the logbook writing itself — I had to stop and check my own door was locked.', unread: true },
      { from: 'marginalia', time: 'Yesterday', on: 'Reply to your comment on Letters Never Sent', body: 'Ha, yes! The navy list joke was entirely for you.', unread: true },
      { from: 'quietharbor', time: 'Mon', on: 'on Keeper of the Northern Light · Chapter 6', body: 'Long-time lurker. This one finally got me to log in to say thank you.', unread: true },
      { from: 'anne_at_lyme', time: 'Oct 20', on: 'on Keeper of the Northern Light · Chapter 1', body: 'Bookmarking for the winter. The first line alone sold me.', unread: false, replied: true, swiped: true }
    ];
    return {
      side: [{ label: 'Edit', text: 'Edit' }, { label: 'Settings', d: 'M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7' }],
      accent,
      accentTint,
      sidebar: side.map((i) => ({
        ...i,
        count: i.count || '',
        chev: !!i.chev,
        current: i.selected ? 'page' : 'false',
        pad: i.sub ? 22 : 10,
        bg: i.selected ? accent : 'transparent',
        fg: i.selected ? '#FFFFFF' : '#000000',
        iconColor: i.selected ? '#FFFFFF' : accent,
        countColor: i.selected ? 'rgba(255,255,255,0.85)' : '#6C6C70',
        weight: i.selected || i.bold ? 600 : 400
      })),
      queues: [
        { label: 'Summer Reading', count: '8' },
        { label: 'Re-reads', count: '5' },
        { label: 'For the Train', count: '3' }
      ],
      counts: [['6', 'Works'], ['142', 'Bookmarks'], ['27', 'Subscribed'], ['3', 'Unread']].map(([value, label], i) => ({ value, label, border: i < 3 ? '0.5px solid #E5E5EA' : 'none' })),
      groupsA: groups.slice(0, 2),
      groupsB: groups.slice(2),
      items: items.map((m) => ({
        ...m,
        replied: !!m.replied,
        swiped: !!m.swiped,
        shift: m.swiped ? -148 : 0,
        dot: m.unread ? accent : 'transparent',
        dotLabel: m.unread ? 'Unread' : 'Read',
        weight: m.unread ? 600 : 400
      }))
    };
  }
}
</script>
</body>
</html>

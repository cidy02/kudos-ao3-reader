<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open portrait Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
a{color:#821019}a:hover{color:#6E0000}
</style>
</helmet>
<div style="width: 669px; height: 951px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <dc-import name="Duo-Portrait-Home" hint-size="669px,951px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.28); z-index: 3"></div>
  <section aria-label="Account form sheet" style="position: absolute; left: 64px; top: 84px; width: 541px; height: 800px; border-radius: 28px; background: #F2F2F7; box-shadow: 0 20px 60px rgba(0,0,0,0.28); overflow: hidden; z-index: 4">
    <dc-import name="Account-Sheet" presentation="form" hint-size="541px,1200px"></dc-import>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":669,"height":951}}'>
class Component extends DCLogic {
  renderVals() {
    // Open, portrait: the Account sheet is a form sheet over Home, as on iPad mini.
    return { none: [] };
  }
}
</script>
</body>
</html>

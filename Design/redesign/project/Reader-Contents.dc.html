<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reader contents, bookmarks and notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgba(40,30,10,0.32); color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <section role="dialog" aria-label="Contents" style="position: absolute; left: 0; right: 0; top: 110px; bottom: 0; border-radius: 38px 38px 0 0; background: #FAF7F0; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #CFC7B8; margin: 7px auto 0"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px">
      <span style="width: 44px"></span>
      <h2 style="margin: 0; font-size: 17px; font-weight: 600">The Cartographer's Daughter</h2>
      <button aria-label="Done" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.6L19.2 7.4"></path></svg>
      </button>
    </div>
    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
      <div role="tablist" aria-label="Contents sections" style="height: 34px; border-radius: 17px; background: rgba(60,40,10,0.08); padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
        <button role="tab" aria-selected="true" style="border: none; border-radius: 15px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12); font-family: inherit; font-size: 14px; font-weight: 600">Contents</button>
        <button role="tab" aria-selected="false" style="border: none; border-radius: 15px; background: transparent; font-family: inherit; font-size: 14px">Bookmarks · 3</button>
        <button role="tab" aria-selected="false" style="border: none; border-radius: 15px; background: transparent; font-family: inherit; font-size: 14px">Notes · 2</button>
      </div>
      <p style="margin: 0 4px; font-size: 13px; color: #6B645A">22% of the work · about 4 h 10 min left</p>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <sc-for list="{{chapters}}" as="c" hint-placeholder-count="8">
          <button style="width: 100%; min-height: 50px; border: none; border-top: {{c.sep}}; background: {{c.bg}}; padding: 6px 16px; display: flex; align-items: center; gap: 10px; font-family: inherit; text-align: left">
            <span style="width: 26px; font-size: 14px; font-weight: 600; color: #6B645A">{{c.n}}</span>
            <span style="flex: 1; font-size: 16px; line-height: 21px; color: {{c.color}}; font-weight: {{c.weight}}">{{c.title}}</span>
            <span style="font-size: 13px; color: #6B645A">{{c.detail}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const hex = accent.replace('#', '');
    const tint = 'rgba(' + parseInt(hex.slice(0, 2), 16) + ',' + parseInt(hex.slice(2, 4), 16) + ',' + parseInt(hex.slice(4, 6), 16) + ',0.08)';
    const chapters = [
      ['', 'Preface and summary', ''], ['1', 'Instruments', 'read'], ['2', 'A Map Without Edges', 'read'], ['3', 'The Survey Office', 'read'],
      ['4', 'Lamp Oil', 'read'], ['5', 'Tide Tables', 'read'], ['6', 'Third Milestone', 'read'], ['7', 'The Salt Road', '22% · reading'],
      ['8', 'White Ground', '18 min'], ['9', 'Copper Light', '21 min']
    ];
    return {
      accent,
      chapters: chapters.map(([n, title, detail], i) => {
        const current = n === '7';
        return { n, title, detail, sep: i ? '0.5px solid #EDE7DC' : 'none', bg: current ? tint : 'transparent', color: current ? accent : '#1F1B16', weight: current ? 600 : 400 };
      })
    };
  }
}
</script>
</body>
</html>

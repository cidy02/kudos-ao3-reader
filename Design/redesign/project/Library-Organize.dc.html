<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library as the place to organise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div style="position: absolute; right: 16px; top: 54px; display: flex; gap: 10px; z-index: 2">
    <div style="height: 44px; border-radius: 22px; display: flex; align-items: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <button aria-label="New: Collection, Queue, Import EPUB" style="width: 46px; height: 44px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <button aria-label="More: Reading Insights, Recently Deleted" style="width: 46px; height: 44px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
      </button>
    </div>
    <button style="height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: inherit; font-size: 17px; color: #1C1C1E; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">Select</button>
  </div>

  <main style="padding: 56px 16px 0; display: flex; flex-direction: column; gap: 26px">
    <header style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Library</h1>
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #6C6C70">214 works · 98 downloaded · 2.1 GB</p>
    </header>

    <section aria-label="Shelves" style="display: flex; flex-direction: column">
      <sc-for list="{{shelves}}" as="l" hint-placeholder-count="7">
        <a href="{{l.href}}" style="color: #000000; text-decoration: none; display: flex; align-items: center; gap: 14px; min-height: 48px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{l.d}}"></path></svg>
          <span style="flex: 1; min-height: 48px; display: flex; align-items: center; gap: 8px; border-bottom: {{l.sep}}">
            <span style="flex: 1; font-size: 17px; line-height: 22px">{{l.label}}</span>
            <span style="font-size: 17px; color: #8E8E93; font-variant-numeric: tabular-nums">{{l.count}}</span>
            <svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
          </span>
        </a>
      </sc-for>
    </section>

    <section aria-label="Collections" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Collections</h2>
        <span style="font-size: 15px; color: #6C6C70">4</span>
        <a href="Collection.dc.html" style="margin-left: auto; font-size: 17px; color: #990000; text-decoration: none">See All</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px">
        <sc-for list="{{collections}}" as="c" hint-placeholder-count="3">
          <a href="Collection.dc.html" style="text-decoration: none; color: #000000; display: flex; flex-direction: column; gap: 8px">
            <dc-import name="CoverStack" tiles="{{c.tiles}}" colour="{{c.colour}}" initial="{{c.initial}}" kind="collection" width="171" height="150" hint-size="171px,150px"></dc-import>
            <span style="display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 15px; line-height: 20px; font-weight: 600; display: flex; align-items: center; gap: 5px">{{c.name}}<sc-if value="{{c.pinned}}" hint-placeholder-val="{{false}}"><svg aria-label="Pinned to Home" width="12" height="12" viewBox="0 0 24 24" fill="#8E8E93"><path d="M15 3l6 6-3 1-4 4 .5 4.5L13 20l-4-4-5 5-1-1 5-5-4-4 1.5-1.5L10 10l4-4z"></path></svg></sc-if></span>
              <span style="font-size: 13px; line-height: 18px; color: #6C6C70">{{c.detail}}</span>
            </span>
          </a>
        </sc-for>
        <button style="border: none; background: none; padding: 0; font-family: inherit; display: flex; flex-direction: column; gap: 8px; text-align: left">
          <span aria-hidden="true" style="width: 100%; height: 150px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed #C7C7CC; color: #990000; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
          <span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #990000">New Collection</span>
        </button>
      </div>
    </section>

    <sc-if value="{{isAvatar}}" hint-placeholder-val="{{false}}">
      <section aria-label="On AO3" style="display: flex; flex-direction: column">
        <h2 style="margin: 0 0 4px; font-size: 20px; line-height: 25px; font-weight: 700">On AO3</h2>
        <sc-for list="{{ao3}}" as="l" hint-placeholder-count="4">
          <a href="AO3-Lists.dc.html" style="color: #000000; text-decoration: none; display: flex; align-items: center; gap: 14px; min-height: 48px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{l.d}}"></path></svg>
            <span style="flex: 1; min-height: 48px; display: flex; align-items: center; gap: 8px; border-bottom: {{l.sep}}">
              <span style="flex: 1; font-size: 17px; line-height: 22px">{{l.label}}</span>
              <span style="font-size: 17px; color: #8E8E93">{{l.count}}</span>
              <svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
            </span>
          </a>
        </sc-for>
      </section>
    </sc-if>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="library" account="{{account}}" accent="#990000" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"account":{"editor":"enum","options":["tab","avatar"],"default":"tab"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const account = this.props.account ?? 'tab';
    const art = (h) => 'linear-gradient(155deg, hsl(' + h + ', 46%, 27%), hsl(' + ((h + 22) % 360) + ', 50%, 41%))';
    const rgba = (hex, a) => { const x = hex.replace('#', ''); return 'rgba(' + parseInt(x.slice(0, 2), 16) + ',' + parseInt(x.slice(2, 4), 16) + ',' + parseInt(x.slice(4, 6), 16) + ',' + a + ')'; };
    const rows = (list) => list.map(([label, d, count, href], i) => ({ label, d, count, href, sep: i < list.length - 1 ? '0.5px solid #E5E5EA' : 'none' }));
    // Shelves fill themselves; Queues and Collections are the reader's own.
    const shelves = rows([
      ['All Works', 'M4 6h16M4 12h16M4 18h16', '214', 'Library-Section.dc.html'],
      ['Want to Read', 'M7 4h10v16l-5-4-5 4z', '31', 'Queue.dc.html'],
      ['Reading Now', 'M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6.5v13', '6', 'Library-Section.dc.html'],
      ['Finished', 'M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17zM8 12.3l2.8 2.8L16.3 9.5', '74', 'Library-Section.dc.html'],
      ['Downloaded', 'M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14', '98', 'Library-Section.dc.html'],
      ['Favourites', 'm12 3.8 2.5 5.2 5.6.8-4.1 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.8z', '19', 'Library-Section.dc.html'],
      ['History', 'M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4M12 8v4l3 2', '412', 'Library-Section.dc.html'],
      ['Queues', 'M4 6h11M4 12h11M4 18h7M18 15v6M15 18h6', '3', 'Queues.dc.html']
    ]);
    const queue = (name, detail, colour, hues, fills, label) => ({
      name, detail, colour, progressLabel: label, initial: name.charAt(0), tiles: hues.map(art),
      track: rgba(colour, 0.2), segs: fills.map((f) => ({ w: f + '%' }))
    });
    const queues = [
      queue('Summer Reading', '8 works · about 9 h 40 min · 6 offline', '#C25E00', [181, 340, 28, 266], [100, 100, 60, 0, 0, 0, 0, 0], '2 of 8 finished, 1 in progress'),
      queue('Re-reads', '5 works · about 4 h 5 min · all offline', '#1E63C8', [262, 290, 196, 330], [100, 100, 100, 30, 0], '3 of 5 finished, 1 in progress'),
      queue('For the Train', '3 works · about 1 h 50 min', '#2F8F3A', [32, 188, 340, 150], [0, 0, 0], 'none started')
    ].map((q, i) => ({ ...q, sep: i ? '0.5px solid #E5E5EA' : 'none' }));
    const collections = [
      ['Austen Variations', '12 works', '#9C2F6B', [150, 335, 290], true],
      ['Baker Street', '9 works', '#B8892A', [32, 44, 188], false],
      ['Comfort Reads', '15 works', '#2F7A4A', [262, 188, 150], false]
    ].map(([name, detail, colour, hues, pinned]) => ({ name, detail, colour, pinned, initial: name.charAt(0), tiles: hues.map(art) }));
    const ao3 = rows([
      ['Marked for Later', 'M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 8v4l3 2', '31', ''],
      ['Bookmarks', 'M7 4h10v16l-5-4-5 4z', '142', ''],
      ['Subscriptions', 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4', '27', ''],
      ['AO3 History', 'M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4M12 8v4l3 2', '', '']
    ]);
    return { account, isAvatar: account === 'avatar', shelves, queues, collections, ao3 };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Kudos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box; display: flex; flex-direction: column; padding: 72px 32px 40px">
  <div style="display: flex; justify-content: center; margin-bottom: 20px"><dc-import name="AppIcon" size="96" hint-size="96px,96px"></dc-import></div>
  <h1 style="margin: 0; text-align: center; font-size: 36px; line-height: 43px; font-weight: 800">Welcome to<br><span style="color: {{accent}}">Kudos</span></h1>
  <div style="margin-top: 48px; display: flex; flex-direction: column; gap: 28px">
    <sc-for list="{{features}}" as="f" hint-placeholder-count="3">
      <div style="display: flex; gap: 16px; align-items: flex-start">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{f.d}}"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 17px; line-height: 22px; font-weight: 600">{{f.title}}</span>
          <span style="font-size: 15px; line-height: 20px; color: #6C6C70">{{f.body}}</span>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <p style="margin: 0; font-size: 13px; line-height: 18px; color: #6C6C70; text-align: center">Free to use · Ad-free · Built by fans. Kudos is open source and not affiliated with the OTW or AO3.</p>
    <button style="width: 100%; height: 52px; border: none; border-radius: 26px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">Continue</button>
    <button style="border: none; background: none; font-family: inherit; font-size: 15px; color: {{accent}}">View on GitHub</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#990000',
      features: [
        { title: 'Read anywhere', body: 'Download works and read them offline, with themes, fonts and Read Aloud.', d: 'M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6.5v13' },
        { title: 'All of AO3, native', body: 'Search, browse fandoms, leave kudos and comments, and keep up with subscriptions.', d: 'M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z' },
        { title: 'Yours, on this device', body: 'Your library, queues and history stay on your iPhone. Mature works can hide behind Face ID.', d: 'M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z' }
      ]
    };
  }
}
</script>
</body>
</html>

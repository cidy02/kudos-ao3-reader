<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 380px; background: linear-gradient(to bottom, rgba(37,119,132,0.20), rgba(37,119,132,0.12) 35%, rgba(37,119,132,0.05) 65%, rgba(37,119,132,0))"></div>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between; z-index: 2">
    <button aria-label="Back to work" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button aria-label="More: Open on AO3, Copy Link" aria-haspopup="menu" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
    </button>
  </div>

  <main style="position: relative; padding: 106px 0 0; display: flex; flex-direction: column">
    <header style="padding: 0 16px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: hsl(188, 56%, 33%)">Comments · Chapter 7</span>
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">The Cartographer’s Daughter</h1>
      <a href="Author.dc.html" style="align-self: flex-start; text-decoration: none; font-size: 15px; line-height: 20px; color: {{accent}}">inkwell_moth</a>
    </header>

    <dl style="margin: 12px 16px 0; padding: 10px 0; border-radius: 16px; background: rgba(118,118,128,0.08); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center">
      <sc-for list="{{stats}}" as="t" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 1px; border-left: {{t.sep}}">
          <dd style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600; color: {{t.color}}">{{t.value}}</dd>
          <dt style="font-size: 11px; line-height: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #6C6C70">{{t.label}}</dt>
        </div>
      </sc-for>
    </dl>

    <div style="margin: 12px 16px 0; display: flex; gap: 7px">
      <button aria-label="Browse comments by chapter" style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: rgba(37,119,132,0.14); color: hsl(188, 56%, 28%); font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5zM12 6v13.5"></path></svg>Chapter 7
        <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"></path></svg>
      </button>
      <button aria-label="Sort comments, Newest First" style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: rgba(118,118,128,0.12); color: #1C1C1E; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 6px">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5"></path></svg>Newest
        <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"></path></svg>
      </button>
    </div>

    <div aria-hidden="true" style="margin: 14px 16px 0; height: 0.5px; background: #D1D1D6"></div>

    <dc-import name="CommentThread" items="{{thread}}" accent="{{accent}}" hint-size="390px,520px"></dc-import>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 70%); pointer-events: none"></div>
  <button style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 52px; border: none; border-radius: 26px; padding: 0 8px 0 18px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 16px; color: #6C6C70; text-align: left; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
    <span style="flex: 1">Comment on the work…</span>
    <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 19px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
    </span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const C = (author, depth, time, body, extra) => ({ kind: 'c', author, depth, time, body, ...extra });
    const list = [
      C('saltwindow', 0, '2d', 'The single unbroken line across the vellum. I had to put my phone down for a minute.', { chapter: 'Ch 7' }),
      C('inkwell_moth', 1, '1d', 'That line is the whole story, honestly. Thank you for reading so closely!', { role: 'Author' }),
      C('saltwindow', 2, '1d', 'Then I’m glad I put it down. Thank you for writing it.', { role: 'Me' }),
      C('marginalia', 1, '20h', 'Same. I read that paragraph three times before I could go on.', {}),
      { kind: 'gap' },
      C('Guest', 0, '4d', 'Tomas not laughing at the end is going to live in my head for weeks.', { chapter: 'Ch 7', guest: true }),
      { kind: 'control', depth: 0, label: 'Show 12 replies' }
    ];
    const sep = '0.5px solid rgba(60,60,67,0.18)';
    return {
      accent,
      stats: [['286', 'Comments', '#000000'], ['12', 'Threads', '#000000'], ['1', 'Yours', accent], ['20h', 'Latest', '#000000']].map(([value, label, color], i) => ({ value, label, color, sep: i ? sep : 'none' })),
      thread: list
    };
  }
}
</script>
</body>
</html>

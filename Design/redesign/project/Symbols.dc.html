<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work symbols</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{aria}}" style="display: {{display}}; grid-template-columns: {{cols}}; flex-wrap: wrap; gap: {{gap}}px; align-items: center; padding: {{backPad}}px; border-radius: {{backR}}px; background: {{backBg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: {{ink}}">
  <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
    <div aria-hidden="true" style="display: flex; align-items: center; gap: {{labelGap}}px; padding: {{chipPad}}; border-radius: 999px; background: {{chipBg}}">
      <div style="width: {{size}}px; height: {{size}}px; flex-shrink: 0; position: relative; overflow: hidden; border-radius: {{radius}}px; background: {{t.bg}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{t.isText}}" hint-placeholder-val="{{true}}">
          <span style="color: {{t.fg}}; font-family: {{t.font}}; font-size: {{t.fs}}px; font-weight: {{t.weight}}; line-height: 1">{{t.glyph}}</span>
        </sc-if>
        <sc-if value="{{t.isDash}}" hint-placeholder-val="{{false}}">
          <span style="width: 42%; height: {{dashH}}px; border-radius: {{dashH}}px; background: {{t.fg}}"></span>
        </sc-if>
        <sc-if value="{{t.isCheck}}" hint-placeholder-val="{{false}}">
          <svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.6L19.2 7.4"></path></svg>
        </sc-if>
        <sc-if value="{{t.isShield}}" hint-placeholder-val="{{false}}">
          <svg width="{{shieldIcon}}" height="{{shieldIcon}}" viewBox="0 0 24 24" fill="none"><path d="M12 2.6 4.4 5.5v6c0 4.7 3.2 8.6 7.6 9.9 4.4-1.3 7.6-5.2 7.6-9.9v-6z" fill="{{t.fg}}" stroke="{{t.fg}}" stroke-width="1.4" stroke-linejoin="round"></path></svg>
          <span style="position: absolute; inset: 0; padding-top: {{shieldNudge}}px; display: flex; align-items: center; justify-content: center; color: {{t.bg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif; font-size: {{shieldFs}}px; font-weight: 800; line-height: 1">{{t.glyph}}</span>
        </sc-if>
        <sc-if value="{{t.isGen}}" hint-placeholder-val="{{false}}">
          <svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="{{t.fg}}" stroke-width="2.4"></circle><circle cx="12" cy="12" r="2.6" fill="{{t.fg}}"></circle></svg>
        </sc-if>
        <sc-if value="{{t.isRing}}" hint-placeholder-val="{{false}}">
          <svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="{{t.fg}}" stroke-width="2.6"></circle><path d="M12 3.8a8.2 8.2 0 0 0 0 16.4z" fill="{{t.fg}}"></path></svg>
        </sc-if>
        <sc-if value="{{t.isMulti}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; left: 0; top: 0; width: 50%; height: 50%; background: #2F8F3A"></span>
          <span style="position: absolute; right: 0; top: 0; width: 50%; height: 50%; background: #B3127A"></span>
          <span style="position: absolute; left: 0; bottom: 0; width: 50%; height: 50%; background: #D2264B"></span>
          <span style="position: absolute; right: 0; bottom: 0; width: 50%; height: 50%; background: #1E63C8"></span>
        </sc-if>
      </div>
      <sc-if value="{{showLabels}}" hint-placeholder-val="{{false}}">
        <span style="font-size: {{labelSize}}px; line-height: 1.2; font-weight: 600; white-space: nowrap">{{t.label}}<span style="font-weight: 500; color: {{ink2}}">{{t.detail}}</span></span>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rating":{"editor":"enum","options":["G","T","M","E","NR"],"default":"T"},"category":{"editor":"enum","options":["FF","FM","MM","Gen","Multi","Other","NA"],"default":"FM"},"warnings":{"editor":"enum","options":["none","undisclosed","present"],"default":"none"},"status":{"editor":"enum","options":["complete","wip","unknown"],"default":"wip"},"variant":{"editor":"enum","options":["grid","strip","labeled","inline"],"default":"grid"},"backed":{"editor":"boolean","default":true},"size":{"editor":"int","default":40,"min":10,"max":64},"only":{"editor":"enum","options":["all","rating","category","warnings","status"],"default":"all"},"warningCount":{"editor":null,"default":1},"chapters":{"editor":null,"default":""},"theme":{"editor":"enum","options":["light","sepia","dark"],"default":"light"},"$preview":{"width":84,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Math.max(10, Number(this.props.size ?? 40));
    const variant = this.props.variant ?? 'grid';
    const count = Number(this.props.warningCount ?? 1);
    const inline = variant === 'inline';
    const chapters = inline ? '' : (this.props.chapters ?? '');
    const solid = (bg, fg) => ({ bg, fg: fg || '#FFFFFF', shadow: 'none' });
    const soft = (bg, fg) => ({ bg: bg || '#E6E6EB', fg: fg || '#6C6C70', shadow: 'none' });
    const dash = (o) => ({ ...o, kind: 'dash' });
    const sans = "-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'SF Pro Text', system-ui, sans-serif";
    const sym = "'Apple Symbols', 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', sans-serif";
    const letter = (o, glyph) => ({ ...o, glyph, kind: 'text', font: sans, fs: Math.round(s * 0.6), weight: 800 });
    // Ratings: the letter cut out of a filled shield (owner, 2026-10-28; the app draws an outline today).
    const shield = (o, glyph) => ({ ...o, glyph, kind: 'shield' });
    const mark = (o, glyph, scale) => ({ ...o, glyph, kind: 'text', font: sym, fs: Math.round(s * scale), weight: 400 });

    const ratings = {
      G: { ...shield(solid('#2F8F3A'), 'G'), label: 'General', aria: 'General Audiences' },
      T: { ...shield(solid('#F5C400', '#3A2C00'), 'T'), label: 'Teen', aria: 'Teen And Up Audiences' },
      M: { ...shield(solid('#E07000'), 'M'), label: 'Mature', aria: 'Mature' },
      E: { ...shield(solid('#C8102E'), 'E'), label: 'Explicit', aria: 'Explicit' },
      NR: { ...shield(soft(), '?'), label: 'Not rated', aria: 'Not Rated' }
    };
    const categories = {
      FF: { ...mark(solid('#D2264B'), '⚢', 0.8), label: 'F/F' },
      FM: { ...mark(solid('#B3127A'), '⚤', 0.8), label: 'F/M' },
      MM: { ...mark(solid('#1E63C8'), '⚣', 0.8), label: 'M/M' },
      // Drawn, not typed: the ☉ character sat off-centre in every symbol font.
      Gen: { ...solid('#2F8F3A'), kind: 'gen', label: 'Gen' },
      Multi: { kind: 'multi', bg: '#FFFFFF', fg: '#FFFFFF', shadow: 'none', label: 'Multi' },
      Other: { ...mark(solid('#1C1C1E'), '♅', 0.78), label: 'Other' },
      NA: { ...dash(soft()), label: 'No category' }
    };
    const warnings = {
      none: { ...dash(soft()), label: 'No warnings', aria: 'No archive warnings' },
      undisclosed: { ...letter(solid('#E07000'), '?'), label: 'Not disclosed', aria: 'Warnings not disclosed' },
      present: { ...letter(solid('#C8102E'), '!'), label: count === 1 ? '1 warning' : count + ' warnings', aria: count === 1 ? '1 archive warning' : count + ' archive warnings' }
    };
    const statuses = {
      complete: { ...solid('#2F8F3A'), kind: 'check', label: 'Complete' },
      wip: { ...soft('#FFE6C2', '#B35A00'), kind: 'ring', label: inline ? 'WIP' : 'In progress' },
      unknown: { ...letter(soft(), '?'), label: 'Status unknown' }
    };

    const rating = ratings[this.props.rating ?? 'T'] || ratings.NR;
    const category = categories[this.props.category ?? 'FM'] || categories.NA;
    const warning = warnings[this.props.warnings ?? 'none'] || warnings.none;
    const status = statuses[this.props.status ?? 'wip'] || statuses.unknown;
    const showLabels = variant === 'labeled' || inline;
    const tiles = [rating, category, warning, { ...status, detail: chapters ? ' ' + chapters : '' }].map((t) => ({
      ...t,
      detail: t.detail || '',
      glyph: t.glyph || '',
      font: t.font || sans,
      fs: t.fs || 0,
      weight: t.weight || 400,
      isText: t.kind === 'text',
      isCheck: t.kind === 'check',
      isRing: t.kind === 'ring',
      isGen: t.kind === 'gen',
      isShield: t.kind === 'shield',
      isDash: t.kind === 'dash',
      isMulti: t.kind === 'multi'
    }));
    const only = { rating: 0, category: 1, warnings: 2, status: 3 }[this.props.only ?? 'all'];
    const gap = inline ? 10 : (showLabels ? 8 : Math.max(2, Math.round(s * 0.12)));
    // The full 2×2 grid sits on a rounded backing everywhere (owner, 2026-10-29), as on the
    // Author card. Single tiles (only=) and boards that draw their own backing (backed=false) don't.
    const backed = variant === 'grid' && only === undefined && this.props.backed !== false && this.props.backed !== 'false';
    const backPad = backed ? Math.round(s * 0.27) : 0;
    return {
      ink: { dark: '#F2F2F7', sepia: '#3B2F25' }[this.props.theme] || '#1C1C1E',
      ink2: { dark: '#AEAEB2', sepia: '#6B645A' }[this.props.theme] || '#6C6C70',
      tiles: only === undefined ? tiles : [tiles[only]],
      size: s,
      radius: Math.round(s * 0.24),
      icon: Math.round(s * 0.68),
      shieldIcon: Math.round(s * 0.84),
      shieldFs: Math.max(7, Math.round(s * 0.36)),
      shieldNudge: Math.max(0, Math.round(s * 0.02)),
      dashH: Math.max(2, Math.round(s * 0.11)),
      gap,
      backPad,
      backR: backed ? Math.round(s * 0.58) : 0,
      backBg: backed ? ({ dark: 'rgba(118, 118, 128, 0.24)', sepia: 'rgba(120, 92, 56, 0.12)' }[this.props.theme] || 'rgba(118, 118, 128, 0.12)') : 'transparent',
      showLabels,
      labelGap: inline ? 5 : (showLabels ? 7 : 0),
      chipPad: variant === 'labeled' ? '3px 11px 3px 3px' : '0',
      chipBg: variant === 'labeled' ? '#F2F2F7' : 'transparent',
      labelSize: Math.max(12, Math.round(s * 0.62)),
      display: showLabels ? 'flex' : 'inline-grid',
      cols: variant === 'strip' ? 'repeat(4, minmax(0, 1fr))' : 'repeat(2, minmax(0, 1fr))',
      aria: 'Rating: ' + (rating.aria || rating.label) + '. Category: ' + category.label + '. ' + (warning.aria || warning.label) + '. ' + status.label + (chapters ? ', ' + chapters + ' chapters' : '') + '.'
    };
  }
}
</script>
</body>
</html>

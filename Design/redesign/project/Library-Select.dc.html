<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selecting works in Reading Now</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 132px; right: 132px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Reading Now</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <button style="height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: inherit; font-size: 16px; font-weight: 500; color: #1C1C1E; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">Select All</button>
    <button style="height: 44px; padding: 0 20px; border: none; border-radius: 22px; font-family: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF; background: {{accent}}; box-shadow: 0 6px 20px rgba(0,0,0,0.12)">Done</button>
  </div>

  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <header style="padding: 0 4px; display: flex; flex-direction: column; gap: 2px">
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #6C6C70">2 of 6 selected · most recently read first</p>
    </header>
    <div style="margin: 0 -16px">
      <sc-for list="{{works}}" as="w" hint-placeholder-count="5">
        <dc-import name="WorkRow" work="{{w}}" selecting="{{true}}" selected="{{w.selected}}" divider="{{w.divider}}" accent="{{accent}}" hint-size="100%,108px"></dc-import>
      </sc-for>
    </div>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div role="toolbar" aria-label="Actions for 2 selected works" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 62px; border-radius: 31px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
    <button style="flex: 1; height: 54px; border: none; border-radius: 27px; background: transparent; color: #1C1C1E; font-family: inherit; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M4 11h12M4 16h7M17 14v6M14 17h6"></path></svg>
      Add to Queue
    </button>
    <button style="flex: 1; height: 54px; border: none; border-radius: 27px; background: transparent; color: #1C1C1E; font-family: inherit; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12v12H6zM8 5h8"></path></svg>
      Add to Collection
    </button>
    <button style="flex: 1; height: 54px; border: none; border-radius: 27px; background: transparent; color: #D70015; font-family: inherit; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg>
      Delete
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const works = [
      { title: "The Cartographer's Daughter", author: 'inkwell_moth', fandom: 'Original Work', rating: 'T', category: 'FM', warnings: 'none', status: 'wip', words: '84,210', chapters: '12/20', kudos: '3,104', progress: 58, progressLabel: 'Ch 7 · 58%', selected: true },
      { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', words: '118,402', chapters: '15/30', kudos: '5,870', progress: 40, progressLabel: 'Ch 12 · 40%', badge: '3 new' },
      { title: 'Moor and Mist', author: 'brontebird', fandom: 'Jane Eyre', rating: 'M', category: 'FM', warnings: 'undisclosed', status: 'complete', words: '54,200', chapters: '18/18', kudos: '2,310', progress: 61, progressLabel: 'Ch 11 · 61%', selected: true },
      { title: 'Letters Never Sent', author: 'marginalia', fandom: 'Persuasion', rating: 'T', category: 'FM', warnings: 'none', status: 'complete', words: '21,880', chapters: '4/4', kudos: '1,530', progress: 50, progressLabel: 'Ch 2 · 50%' },
      { title: 'Small Gods of the Kitchen', author: 'hearthwitch', fandom: 'Original Work', rating: 'G', category: 'Gen', warnings: 'none', status: 'wip', words: '12,400', chapters: '3/?', kudos: '410', progress: 20, progressLabel: 'Ch 1 · 20%' }
    ];
    return {
      accent: this.props.accent ?? '#990000',
      works: works.map((w, i) => ({ ...w, selected: !!w.selected, divider: i < works.length - 1 }))
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox › Filter (sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Filter Inbox" mode="sheet" confirm="Apply" height="844" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "rows": [
        {
          "label": "Show",
          "kind": "segments",
          "options": [
            "All",
            "Unread",
            "Replied"
          ],
          "selected": 1
        },
        {
          "label": "Sort",
          "kind": "segments",
          "options": [
            "Newest",
            "Oldest"
          ],
          "selected": 0
        }
      ]
    },
    {
      "header": "On",
      "rows": [
        {
          "label": "All works",
          "kind": "check",
          "on": true,
          "tile": "#8E8E93",
          "icon": "M4 6h16M4 12h16M4 18h16"
        },
        {
          "label": "Keeper of the Northern Light",
          "kind": "check",
          "cover": "linear-gradient(155deg, hsl(188, 46%, 27%), hsl(210, 50%, 41%))"
        },
        {
          "label": "Lantern Season",
          "kind": "check",
          "cover": "linear-gradient(155deg, hsl(203, 46%, 27%), hsl(225, 50%, 41%))"
        },
        {
          "label": "What the Tide Keeps",
          "kind": "check",
          "cover": "linear-gradient(155deg, hsl(176, 46%, 27%), hsl(198, 50%, 41%))"
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Reset Filters",
          "kind": "button"
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

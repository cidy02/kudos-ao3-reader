<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading Insights header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 204px; position: relative; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 style="position: absolute; left: 68px; right: 68px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap">Reading Insights</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <button aria-label="Back to Library" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button aria-label="More: options, export, how this is counted" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg>
    </button>
  </div>

  <div role="tablist" aria-label="Insights sections" style="position: absolute; left: 16px; right: 16px; top: 108px; height: 32px; border-radius: 16px; background: rgba(118,118,128,0.12); padding: 2px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{t.selected}}" style="border: none; border-radius: 14px; background: {{t.bg}}; box-shadow: {{t.shadow}}; font-family: inherit; font-size: 13px; font-weight: {{t.weight}}; color: #000000">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 152px; height: 48px; display: flex; align-items: center; gap: 8px">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; white-space: nowrap">{{period}}</h2>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #6C6C70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sub}}</p>
    </div>
    <button aria-label="Period: {{range}}" style="height: 32px; padding: 0 10px 0 12px; border: none; border-radius: 16px; background: rgba(118,118,128,0.12); font-family: inherit; font-size: 15px; font-weight: 500; color: #1C1C1E; display: flex; align-items: center; gap: 4px">{{range}}<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
    <button aria-label="Previous period" style="width: 32px; height: 32px; border: none; border-radius: 16px; background: rgba(118,118,128,0.12); color: #1C1C1E; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button aria-label="Next period" aria-disabled="true" style="width: 32px; height: 32px; border: none; border-radius: 16px; background: rgba(118,118,128,0.08); color: #C7C7CC; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"select","default":"overview","options":["overview","taste","habits","library"]},"period":{"editor":"text","default":"October 2026"},"sub":{"editor":"text","default":"1–27 Oct · vs September"},"range":{"editor":"text","default":"Month"},"$preview":{"width":390,"height":204}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = this.props.tab ?? 'overview';
    const names = [['overview', 'Overview'], ['taste', 'Taste'], ['habits', 'Habits'], ['library', 'Library']];
    return {
      period: this.props.period ?? 'October 2026',
      sub: this.props.sub ?? '1–27 Oct · vs September',
      range: this.props.range ?? 'Month',
      tabs: names.map(([id, label]) => {
        const on = id === tab;
        return { label, selected: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', shadow: on ? '0 2px 6px rgba(0,0,0,0.12)' : 'none', weight: on ? 600 : 400 };
      })
    };
  }
}
</script>
</body>
</html>

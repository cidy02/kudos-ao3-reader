<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search › Rank Top 100, running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1240px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <main style="padding: 64px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0 4px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Search</h1>

    <section aria-label="AO3 results, ranked" style="display: flex; flex-direction: column; gap: 10px">
      <div style="padding: 0 4px; display: flex; align-items: center; gap: 8px">
        <h2 style="margin: 0; flex: 1; font-size: 20px; line-height: 25px; font-weight: 700">On AO3 <span style="font-size: 15px; font-weight: 400; color: #6C6C70">{{total}} works</span></h2>
        <button aria-label="Sort by: Hidden Gems" style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: #EFEFF4; font-family: inherit; font-size: 14px; color: #000000; display: flex; align-items: center; gap: 5px">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5856D6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.8 2.2 2.2.8-2.2.8L18 21l-.8-2.2-2.2-.8 2.2-.8z"></path></svg>Hidden Gems
          <svg aria-hidden="true" width="10" height="14" viewBox="0 0 12 16" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6 6 2.5 9.5 6M2.5 10 6 13.5 9.5 10"></path></svg>
        </button>
        <button aria-label="Filters, 2 active" style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 5px">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>2
        </button>
      </div>

      <div aria-label="Sent to AO3" style="padding: 0 4px; display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{sent}}" as="c" hint-placeholder-count="2">
          <button aria-label="Remove {{c}}" style="height: 30px; padding: 0 6px 0 10px; border: none; border-radius: 15px; background: rgba(153,0,0,0.10); color: #990000; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px">{{c}}<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="opacity: 0.7"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
        </sc-for>
      </div>

      <div role="status" aria-label="Ranking the top 100, page {{page}} of 5" style="margin: 0 4px; padding: 10px 12px; border-radius: 14px; background: #F2F2F7; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; line-height: 18px; font-weight: 600">Ranking the top 100 · page {{page}} of 5</span>
          <span aria-hidden="true" style="height: 4px; border-radius: 2px; background: #E5E5EA; overflow: hidden"><span style="display: block; width: {{progress}}; height: 4px; background: #990000"></span></span>
          <span style="font-size: 12px; line-height: 16px; color: #6C6C70">One page every 3 seconds · {{loaded}} works so far</span>
        </span>
        <button style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: #FFFFFF; color: #990000; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.06)">Cancel</button>
      </div>

      <div style="margin: 0 -16px">
        <dc-import name="WorkRow" work="{{r1}}" show-summary="{{true}}" divider="{{true}}" accent="{{accent}}" hint-size="100%,160px"></dc-import>
        <dc-import name="WorkRow" work="{{r2}}" show-summary="{{true}}" divider="{{true}}" accent="{{accent}}" hint-size="100%,160px"></dc-import>
        <dc-import name="WorkRow" work="{{r3}}" show-summary="{{true}}" accent="{{accent}}" hint-size="100%,160px"></dc-import>
      </div>

      <h3 style="margin: 6px 4px 0; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6C6C70">Not ranked · 1</h3>
      <div style="margin: 0 -16px">
        <dc-import name="WorkRow" work="{{odd}}" accent="{{accent}}" hint-size="100%,112px"></dc-import>
      </div>

      <p style="margin: 0; padding: 6px 4px; font-size: 13px; line-height: 18px; color: #6C6C70">{{loaded}} of {{total}} loaded · ranking updates as each page arrives</p>
    </section>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; gap: 10px; align-items: center">
    <button aria-label="Back to Browse" style="width: 54px; height: 54px; flex-shrink: 0; border: none; border-radius: 27px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>
    </button>
    <label style="flex: 1; height: 54px; border-radius: 27px; padding: 0 8px 0 16px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; color: #6C6C70; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
      <input type="search" aria-label="Search Kudos and AO3" value="lighthouse" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 17px; color: #000000; outline: none">
      <button aria-label="Clear search" style="width: 36px; height: 36px; border: none; border-radius: 18px; background: transparent; color: #8E8E93; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"></circle><path d="M9 9l6 6M15 9l-6 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
      </button>
    </label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    // Rank Top 100 (owner approved 2026-10-28; notes/quality-signals-spec.md section 13): one tap
    // loads pages 2 to 5 of this same search, one every 3 seconds, cancellable, each request
    // tagged "feature=rank-top-100" in the User-Agent; then ranks up to 100 works. Mid-run: page 3.
    // Hidden Gems: AO3 sorts by kudos with "hits 300 to 5,000" in the query; Kudos re-ranks
    // the loaded works by the cautious estimate and shows the shrunk one. Worked values:
    // r1 9.4% vs 3.9% -> 2.4x (cautious 2.3x); r2 10.8% vs 5.6% -> 1.8x (1.7x);
    // r3 6.8% vs 4.3% -> 1.6x (1.5x). The set-aside row has more kudos than hits.
    return {
      accent: this.props.accent ?? '#990000',
      total: '1,284',
      loaded: '60',
      page: '3',
      progress: '60%',
      sent: ['Hits 300 to 5,000', 'Most kudos first'],
      r1: { title: 'Keeper of the Northern Light', author: 'saltwindow', fandom: 'Original Work', rating: 'T', category: 'FF', warnings: 'none', status: 'complete', words: '22,410', chapters: '7/7', kudos: '1,804', hits: '19.2k', updated: 'Oct 12', summary: 'Two keepers, one winter, and a logbook that keeps writing itself after midnight.', signal: { label: '2.4× kudos per hit', note: 'Steady · 26% saved', tone: 'high' } },
      r2: { title: 'What the Lamp Saw', author: 'quietharbor', fandom: 'To the Lighthouse', rating: 'G', category: 'Gen', warnings: 'none', status: 'wip', words: '5,060', chapters: '2/5', kudos: '312', hits: '2.9k', updated: 'Oct 20', summary: 'The Ramsays’ summer, told by the one thing that watched it all.', signal: { label: '1.8× kudos per hit', note: 'Early · few readers yet', tone: 'high' } },
      r3: { title: 'The Fog Bell Ledger', author: 'harborlight', fandom: 'Original Work', rating: 'T', category: 'FM', warnings: 'none', status: 'complete', words: '61,250', chapters: '18/18', kudos: '960', hits: '14.1k', updated: '14 Mar 2019', summary: 'A bell that rings for ships that never came in, and the clerk who logs every one.', signal: { label: '1.6× kudos per hit', note: 'Steady · 31% saved', tone: 'high' } },
      odd: { title: 'Every Lamp in the Harbour', author: 'mistralfox', fandom: 'Original Work', rating: 'G', category: 'Gen', warnings: 'none', status: 'complete', words: '940', chapters: '1/1', kudos: '18,420', hits: '1,180', updated: 'Oct 2', signal: { label: 'Unusual stats', note: 'More kudos than hits', tone: 'unusual' } }
    };
  }
}
</script>
</body>
</html>

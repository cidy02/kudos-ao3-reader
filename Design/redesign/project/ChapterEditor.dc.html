<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chapter editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">

  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; align-items: center; gap: 8px; z-index: 3">
    <button aria-label="Back to the work" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(242,242,247,0.92); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></button>
    <div style="height: 44px; border-radius: 22px; display: flex; border: none; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(242,242,247,0.92); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.06)">
      <button aria-label="Undo" style="width: 44px; height: 44px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12"></path></svg></button>
      <button aria-label="Redo" style="width: 44px; height: 44px; border: none; background: transparent; color: #AEAEB2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H10a6 6 0 0 0 0 12"></path></svg></button>
    </div>
    <span style="flex: 1"></span>
    <div style="height: 44px; border-radius: 22px; display: flex; border: none; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(242,242,247,0.92); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.06)">
      <button aria-label="Reading view" aria-pressed="{{readPressed}}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{readBg}}; color: {{readFg}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5c2.8-1.2 5.6-1.2 8.5.8 2.9-2 5.7-2 8.5-.8v13c-2.8-1.2-5.6-1.2-8.5.8-2.9-2-5.7-2-8.5-.8zM12 6.3v13.5"></path></svg></button>
      <button aria-label="Format" aria-pressed="{{fmtPressed}}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{fmtBg}}; color: {{fmtFg}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5-7.8 7.8-5-5zM6.7 12.3c-1.8 0-3.2 1.4-3.2 3.2 0 1.6-.6 2.6-1 3 3.2.8 6.8-.2 7.8-2.6"></path></svg></button>
      <button aria-label="More: Preview on AO3, Paste as plain text, Restore local copy, Editor help, Delete chapter" aria-haspopup="menu" style="width: 44px; height: 44px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg></button>
    </div>
    <button style="height: 44px; flex-shrink: 0; padding: 0 16px; border: none; border-radius: 22px; font-family: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF; background: {{accent}}">Done</button>
  </div>

  <main style="padding: 106px 22px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; line-height: 18px; color: #6C6C70">Chapter 1 of 3 · What the Tide Keeps</span>
    <sc-if value="{{isEdit}}" hint-placeholder-val="{{true}}">
      <input aria-label="Chapter title" type="text" value="The Logbook" style="border: none; border-bottom: 0.5px solid #D1D1D6; padding: 2px 0 8px; font-family: inherit; font-size: 22px; line-height: 28px; font-weight: 700; outline: none; background: transparent">
    </sc-if>
    <sc-if value="{{isPreview}}" hint-placeholder-val="{{false}}">
      <h1 style="margin: 0 0 6px; font-family: 'New York', 'Iowan Old Style', Georgia, serif; font-size: 26px; line-height: 32px; font-weight: 700">The Logbook</h1>
    </sc-if>
    <div role="textbox" aria-multiline="true" aria-label="{{bodyLabel}}" style="display: flex; flex-direction: column; gap: {{paraGap}}px; font-family: 'New York', 'Iowan Old Style', Georgia, serif; font-size: 16px; line-height: 1.6; color: #1C1C1E">
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="4">
        <sc-if value="{{b.isRule}}" hint-placeholder-val="{{false}}">
          <div aria-hidden="true" style="height: 1px; margin: 6px 30%; background: #C7C7CC"></div>
        </sc-if>
        <sc-if value="{{b.isText}}" hint-placeholder-val="{{true}}">
          <p style="margin: 0; text-indent: {{b.indent}}; font-size: {{b.size}}px; font-weight: {{b.weight}}">
            <sc-for list="{{b.segs}}" as="s" hint-placeholder-count="3"><span style="font-family: {{s.font}}; font-size: {{s.fs}}; font-style: {{s.italic}}; color: {{s.color}}; background: {{s.bg}}; border-radius: 3px">{{s.t}}</span></sc-for>
          </p>
        </sc-if>
      </sc-for>
    </div>
  </main>

  <sc-if value="{{isKeyboard}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 292px; background: #D1D3D9; padding: 10px 3px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 11px">
      <sc-for list="{{keyRows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; justify-content: center; gap: 6px; padding: {{r.pad}}">
          <sc-for list="{{r.keys}}" as="k" hint-placeholder-count="10">
            <span style="flex: {{k.flex}}; height: 44px; border-radius: 7px; background: {{k.bg}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: {{k.fs}}; color: #000000">{{k.t}}</span>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div role="toolbar" aria-label="Formatting" style="position: absolute; left: 8px; right: 8px; bottom: 300px; height: 48px; border-radius: 24px; padding: 0 6px; display: flex; align-items: center; gap: 2px; background: rgba(250,250,252,0.94); box-shadow: 0 4px 16px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.08)">
      <button aria-label="Paragraph style: Paragraph" aria-haspopup="menu" style="height: 36px; padding: 0 10px; border: none; border-radius: 18px; background: rgba(118,118,128,0.12); font-family: inherit; font-size: 14px; font-weight: 600; color: #1C1C1E; display: flex; align-items: center; gap: 4px; flex-shrink: 0">Paragraph<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"></path></svg></button>
      <span aria-hidden="true" style="width: 0.5px; height: 24px; margin: 0 4px; background: #C7C7CC"></span>
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
        <button aria-label="{{q.label}}" aria-pressed="{{q.pressed}}" style="width: 38px; height: 36px; flex-shrink: 0; border: none; border-radius: 10px; background: {{q.bg}}; color: {{q.fg}}; font-family: {{q.font}}; font-size: 17px; font-weight: {{q.weight}}; font-style: {{q.style}}; text-decoration: {{q.deco}}; display: flex; align-items: center; justify-content: center">{{q.glyph}}</button>
      </sc-for>
      <span aria-hidden="true" style="width: 0.5px; height: 24px; margin: 0 4px; background: #C7C7CC"></span>
      <button aria-label="Bullets" style="width: 38px; height: 36px; flex-shrink: 0; border: none; border-radius: 10px; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"></path></svg></button>
      <button aria-label="Insert: Link, Line break, Divider" aria-haspopup="menu" style="width: 38px; height: 36px; flex-shrink: 0; border: none; border-radius: 10px; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <span style="position: absolute; right: 22px; bottom: 360px; padding: 4px 10px; border-radius: 12px; background: rgba(118,118,128,0.12); font-size: 12px; line-height: 16px; color: #6C6C70">4,120 words</span>
  </sc-if>

  <sc-if value="{{isFormat}}" hint-placeholder-val="{{false}}">
    <section role="dialog" aria-label="Format" style="position: absolute; left: 0; right: 0; bottom: 0; height: 412px; border-radius: 34px 34px 0 0; background: #F2F2F7; box-shadow: 0 -6px 24px rgba(0,0,0,0.12); padding: 8px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC; margin: 0 auto"></div>
      <header style="display: flex; align-items: center; justify-content: space-between; margin-top: -4px">
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Format</h2>
        <button aria-label="Close" style="width: 32px; height: 32px; border: none; border-radius: 16px; background: rgba(118,118,128,0.14); color: #6C6C70; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </header>

      <div role="radiogroup" aria-label="Paragraph style" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{styles}}" as="p" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{p.checked}}" aria-label="{{p.name}}" style="height: 74px; padding: 8px 4px 6px; border: none; border-radius: 12px; background: #FFFFFF; box-shadow: {{p.ring}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: space-between">
            <span style="font-family: 'New York', Georgia, serif; font-size: {{p.ps}}px; line-height: 1.1; font-weight: {{p.pw}}; font-style: {{p.pi}}; color: #1C1C1E; border-left: {{p.bar}}; padding-left: {{p.padL}}">{{p.sample}}</span>
            <span style="display: flex; flex-direction: column; align-items: center; gap: 1px">
              <span style="font-size: 12px; line-height: 15px; font-weight: 600; color: {{p.nameColor}}">{{p.name}}</span>
              <span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 10px; line-height: 12px; color: #8E8E93">{{p.tag}}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <div style="background: #FFFFFF; border-radius: 12px; padding: 6px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{chars}}" as="c" hint-placeholder-count="8">
          <button aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" style="height: 50px; border: none; border-radius: 9px; background: {{c.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
            <span style="font-family: {{c.font}}; font-size: 18px; line-height: 20px; font-weight: {{c.weight}}; font-style: {{c.style}}; text-decoration: {{c.deco}}; color: {{c.fg}}">{{c.glyph}}</span>
            <span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 10px; line-height: 12px; color: {{c.tagColor}}">{{c.tag}}</span>
          </button>
        </sc-for>
      </div>

      <div style="background: #FFFFFF; border-radius: 12px; padding: 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{inserts}}" as="i" hint-placeholder-count="5">
          <button aria-label="{{i.name}}" style="height: 50px; border: none; border-radius: 9px; background: transparent; color: #1C1C1E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.d}}"></path></svg>
            <span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 10px; line-height: 12px; color: #8E8E93">{{i.tag}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{isPreview}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.95) 60%); pointer-events: none"></div>
    <div style="position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); height: 40px; padding: 0 16px; border-radius: 20px; display: flex; align-items: center; gap: 8px; white-space: nowrap; background: rgba(250,250,252,0.94); box-shadow: 0 4px 16px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.08); font-size: 13px; color: #3A3A3C">
      <span>Reading view</span><span aria-hidden="true" style="color: #C7C7CC">·</span><span>4,120 words · about 18 min</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["keyboard","format","preview"],"default":"keyboard"},"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // The app's chapter editor (WritingTextEditor): a plain AO3 HTML buffer in a serif,
    // every control labelled with the tag it writes (AO3Markup.writing, all 17 tags).
    // Pages-style chrome: a shortcut bar over the keyboard, a Format panel that takes the
    // keyboard's place, and a reading view (the app's Preview).
    const accent = this.props.accent ?? '#990000';
    const view = this.props.view ?? 'keyboard';
    const edit = view !== 'preview';
    const mono = "'SF Mono', ui-monospace, Menlo, monospace";
    const serif = 'inherit';
    const TAG = (t) => ({ t, font: mono, fs: '12.5px', italic: 'normal', color: '#A1A1A6', bg: 'transparent' });
    const TX = (t) => ({ t, font: serif, fs: 'inherit', italic: 'normal', color: 'inherit', bg: 'transparent' });
    const EM = (t, sel) => ({ t, font: serif, fs: 'inherit', italic: 'italic', color: 'inherit', bg: sel ? 'rgba(10,132,255,0.22)' : 'transparent' });
    const P = (segs, o) => ({ isText: true, isRule: false, indent: '0', size: 16, weight: 400, segs, ...o });
    const editBlocks = [
      P([TAG('<p>'), TX('The lamp had to be lit by four. Ines had kept that hour for eleven years, and the logbook said so in her small square hand.'), TAG('</p>')]),
      P([TAG('<p>'), TX('She had not written that line. Nobody had. It was there in the morning in a hand that was nearly hers, the way a '), TAG('<em>'), EM('reflection', true), TAG('</em>'), TX(' is nearly you.'), TAG('</p>')]),
      P([TAG('<hr />')]),
      P([TAG('<p>'), TX('“You’re early,” Wren said from the stair.'), TAG('</p>')])
    ];
    const readBlocks = [
      P([TX('The lamp had to be lit by four. Ines had kept that hour for eleven years, and the logbook said so in her small square hand.')], { indent: '0' }),
      P([TX('She had not written that line. Nobody had. It was there in the morning in a hand that was nearly hers, the way a '), EM('reflection', false), TX(' is nearly you.')], { indent: '1.3em' }),
      { isText: false, isRule: true, segs: [] },
      P([TX('“You’re early,” Wren said from the stair.')]),
      P([TX('Ines closed the book. The new line stayed where it was, patient as weather, and the lamp waited for four.')], { indent: '1.3em' })
    ];
    const sans = '-apple-system, system-ui, sans-serif';
    const q = (label, glyph, o) => ({ label, glyph, pressed: 'false', bg: 'transparent', fg: '#1C1C1E', font: sans, weight: 500, style: 'normal', deco: 'none', ...o });
    const ch = (name, glyph, tag, o) => ({ name, glyph, tag: '<' + tag + '>', pressed: 'false', bg: 'transparent', fg: '#1C1C1E', tagColor: '#8E8E93', font: sans, weight: 500, style: 'normal', deco: 'none', ...o });
    const on = { pressed: 'true', bg: 'rgba(153,0,0,0.10)', fg: accent, tagColor: accent };
    const st = (name, tag, sample, o) => ({ name, tag: '<' + tag + '>', sample, checked: 'false', ring: '0 0 0 0.5px rgba(0,0,0,0.06)', nameColor: '#1C1C1E', ps: 14, pw: 400, pi: 'normal', bar: 'none', padL: '0', ...o });
    const keys = (s, o) => s.split(' ').map((t) => ({ t, flex: 1, bg: '#FFFFFF', fs: '22px', ...o }));
    return {
      accent,
      isEdit: edit, isPreview: !edit, isKeyboard: view === 'keyboard', isFormat: view === 'format',
      bodyLabel: edit ? 'Chapter text, AO3 HTML' : 'Chapter text as AO3 shows it',
      paraGap: edit ? 10 : 6,
      blocks: edit ? editBlocks : readBlocks,
      readPressed: edit ? 'false' : 'true', readBg: edit ? 'transparent' : accent, readFg: edit ? '#1C1C1E' : '#FFFFFF',
      fmtPressed: view === 'format' ? 'true' : 'false', fmtBg: view === 'format' ? accent : 'transparent', fmtFg: view === 'format' ? '#FFFFFF' : '#1C1C1E',
      quick: [
        q('Bold, strong', 'B', { weight: 800 }),
        q('Italic, em', 'I', { style: 'italic', font: 'Georgia, serif', pressed: 'true', bg: 'rgba(153,0,0,0.10)', fg: accent }),
        q('Underline, u', 'U', { deco: 'underline' }),
        q('Strike, s', 'S', { deco: 'line-through' })
      ],
      styles: [
        st('Paragraph', 'p', 'Aa', { checked: 'true', ring: '0 0 0 2px ' + accent, nameColor: accent }),
        st('Heading', 'h3', 'Aa', { ps: 19, pw: 700 }),
        st('Quote', 'blockquote', 'Aa', { pi: 'italic', bar: '2px solid #C7C7CC', padL: '6px' }),
        st('Spoiler', 'details', '▸ Aa', {})
      ],
      chars: [
        ch('Bold', 'B', 'strong', { weight: 800 }),
        ch('Italic', 'I', 'em', { style: 'italic', font: 'Georgia, serif', ...on }),
        ch('Underline', 'U', 'u', { deco: 'underline' }),
        ch('Strike', 'S', 's', { deco: 'line-through' }),
        ch('Superscript', 'x²', 'sup', {}),
        ch('Subscript', 'x₂', 'sub', {}),
        ch('Small', 'Aa', 'small', { weight: 400 }),
        ch('Code', '{ }', 'code', { font: "'SF Mono', ui-monospace, Menlo, monospace", weight: 500 })
      ],
      inserts: [
        { name: 'Bullets', tag: '<ul>', d: 'M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01' },
        { name: 'Numbers', tag: '<ol>', d: 'M10 6.5h10M10 12h10M10 17.5h10M4 5.5h1.5v3M4 8.5h3M4 11h2.5l-2.5 3h3M4 16h3l-1.5 1.5c1 0 1.5.5 1.5 1.2S6.4 20 5.5 20H4' },
        { name: 'Link', tag: '<a href>', d: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1' },
        { name: 'Line break', tag: '<br>', d: 'M19 5v6a3 3 0 0 1-3 3H5M9 10l-4 4 4 4' },
        { name: 'Divider', tag: '<hr>', d: 'M4 12h16' }
      ],
      keyRows: [
        { pad: '0', keys: keys('q w e r t y u i o p') },
        { pad: '0 18px', keys: keys('a s d f g h j k l') },
        { pad: '0', keys: [{ t: '⇧', flex: 1.4, bg: '#ABB0BA', fs: '18px' }, ...keys('z x c v b n m'), { t: '⌫', flex: 1.4, bg: '#ABB0BA', fs: '18px' }] },
        { pad: '0', keys: [{ t: '123', flex: 1.3, bg: '#ABB0BA', fs: '15px' }, { t: 'space', flex: 5, bg: '#FFFFFF', fs: '15px' }, { t: 'return', flex: 2, bg: '#ABB0BA', fs: '15px' }] }
      ]
    };
  }
}
</script>
</body>
</html>

<html lang="en">

<body>
<x-dc>
<helmet>

body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1500px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">

    </button>
    <button aria-label="Save Search" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4zM12 7.5v5M9.5 10h5"></path></svg>

  </div>

  <main style="padding: 110px 0 0; display: flex; flex-direction: column; gap: 10px">
    <header style="padding: 0 20px 4px; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">“{{query}}”</h1>
      <span style="font-size: 15px; line-height: 20px; color: #6C6C70">{{total}} works on AO3</span>
    </header>
    <div style="padding: 0 16px; display: flex; align-items: center; gap: 8px">
      <button aria-label="Sort by: Best Match" style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: #EFEFF4; font-family: inherit; font-size: 14px; color: #000000; display: flex; align-items: center; gap: 4px">Best Match

        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h10M4 15h16M4 19h10"></path></svg>
      </button>
    </div>
    <div aria-label="Active filters" style="padding: 0 16px; display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{active}}" as="c" hint-placeholder-count="2">
        <button aria-label="{{c}}, opens Filters" style="height: 30px; padding: 0 10px; border: none; border-radius: 15px; background: #EFEFF4; color: #1C1C1E; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center">{{c}}</button>
      </sc-for>
    </div>

    <div role="list" aria-label="Results" style="margin-top: 2px; border-top: 0.5px solid #D1D1D6">
      <sc-for list="{{works}}" as="w" hint-placeholder-count="6">
        <div role="listitem">
          <dc-import name="WorkRow" work="{{w}}" ledger="{{true}}" wide="{{true}}" divider="{{w.divider}}" accent="{{accent}}" hint-size="100%,150px"></dc-import>
        </div>
      </sc-for>
    </div>

    <div role="status" style="padding: 6px 16px 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: #6C6C70; font-size: 13px; line-height: 18px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9" opacity="0.9"></path></svg>
      <span>{{loaded}} of {{total}} · loading page 2</span>
    </div>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; gap: 10px; align-items: center">
    <button aria-label="Back to Browse" style="width: 54px; height: 54px; flex-shrink: 0; border: none; border-radius: 27px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>
    </button>
    <label style="flex: 1; height: 54px; border-radius: 27px; padding: 0 8px 0 16px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; color: #6C6C70; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
      <input type="search" aria-label="Search Kudos and AO3" value="{{query}}" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 17px; color: #000000; outline: none">
      <button aria-label="Clear search" style="width: 36px; height: 36px; border: none; border-radius: 18px; background: transparent; color: #8E8E93; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"></circle><path d="M9 9l6 6M15 9l-6 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
      </button>
    </label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#821019"},"$preview":{"width":390,"height":1500}}'>

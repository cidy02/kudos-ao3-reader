<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 107px; right: 107px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Inbox</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <button aria-label="Back to Account" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button style="height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: inherit; font-size: 16px; color: #1C1C1E; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">Select</button>
  </div>
  <main style="padding: 106px 0 0; display: flex; flex-direction: column; gap: 10px">
    <header style="padding: 0 20px; display: flex; flex-direction: column; gap: 2px">
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #6C6C70">3 unread</p>
    </header>
    <div style="background: #FFFFFF">
      <sc-for list="{{items}}" as="m" hint-placeholder-count="4">
        <div style="position: relative; overflow: hidden; border-top: 0.5px solid #E5E5EA">
          <sc-if value="{{m.swiped}}" hint-placeholder-val="{{false}}">
            <div style="position: absolute; right: 0; top: 0; bottom: 0; display: flex">
              <button style="width: 74px; border: none; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Unread</button>
              <button style="width: 74px; border: none; background: #D70015; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Delete</button>
            </div>
          </sc-if>
          <div style="position: relative; background: #FFFFFF; transform: translateX({{m.shift}}px); display: flex; gap: 10px; padding: 12px 16px 12px 10px">
            <span aria-label="{{m.dotLabel}}" style="width: 10px; height: 10px; margin-top: 6px; flex-shrink: 0; border-radius: 5px; background: {{m.dot}}"></span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <div style="display: flex; align-items: baseline; gap: 8px">
                <span style="flex: 1; font-size: 16px; line-height: 21px; font-weight: {{m.weight}}">{{m.from}}</span>
                <sc-if value="{{m.replied}}" hint-placeholder-val="{{false}}"><svg aria-label="Replied" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7 5 12l5 5M5 12h9a5 5 0 0 1 5 5v1"></path></svg></sc-if>
                <span style="font-size: 14px; color: #6C6C70">{{m.time}}</span>
              </div>
              <span style="font-size: 14px; line-height: 19px; color: #3A3A3C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.on}}</span>
              <span style="font-size: 14px; line-height: 19px; color: #6C6C70; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{m.body}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </main>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 54px; border-radius: 27px; padding: 0 6px 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
    <button aria-label="Filter: on" aria-pressed="true" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{accentTint}}; color: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 13px; font-weight: 600">Filtered by:</span>
      <span style="font-size: 13px; color: {{accent}}">Unread</span>
    </div>
    <button aria-label="Inbox settings on AO3" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const hex = accent.replace('#', '');
    const tint = 'rgba(' + parseInt(hex.slice(0, 2), 16) + ',' + parseInt(hex.slice(2, 4), 16) + ',' + parseInt(hex.slice(4, 6), 16) + ',0.10)';
    const items = [
      { from: 'tidewright', time: '9:12', on: 'on Keeper of the Northern Light · Chapter 7', body: 'The bit with the logbook writing itself — I had to stop and check my own door was locked.', unread: true },
      { from: 'marginalia', time: 'Yesterday', on: 'Reply to your comment on Letters Never Sent', body: 'Ha, yes! The navy list joke was entirely for you.', unread: true, swiped: true },
      { from: 'quietharbor', time: 'Mon', on: 'on Keeper of the Northern Light · Chapter 6', body: 'Long-time lurker. This one finally got me to log in to say thank you.', unread: true, replied: false },
      { from: 'anne_at_lyme', time: 'Oct 20', on: 'on Keeper of the Northern Light · Chapter 1', body: 'Bookmarking for the winter. The first line alone sold me.', unread: false, replied: true }
    ];
    return {
      accent,
      accentTint: tint,
      items: items.map((m) => ({
        ...m,
        replied: !!m.replied,
        swiped: !!m.swiped,
        shift: m.swiped ? -148 : 0,
        dot: m.unread ? accent : 'transparent',
        dotLabel: m.unread ? 'Unread' : 'Read',
        weight: m.unread ? 600 : 400
      }))
    };
  }
}
</script>
</body>
</html>

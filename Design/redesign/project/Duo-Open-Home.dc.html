<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
a{color:#990000}a:hover{color:#6E0000}
</style>
</helmet>
<div style="width: 951px; height: 669px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div style="position: absolute; left: 10px; top: 10px; z-index: 2">
    <dc-import name="DuoSidebar" selected="home" accent="#990000" hint-size="232px,649px"></dc-import>
  </div>

  <main style="position: absolute; left: 252px; right: 0; top: 0; padding: 18px 16px 0 20px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Home</h1>
        <a href="Insights.dc.html" style="text-decoration: none; font-size: 15px; line-height: 20px; color: #6C6C70"><span style="font-weight: 600; color: #3A3A3C">4 h 10 m</span> this week · <span style="font-weight: 600; color: #3A3A3C">2</span> finished · <span style="font-weight: 600; color: #3A3A3C">9-day</span> streak ›</a>
      </div>
      <button style="height: 40px; padding: 0 16px; border: none; border-radius: 20px; font-family: inherit; font-size: 17px; color: #1C1C1E; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">Select</button>
    </header>

    <div style="display: flex; gap: 20px; align-items: flex-start">
      <dc-import name="ResumeCard" variant="home" width="340" accent="#990000" hint-size="340px,280px"></dc-import>
      <section aria-label="Reading Now" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Reading Now</h2>
          <a href="Library-Section.dc.html" style="font-size: 17px; text-decoration: none">See All</a>
        </div>
        <div style="display: flex; gap: 12px; overflow: hidden">
          <sc-for list="{{reading}}" as="w" hint-placeholder-count="3">
            <dc-import name="CoverCard" work="{{w}}" width="96" accent="#990000" hint-size="96px,220px"></dc-import>
          </sc-for>
        </div>
      </section>
    </div>

    <div style="display: flex; gap: 20px; align-items: flex-start">
      <section aria-label="New Chapters" style="width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">New Chapters</h2>
          <a href="Subscriptions.dc.html" style="font-size: 17px; text-decoration: none">See All</a>
        </div>
        <div style="margin-left: -16px">
          <sc-for list="{{updated}}" as="w" hint-placeholder-count="2">
            <dc-import name="WorkRow" work="{{w}}" divider="{{w.divider}}" accent="#990000" hint-size="100%,100px"></dc-import>
          </sc-for>
        </div>
      </section>
      <section aria-label="Reading Queues" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Reading Queues</h2>
          <a href="Queues.dc.html" style="font-size: 17px; text-decoration: none">All Queues</a>
        </div>
        <sc-for list="{{queues}}" as="q" hint-placeholder-count="2">
          <a href="Queue.dc.html" style="text-decoration: none; color: #000000; display: flex; align-items: center; gap: 12px">
            <dc-import name="CoverStack" tiles="{{q.tiles}}" colour="{{q.colour}}" initial="{{q.initial}}" kind="queue" width="64" height="64" hint-size="64px,64px"></dc-import>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 17px; line-height: 22px; font-weight: 600">{{q.name}}</span>
              <span style="font-size: 13px; line-height: 18px; color: #6C6C70">{{q.detail}}</span>
              <div role="img" aria-label="{{q.progressLabel}}" style="margin-top: 3px; display: flex; gap: 3px">
                <sc-for list="{{q.segs}}" as="s" hint-placeholder-count="8">
                  <span style="flex: 1; height: 4px; border-radius: 2px; background: {{s.track}}; overflow: hidden"><span style="display: block; width: {{s.w}}; height: 4px; background: {{s.c}}"></span></span>
                </sc-for>
              </div>
            </div>
          </a>
        </sc-for>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":951,"height":669}}'>
class Component extends DCLogic {
  renderVals() {
    const art = (h) => 'linear-gradient(155deg, hsl(' + h + ', 46%, 27%), hsl(' + ((h + 22) % 360) + ', 50%, 41%))';
    const rgba = (hex, a) => { const x = hex.replace('#', ''); return 'rgba(' + parseInt(x.slice(0, 2), 16) + ',' + parseInt(x.slice(2, 4), 16) + ',' + parseInt(x.slice(4, 6), 16) + ',' + a + ')'; };
    const queue = (name, detail, colour, hues, fills, label) => ({ name, detail, progressLabel: label, colour, initial: name.charAt(0), tiles: hues.map(art), segs: fills.map((f) => ({ w: f + '%', c: colour, track: rgba(colour, 0.2) })) });
    const updated = [
      { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', words: '118k', chapters: '15/30', updated: '3 new · 2 h ago', badge: '+3' },
      { title: 'The Hound, Revisited', author: 'fogandlamplight', fandom: 'Sherlock Holmes', rating: 'T', category: 'MM', warnings: 'present', status: 'wip', words: '30k', chapters: '5/?', updated: '1 new · yesterday', badge: '+1' }
    ];
    return {
      reading: [
        { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', meta: 'Ch 12 · 40%', progress: 40, badge: '+3' },
        { title: 'Whatever Remains', author: 'fogandlamplight', fandom: 'Sherlock Holmes', rating: 'E', category: 'MM', warnings: 'present', warningCount: 2, status: 'complete', hidden: true },
        { title: 'Letters Never Sent', author: 'marginalia', fandom: 'Persuasion', rating: 'T', category: 'FM', warnings: 'none', status: 'complete', meta: 'Ch 3 · 50%', progress: 50 },
        { title: 'Moor and Mist', author: 'brontebird', fandom: 'Jane Eyre', rating: 'M', category: 'FM', warnings: 'undisclosed', status: 'complete', meta: 'Ch 11 · 61%', progress: 61 }
      ],
      updated: updated.map((w, i) => ({ ...w, divider: i < updated.length - 1 })),
      queues: [
        queue('Summer Reading', '8 works · about 9 h 40 min', '#C25E00', [181, 340, 28, 266], [100, 100, 60, 0, 0, 0, 0, 0], '2 of 8 finished, 1 in progress'),
        queue('Re-reads', '5 works · about 4 h 5 min', '#1E63C8', [262, 290, 196, 330], [100, 100, 100, 30, 0], '3 of 5 finished, 1 in progress')
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fandom index</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 68px; right: 68px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Books &amp; Literature</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <button aria-label="Back to Browse" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button aria-label="Filter, on: grouping, minimum works, tag kinds, yours" aria-pressed="true" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: {{accent}}; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
    </button>
  </div>
  <main style="padding: 106px 30px 0 16px; display: flex; flex-direction: column; gap: 12px">
    <label style="height: 38px; border-radius: 19px; background: rgba(118,118,128,0.12); display: flex; align-items: center; gap: 6px; padding: 0 12px; color: #6C6C70">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
      <input type="search" aria-label="Search fandoms" placeholder="Search fandoms" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 16px; outline: none">
    </label>
    <p style="margin: 0 4px; font-size: 13px; color: #6C6C70">Grouped by family · at least 50 works · <span style="color: {{accent}}">Reset</span></p>
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">{{s.title}}</h2>
        <div style="margin: 0 -16px">
          <sc-for list="{{s.rows}}" as="f" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; min-height: 56px; padding: 6px 12px 6px 16px; gap: 10px; border-top: {{f.sep}}">
              <span aria-hidden="true" style="width: 28px; height: 40px; flex-shrink: 0; border-radius: 6px; background: {{f.art}}"></span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 17px; line-height: 22px; display: flex; align-items: center; gap: 5px">{{f.name}}<sc-if value="{{f.isFav}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="Favourite" width="13" height="13" viewBox="0 0 24 24" fill="#F5C400" stroke="#E2A100" stroke-width="2" stroke-linejoin="round"><path d="m12 3.8 2.5 5.2 5.6.8-4.1 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.8z"></path></svg></sc-if></span>
                <span style="font-size: 13px; line-height: 17px; color: #6C6C70">{{f.detail}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
  <nav aria-label="Section index" style="position: absolute; right: 4px; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 1px">
    <sc-for list="{{letters}}" as="l" hint-placeholder-count="26">
      <span style="font-size: 11px; line-height: 15px; font-weight: 600; color: {{accent}}">{{l}}</span>
    </sc-for>
  </nav>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="browse" accent="{{accent}}" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const row = (name, detail, fav) => ({ name, detail, isFav: !!fav, fav: fav ? 'true' : 'false', starLabel: fav ? 'Remove from favourite fandoms' : 'Add to favourite fandoms', starColor: fav ? '#E2A100' : '#AEAEB2', starFill: fav ? '#F5C400' : 'none' });
    const art = (h) => 'linear-gradient(155deg, hsl(' + h + ', 46%, 27%), hsl(' + ((h + 22) % 360) + ', 50%, 41%))';
    const seedOf = (t) => { let h = 7; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h; };
    const FAN = { 'Original Work': 188, 'Persuasion': 335, 'Sherlock Holmes': 32, 'Jane Eyre': 262, 'Northanger Abbey': 290, 'Pride and Prejudice': 150 };
    const fandomArt = (name) => { const k = Object.keys(FAN).find((f) => name.indexOf(f) === 0); return art(k ? FAN[k] : seedOf(name) % 360); };
    const sections = [
      { title: 'Favourites', rows: [row('Pride and Prejudice & related', '6 fandoms · about 9k works · 14 downloaded', true), row('Sherlock Holmes & related', '11 fandoms · about 30k works · 9 downloaded', true)] },
      { title: 'J', rows: [row('Jane Eyre - Charlotte Brontë', 'about 1.1k works · 2 downloaded'), row('Jane Austen - Works', 'about 600 works')] },
      { title: 'N', rows: [row('Northanger Abbey - Jane Austen', 'about 500 works · 1 downloaded')] }
    ].map((s) => ({ ...s, rows: s.rows.map((r, i) => ({ ...r, art: fandomArt(r.name), sep: i ? '0.5px solid #E5E5EA' : 'none' })) }));
    return { accent, sections, letters: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('') };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Import › Where to put it (sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Add to Library" subtitle="The Boy Who Lived Twice.pdf" mode="sheet" confirm="Add" height="844" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "header": "Put it in",
      "rows": [
        {
          "label": "Library only",
          "kind": "check"
        },
        {
          "label": "Want to Read",
          "kind": "check",
          "on": true
        },
        {
          "label": "A Queue…",
          "kind": "nav",
          "detail": "Summer Reading"
        },
        {
          "label": "A Collection…",
          "kind": "nav",
          "detail": "None"
        }
      ]
    },
    {
      "header": "Found in the file",
      "rows": [
        {
          "label": "Source",
          "kind": "value",
          "detail": "FanFiction.net"
        },
        {
          "label": "Fandom",
          "kind": "value",
          "detail": "Harry Potter"
        },
        {
          "label": "Rating",
          "kind": "value",
          "detail": "T"
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recently Deleted</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 120px; right: 120px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Recently Deleted</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <button style="height: 44px; padding: 0 12px; border: none; border-radius: 22px; font-family: inherit; font-size: 16px; color: #D70015; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">Delete All</button>
    <button style="height: 44px; padding: 0 16px; border: none; border-radius: 22px; font-family: inherit; font-size: 16px; font-weight: 600; color: #FFFFFF; background: {{accent}}">Done</button>
  </div>
  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="padding: 0 4px; display: flex; flex-direction: column; gap: 4px">
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #3A3A3C">Works stay here for 90 days, then they're gone for good. Restoring brings back the EPUB, your progress and your tags.</p>
    </header>
    <div style="margin: 0 -16px">
      <sc-for list="{{works}}" as="w" hint-placeholder-count="4">
        <dc-import name="WorkRow" work="{{w}}" selecting="{{true}}" selected="{{w.selected}}" divider="{{w.divider}}" accent="{{accent}}" hint-size="100%,96px"></dc-import>
      </sc-for>
    </div>
  </main>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div role="toolbar" aria-label="Actions for 1 selected work" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 62px; border-radius: 31px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
    <button style="flex: 1; height: 54px; border: none; border-radius: 27px; background: transparent; font-family: inherit; font-size: 16px; font-weight: 600; color: {{accent}}">Restore</button>
    <button style="flex: 1; height: 54px; border: none; border-radius: 27px; background: transparent; font-family: inherit; font-size: 16px; font-weight: 600; color: #D70015">Delete Permanently</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const works = [
      { title: 'Watson’s Notebook', author: 'fogandlamplight', fandom: 'Sherlock Holmes', rating: 'T', category: 'Gen', warnings: 'none', status: 'complete', words: '15,200', chapters: '6/6', updated: '82 days left', selected: true },
      { title: 'A Season at Bath', author: 'quietharbor', fandom: 'Persuasion', rating: 'G', category: 'FM', warnings: 'none', status: 'complete', words: '4,100', chapters: '1/1', updated: '61 days left' },
      { title: 'Thornfield, Rebuilt', author: 'brontebird', fandom: 'Jane Eyre', rating: 'M', category: 'FM', warnings: 'undisclosed', status: 'wip', words: '28,700', chapters: '7/?', updated: '12 days left' },
      { title: 'Ink and Salt', author: 'inkwell_moth', fandom: 'Original Work', rating: 'T', category: 'FF', warnings: 'none', status: 'wip', words: '9,800', chapters: '3/8', updated: '3 days left' }
    ];
    return {
      accent: this.props.accent ?? '#990000',
      works: works.map((w, i) => ({ ...w, selected: !!w.selected, divider: i < works.length - 1 }))
    };
  }
}
</script>
</body>
</html>

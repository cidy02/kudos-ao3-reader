<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search › Active WIPs, ranked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1240px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <main style="padding: 64px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0 4px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Search</h1>

    <section aria-label="AO3 results, ranked" style="display: flex; flex-direction: column; gap: 10px">
      <div style="padding: 0 4px; display: flex; align-items: center; gap: 8px">
        <h2 style="margin: 0; flex: 1; font-size: 20px; line-height: 25px; font-weight: 700">On AO3 <span style="font-size: 15px; font-weight: 400; color: #6C6C70">{{total}} works</span></h2>
        <button aria-label="Sort by: Active WIPs" style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: #EFEFF4; font-family: inherit; font-size: 14px; color: #000000; display: flex; align-items: center; gap: 5px">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2F8F3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 8v4l3 2"></path></svg>Active WIPs
          <svg aria-hidden="true" width="10" height="14" viewBox="0 0 12 16" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6 6 2.5 9.5 6M2.5 10 6 13.5 9.5 10"></path></svg>
        </button>
        <button aria-label="Filters, 2 active" style="height: 32px; padding: 0 12px; border: none; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 5px">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>2
        </button>
      </div>

      <div aria-label="Sent to AO3" style="padding: 0 4px; display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{sent}}" as="c" hint-placeholder-count="2">
          <button aria-label="Remove {{c}}" style="height: 30px; padding: 0 6px 0 10px; border: none; border-radius: 15px; background: rgba(153,0,0,0.10); color: #990000; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px">{{c}}<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="opacity: 0.7"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
        </sc-for>
      </div>

      <p style="margin: 0 4px; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: #6C6C70">
        <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F8F3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 8v4l3 2"></path></svg>
        <span>Ranked {{loaded}} loaded works: on schedule first, then by kudos per hit</span>
      </p>

      <div style="margin: 0 -16px">
        <dc-import name="WorkRow" work="{{w1}}" show-summary="{{true}}" divider="{{true}}" accent="{{accent}}" hint-size="100%,160px"></dc-import>
        <dc-import name="WorkRow" work="{{w2}}" show-summary="{{true}}" divider="{{true}}" accent="{{accent}}" hint-size="100%,160px"></dc-import>
        <dc-import name="WorkRow" work="{{w3}}" show-summary="{{true}}" divider="{{true}}" accent="{{accent}}" hint-size="100%,160px"></dc-import>
        <dc-import name="WorkRow" work="{{w4}}" show-summary="{{true}}" accent="{{accent}}" hint-size="100%,160px"></dc-import>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 4px">
        <span style="font-size: 13px; line-height: 18px; color: #6C6C70">{{loaded}} of {{total}} loaded</span>
        <button style="height: 36px; padding: 0 16px; border: none; border-radius: 18px; background: #EFEFF4; color: #990000; font-family: inherit; font-size: 15px; font-weight: 600">Load Page 3</button>
      </div>
    </section>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; gap: 10px; align-items: center">
    <button aria-label="Back to Browse" style="width: 54px; height: 54px; flex-shrink: 0; border: none; border-radius: 27px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>
    </button>
    <label style="flex: 1; height: 54px; border-radius: 27px; padding: 0 8px 0 16px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; color: #6C6C70; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 8px 28px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
      <input type="search" aria-label="Search Kudos and AO3" value="lighthouse" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 17px; color: #000000; outline: none">
      <button aria-label="Clear search" style="width: 36px; height: 36px; border: none; border-radius: 18px; background: transparent; color: #8E8E93; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"></circle><path d="M9 9l6 6M15 9l-6 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
      </button>
    </label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    // Active WIPs: AO3 gets "complete:false revised_at:>now-60d", sorted by date updated.
    // Interval = (last chapter - posted) / (chapters - 1); late ratio = days since / max(14, interval).
    // w1 8 / 14 = 0.6 on schedule; w2 12 / 14 = 0.9 and 18 of 20 posted -> nearly done;
    // w3 31 / 14 = 2.2 running late; w4 one chapter, so no interval yet. Today is Oct 28.
    return {
      accent: this.props.accent ?? '#990000',
      total: '212',
      loaded: '40',
      sent: ['Updated in the last 60 days', 'Works in progress'],
      w1: { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', words: '118,402', chapters: '15/30', kudos: '5,870', hits: '71.4k', updated: 'Oct 20', summary: 'A lighthouse crew, a sea that keeps rising, and thirty nights to decide who stays.', signal: { label: 'On schedule', note: 'About every 9 days', tone: 'good' } },
      w2: { title: 'Tidewater Hours', author: 'pennantgrey', fandom: 'Original Work', rating: 'T', category: 'FF', warnings: 'none', status: 'wip', words: '88,900', chapters: '18/20', kudos: '2,214', hits: '30.5k', updated: 'Oct 16', summary: 'The ferry runs on the tide table; so, it turns out, does falling in love.', signal: { label: 'Nearly done', note: '18 of 20 · about every 2 weeks', tone: 'good' } },
      w3: { title: 'First Light at Harrow Point', author: 'kittiwake', fandom: 'Original Work', rating: 'G', category: 'Gen', warnings: 'none', status: 'wip', words: '4,120', chapters: '1/?', kudos: '88', hits: '640', updated: 'Oct 24', summary: 'A new keeper arrives with a crate of books and no idea how to work the lamp.', signal: { label: 'Just started', note: '1 chapter · 4 days ago', tone: 'neutral' } },
      w4: { title: 'The Quiet Year', author: 'lowtidehour', fandom: 'Original Work', rating: 'T', category: 'MM', warnings: 'none', status: 'wip', words: '41,300', chapters: '6/?', kudos: '1,033', hits: '12.8k', updated: 'Sep 27', summary: 'Two caretakers wintering on an island that the mainland has forgotten.', signal: { label: 'Running late', note: 'Usually every 12 days · 31 days since', tone: 'late' } }
    };
  }
}
</script>
</body>
</html>

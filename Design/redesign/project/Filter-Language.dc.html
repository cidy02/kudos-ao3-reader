<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search filters › Language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Language" back="Back to Filters" search="Search languages" height="1000" sections="{{sections}}" hint-size="390px,1000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "header": "Recent",
      "rows": [
        {
          "label": "English",
          "kind": "check",
          "on": true
        },
        {
          "label": "Deutsch",
          "kind": "check"
        }
      ]
    },
    {
      "header": "All languages",
      "rows": [
        {
          "label": "Any language",
          "kind": "check"
        },
        {
          "label": "العربية",
          "kind": "check"
        },
        {
          "label": "Català",
          "kind": "check"
        },
        {
          "label": "中文-普通话 國語",
          "kind": "check"
        },
        {
          "label": "Español",
          "kind": "check"
        },
        {
          "label": "Français",
          "kind": "check"
        },
        {
          "label": "Italiano",
          "kind": "check"
        },
        {
          "label": "日本語",
          "kind": "check"
        },
        {
          "label": "Polski",
          "kind": "check"
        },
        {
          "label": "Português brasileiro",
          "kind": "check"
        },
        {
          "label": "Русский",
          "kind": "check"
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

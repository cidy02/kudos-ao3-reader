<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find in Work</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
mark{background:rgba(245,196,0,0.45);color:inherit;border-radius:3px;padding:0 1px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgba(40,30,10,0.32); color: #1F1B16; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <section role="dialog" aria-label="Find in Work" style="position: absolute; left: 0; right: 0; top: 110px; bottom: 0; border-radius: 38px 38px 0 0; background: #FAF7F0; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #CFC7B8; margin: 7px auto 0"></div>
    <div style="padding: 10px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 10px; align-items: center">
        <label style="flex: 1; height: 40px; border-radius: 20px; background: rgba(60,40,10,0.08); display: flex; align-items: center; gap: 6px; padding: 0 12px; color: #6B645A">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
          <input type="search" aria-label="Find in this work" value="compass" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 16px; color: #1F1B16; outline: none">
        </label>
        <button style="border: none; background: none; font-family: inherit; font-size: 16px; color: {{accent}}">Done</button>
      </div>
      <div role="radiogroup" aria-label="Scope" style="height: 32px; border-radius: 16px; background: rgba(60,40,10,0.08); padding: 2px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
        <button role="radio" aria-checked="false" style="border: none; border-radius: 16px; background: transparent; font-family: inherit; font-size: 14px">This Chapter</button>
        <button role="radio" aria-checked="true" style="border: none; border-radius: 16px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12); font-family: inherit; font-size: 14px; font-weight: 600">Whole Work · 9</button>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <section style="display: flex; flex-direction: column; gap: 6px">
          <h3 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; color: #6B645A">{{g.chapter}}</h3>
          <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
            <sc-for list="{{g.hits}}" as="h" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; border-top: {{h.sep}}">
                <p style="flex: 1; margin: 0; font-family: 'New York', 'Iowan Old Style', Georgia, serif; font-size: 15px; line-height: 21px">{{h.before}}<mark>compass</mark>{{h.after}}</p>
                <button aria-label="More: Go, Copy, Bookmark" style="width: 36px; height: 36px; border: none; border-radius: 18px; background: transparent; color: #6B645A; display: flex; align-items: center; justify-content: center">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.6" fill="currentColor"></circle></svg>
                </button>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sep = (i) => (i ? '0.5px solid #EDE7DC' : 'none');
    const groups = [
      { chapter: 'Chapter 1 · Instruments · 3', hits: [
        { before: '…a brass ', after: ' that had never once agreed with true north…' },
        { before: '…folded the ', after: ' into her mother’s handkerchief…' }
      ] },
      { chapter: 'Chapter 7 · The Salt Road · 4', hits: [
        { before: '…with the brass ', after: ' knocking against her hip…' },
        { before: 'Elinor checked the ', after: '. The needle was steady…' }
      ] }
    ];
    return {
      accent: this.props.accent ?? '#990000',
      groups: groups.map((g) => ({ ...g, hits: g.hits.map((h, i) => ({ ...h, sep: sep(i) })) }))
    };
  }
}
</script>
</body>
</html>

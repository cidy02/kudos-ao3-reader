<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account behind a profile button, Writing as a tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1290px; height: 660px; box-sizing: border-box; padding: 26px 34px; background: #FFFFFF; color: #1C1C1E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <header style="display: flex; align-items: baseline; gap: 14px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Account behind a profile button, Writing as a tab</h1>
    <p style="margin: 0; font-size: 15px; color: #3A3A3C">Decided 2026-10-27. Home, Library, Writing, Browse and Search; Account opens as a sheet from the profile button on Home.</p>
  </header>
  <div style="display: flex; align-items: flex-start; gap: 22px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 225px">
      <div style="width: 225px; height: 487px; overflow: hidden; border-radius: 30px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5769); transform-origin: 0 0"><dc-import name="Home-Launchpad" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>1</b> {{cap1}}</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 225px">
      <div style="width: 225px; height: 487px; overflow: hidden; border-radius: 30px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5769); transform-origin: 0 0"><dc-import name="Account-Sheet" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>2</b> {{cap2}}</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 225px">
      <div style="width: 225px; height: 487px; overflow: hidden; border-radius: 30px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5769); transform-origin: 0 0"><dc-import name="Writing" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>3</b> {{cap3}}</figcaption>
    </figure>

    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700">Where today's Account goes</h2>
        <div style="border-top: 0.5px solid #D1D1D6">
          <sc-for list="{{moves}}" as="m" hint-placeholder-count="8">
            <div style="display: flex; gap: 10px; padding: 6px 0; border-bottom: 0.5px solid #E5E5EA; font-size: 13px; line-height: 18px">
              <span style="width: 170px; flex-shrink: 0; font-weight: 600">{{m.what}}</span>
              <span style="flex: 1; color: #3A3A3C">{{m.where}}</span>
            </div>
          </sc-for>
        </div>
      </section>
      <div style="display: flex; gap: 18px">
        <section style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #2F7A36">Gains</h2>
          <sc-for list="{{gains}}" as="g" hint-placeholder-count="3"><p style="margin: 0; font-size: 13px; line-height: 18px">{{g}}</p></sc-for>
        </section>
        <section style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #A35200">Costs</h2>
          <sc-for list="{{costs}}" as="c" hint-placeholder-count="3"><p style="margin: 0; font-size: 13px; line-height: 18px">{{c}}</p></sc-for>
        </section>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1290,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    const shots = [
        { n: '1', board: 'Home-Launchpad', caption: 'Home gains the profile button; its red badge counts unread Inbox messages. The tab bar: Home, Library, Writing, Browse.' },
        { n: '2', board: 'Account-Sheet', caption: 'The sheet keeps the account itself: profile, Inbox, AO3 Preferences, Kudos settings, Log Out.' },
        { n: '3', board: 'Writing', caption: 'Writing: the draft you were on, this week\'s response, new comments, your works, drafts, series, challenges.' }
    ];
    return {
      cap1: shots[0].caption, cap2: shots[1].caption, cap3: shots[2].caption,
      moves: [
        ['Marked for Later, Bookmarks', 'Library › On AO3'],
        ['Subscriptions', 'Library › On AO3; new chapters already lead Home'],
        ['AO3 History', 'Library › On AO3 (Kudos history stays in Insights)'],
        ['Inbox', 'Sheet, top row; its count badges the profile button'],
        ['Works, Series, Drafts', 'Writing tab'],
        ['Collections & Challenges', 'Writing tab'],
        ['AO3 Preferences, More on AO3', 'Sheet'],
        ['Settings, Backup, About', 'Sheet › Kudos (the gear leaves every toolbar)'],
        ['Pseud switcher, Log Out', 'Writing header (Posting as …); Log Out at the foot of the sheet']
      ].map(([what, where]) => ({ what, where })),
      gains: [
        'Matches Books, Music, Podcasts and the App Store; the tab bar gets a slot back.',
        'Reading lists sit with the rest of your reading, so Library answers "where is that fic?" alone.',
        'Signed out, nothing is greyed out: the button is a plain person, the sheet offers Log In.'
      ],
      costs: [
        'Inbox goes from one tap to two (a badge on the profile button and New Comments in Writing soften it).',
        'Reverses docs/Kudos_Layout_Structure.md (4 tabs, Settings in Account) and IA-Map\'s "keep 4 tabs".',
        'Open question: profile button on Home only (Books) or on every tab (Music).'
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search › Save Search (sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Save Search" mode="sheet" confirm="Save" height="844" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "header": "Name",
      "rows": [
        {
          "kind": "field",
          "text": "Persuasion · Anne/Wentworth · complete"
        }
      ]
    },
    {
      "header": "This search",
      "rows": [
        {
          "label": "Filters",
          "kind": "chips",
          "chips": [
            "Persuasion",
            "Anne/Wentworth",
            "Complete",
            "Kudos ↓"
          ]
        }
      ]
    },
    {
      "footer": "New results are counted when you open Saved Searches; Kudos doesn’t check in the background.",
      "rows": [
        {
          "label": "Show new results on Home",
          "kind": "toggle",
          "on": true
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Writing › Add Chapter (form)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1040px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="New Chapter" subtitle="Chapter 5 of 8" mode="sheet" trailing="Post…" height="1040" context="{{context}}" sections="{{sections}}" hint-size="390px,1040px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "context": {
    "kicker": "Original Work · work in progress",
    "kickerColour": "hsl(188, 56%, 33%)",
    "title": "What the Tide Keeps",
    "meta": "3 of 8 chapters posted · 9,800 words · 412 kudos",
    "cover": "linear-gradient(155deg, hsl(188, 46%, 27%), hsl(210, 50%, 41%))"
  },
  "sections": [
    {
      "rows": [
        {
          "label": "Title",
          "kind": "field",
          "placeholder": "Chapter title (optional)"
        },
        {
          "label": "Number",
          "kind": "value",
          "detail": "5 of 8"
        },
        {
          "label": "Published",
          "kind": "nav",
          "detail": "When posted"
        }
      ]
    },
    {
      "header": "Text",
      "rows": [
        {
          "label": "Write Chapter",
          "sub": "Draft · 1,180 words · edited today",
          "kind": "nav",
          "icon": "M5 19h4L19 9l-4-4L5 15zM13 7l4 4"
        },
        {
          "label": "Import from a File…",
          "kind": "nav",
          "icon": "M12 4v11M7.5 10.5 12 15l4.5-4.5M4 19.5h16"
        }
      ]
    },
    {
      "header": "Summary",
      "rows": [
        {
          "kind": "textarea",
          "placeholder": "Optional",
          "rows": 2
        }
      ]
    },
    {
      "header": "Notes",
      "rows": [
        {
          "label": "Beginning notes",
          "kind": "nav",
          "detail": "None"
        },
        {
          "label": "End notes",
          "kind": "nav",
          "detail": "None"
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Preview",
          "kind": "button"
        },
        {
          "label": "Save as Draft",
          "kind": "button"
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

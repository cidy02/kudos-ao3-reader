<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 110px; right: 110px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Reading History</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between; z-index: 2">
    <button aria-label="Back to Library" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button style="height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: inherit; font-size: 17px; color: #1C1C1E; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">Select</button>
  </div>

  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 22px">
    <section aria-label="Reading time this week" style="display: flex; flex-direction: column; gap: 12px">
      <div role="tablist" aria-label="Range" style="height: 32px; border-radius: 16px; background: rgba(118,118,128,0.12); padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
        <button role="tab" aria-selected="true" style="border: none; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12); font-family: inherit; font-size: 13px; font-weight: 600">Week</button>
        <button role="tab" aria-selected="false" style="border: none; border-radius: 14px; background: transparent; font-family: inherit; font-size: 13px">Month</button>
        <button role="tab" aria-selected="false" style="border: none; border-radius: 14px; background: transparent; font-family: inherit; font-size: 13px">Year</button>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 13px; line-height: 18px; color: #6C6C70">Oct 22 – 28</span>
          <span style="font-size: 28px; line-height: 34px; font-weight: 700; font-variant-numeric: tabular-nums">4 h 10 m</span>
          <span style="font-size: 13px; line-height: 18px; color: #6C6C70">11 works · 2 finished · 9-day streak</span>
        </div>
        <div style="display: flex; gap: 6px">
          <button aria-label="Previous week" style="width: 32px; height: 32px; border: none; border-radius: 16px; background: #F2F2F7; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></button>
          <button aria-label="Next week" disabled style="width: 32px; height: 32px; border: none; border-radius: 16px; background: #F2F2F7; color: #C7C7CC; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg></button>
        </div>
      </div>
      <div role="img" aria-label="{{chartLabel}}" style="display: flex; flex-direction: column; gap: 6px">
        <div style="position: relative; height: 112px; padding-right: 48px; display: flex; align-items: flex-end; gap: 10px; border-bottom: 0.5px solid #D1D1D6">
          <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: {{avgTop}}px; border-top: 1px dashed #AEAEB2"></span>
          <span aria-hidden="true" style="position: absolute; right: 0; top: {{avgLabelTop}}px; font-size: 11px; line-height: 14px; color: #6C6C70">avg 42m</span>
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <span style="flex: 1; height: {{d.h}}px; border-radius: 5px 5px 2px 2px; background: {{d.bg}}"></span>
          </sc-for>
        </div>
        <div aria-hidden="true" style="display: flex; gap: 10px; padding-right: 48px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <span style="flex: 1; text-align: center; font-size: 12px; line-height: 16px; font-weight: {{d.weight}}; color: {{d.fg}}">{{d.label}}</span>
          </sc-for>
        </div>
      </div>
    </section>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section aria-label="{{g.day}}" style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">{{g.day}}</h2>
          <span style="font-size: 15px; color: #6C6C70; font-variant-numeric: tabular-nums">{{g.total}}</span>
        </div>
        <sc-for list="{{g.items}}" as="e" hint-placeholder-count="2">
          <a href="iPhone-WorkDetail.dc.html" style="color: #000000; text-decoration: none; display: flex; gap: 10px">
            <span style="width: 40px; flex-shrink: 0; padding-top: 12px; text-align: right; font-size: 12px; line-height: 16px; color: #6C6C70; font-variant-numeric: tabular-nums">{{e.time}}</span>
            <span aria-hidden="true" style="width: 14px; flex-shrink: 0; position: relative; display: flex; justify-content: center">
              <span style="position: absolute; top: 0; bottom: 0; width: 2px; background: {{e.rail}}"></span>
              <span style="position: relative; margin-top: 13px; width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; background: {{e.dotBg}}; border: 2px solid {{e.dotRing}}"></span>
            </span>
            <span style="flex: 1; min-width: 0; padding: 9px 0 12px; display: flex; flex-direction: column; gap: 4px; border-bottom: {{e.sep}}">
              <span style="display: flex; align-items: center; gap: 6px">
                <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: {{e.fandomColour}}">{{e.fandom}}</span>
                <sc-if value="{{e.finished}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; padding: 1px 8px; border-radius: 9px; background: #E7F4EA; color: #1F6B2D; font-size: 12px; line-height: 18px; font-weight: 600">Finished</span></sc-if>
                <sc-if value="{{e.started}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; padding: 1px 8px; border-radius: 9px; background: #EFEFF4; color: #3A3A3C; font-size: 12px; line-height: 18px; font-weight: 600">Started</span></sc-if>
              </span>
              <span style="font-size: 17px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.title}}</span>
              <span role="img" aria-label="{{e.barsLabel}}" style="display: flex; gap: 2px; max-width: {{e.barsW}}">
                <sc-for list="{{e.bars}}" as="b" hint-placeholder-count="10">
                  <span style="flex: 1; height: 6px; border-radius: 2px; background: {{b}}"></span>
                </sc-for>
              </span>
              <span style="font-size: 13px; line-height: 18px; color: #6C6C70">{{e.what}}</span>
            </span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="library" accent="#990000" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // Minutes read each day this week; today (Tue) is still going.
    const mins = [48, 22, 0, 65, 31, 74, 55];
    const labels = ['W', 'T', 'F', 'S', 'S', 'M', 'T'];
    const max = 80, H = 104;
    const avg = Math.round(mins.reduce((a, b) => a + b, 0) / 7);
    const hue = { 'Original Work': 188, 'Persuasion': 335, 'Sherlock Holmes': 32, 'Jane Eyre': 262, 'Pride and Prejudice': 150 };
    const ink = (f) => 'hsl(' + (hue[f] ?? 210) + ', 56%, 33%)';
    // A work's chapters as cells: grey = read before, red = read in this sitting, light = still to read.
    const bars = (n, before, now) => Array.from({ length: n }, (_, i) => (i < before ? '#AEAEB2' : i < before + now ? '#990000' : '#E5E5EA'));
    const entry = (time, fandom, title, n, before, now, what, flag, last) => ({
      time, fandom, title, what, fandomColour: ink(fandom),
      bars: bars(n, before, now), barsW: Math.min(100, n * 9) + '%',
      barsLabel: 'Chapters ' + (before + 1) + (now > 1 ? '–' + (before + now) : '') + ' of ' + n + ' read in this sitting',
      finished: flag === 'finished', started: flag === 'started',
      dotBg: flag === 'finished' ? '#2F8F3A' : '#FFFFFF', dotRing: flag === 'finished' ? '#2F8F3A' : '#990000',
      rail: last ? 'linear-gradient(#E5E5EA 0, #E5E5EA 13px, transparent 13px)' : '#E5E5EA',
      sep: last ? 'none' : '0.5px solid #E5E5EA'
    });
    return {
      chartLabel: 'Reading time this week: ' + mins.map((m, i) => labels[i] + ' ' + m + ' minutes').join(', '),
      avgTop: Math.round(112 - (avg / max) * H) - 1,
      avgLabelTop: Math.round(112 - (avg / max) * H) - 7,
      days: mins.map((m, i) => ({
        h: Math.max(m ? 6 : 2, Math.round((m / max) * H)),
        bg: i === 6 ? '#990000' : m ? 'rgba(153,0,0,0.35)' : '#E5E5EA',
        label: labels[i], weight: i === 6 ? 700 : 400, fg: i === 6 ? '#990000' : '#6C6C70'
      })),
      groups: [
        { day: 'Today', total: '55 min', items: [
          entry('9:40', 'Persuasion', 'Letters Never Sent', 4, 2, 2, 'Chapters 3–4 · 35 min · gave kudos', 'finished', false),
          entry('8:15', 'Original Work', 'The Cartographer’s Daughter', 12, 5, 2, 'Chapters 6–7 · 20 min · 58% through', '', true)
        ] },
        { day: 'Yesterday', total: '1 h 14 min', items: [
          entry('22:30', 'Sherlock Holmes', 'The Baker Street Irregular', 1, 0, 1, 'One-shot · 40 min · second read', 'finished', false),
          entry('19:05', 'Jane Eyre', 'Moor and Mist', 18, 0, 3, 'Chapters 1–3 · 34 min', 'started', true)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>

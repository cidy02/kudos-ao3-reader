<!doctype html>

<x-dc>
<helmet>

        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg>
        Give Kudos

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 44px; border: none; border-radius: 22px; background: rgba(60,40,10,0.07); color: #1F1B16; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px">

          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4z"></path></svg>

    <div style="height: 0.5px; background: rgba(60,40,10,0.14)"></div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #6B645A">Up next in Summer Reading</span>
      <div style="display: flex; align-items: center; gap: 10px">
        <dc-import name="Symbols" rating="G" category="Gen" warnings="none" status="wip" size="17" hint-size="46px,46px"></dc-import>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">

      </div>
    </div>
  </section>
</div>
</x-dc>

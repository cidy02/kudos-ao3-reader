<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account signed out</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <main style="padding: 56px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0 4px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Account</h1>
    <section style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: #E5E5EA; color: #8E8E93; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20c1.4-3.8 4.2-5.8 7.5-5.8s6.1 2 7.5 5.8"></path></svg>
        </span>
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Bring your AO3 account along</h2>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 21px; color: #3A3A3C">Your bookmarks, history, subscriptions, inbox and works appear here. Your library works without an account.</p>
      <button style="height: 48px; border: none; border-radius: 24px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">Log In to AO3</button>
      <p style="margin: 2px 0 4px; text-align: center; font-size: 15px; line-height: 20px; color: #6C6C70">No AO3 account? <a href="AO3-Web.dc.html" aria-label="Create an AO3 account. Opens AO3’s invitation request" style="color: {{accent}}; text-decoration: none; font-weight: 600">Create one<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 3px"><path d="M8 4h12v12M20 4 7 17"></path></svg></a></p>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #6C6C70">Your sign-in stays on this device. Kudos never sees your password.</p>
    </section>
    <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 6px; opacity: 0.45">
      <h2 style="margin: 0 16px; font-size: 13px; font-weight: 400; color: #6C6C70">After you sign in</h2>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <sc-for list="{{preview}}" as="p" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; height: 44px; padding: 0 16px; gap: 12px; border-top: {{p.sep}}">
            <span style="width: 20px; height: 20px; border-radius: 6px; background: #E5E5EA"></span>
            <span style="font-size: 16px">{{p.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
      <div style="display: flex; align-items: center; height: 48px; padding: 0 16px; gap: 12px">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"></path></svg>
        <span style="flex: 1; font-size: 16px">Settings</span>
        <svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
      </div>
    </div>
  </main>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(242,242,247,0), rgba(242,242,247,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="account" accent="{{accent}}" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#821019"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#821019',
      preview: ['Marked for Later', 'Bookmarks', 'Subscriptions', 'Works', 'History', 'Inbox'].map((label, i) => ({ label, sep: i ? '0.5px solid #E5E5EA' : 'none' }))
    };
  }
}
</script>
</body>
</html>

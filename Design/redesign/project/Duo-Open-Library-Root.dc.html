<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":951,"height":669}}'>

    return { none: [], side: [{ label: 'New: Collection, Queue, Import EPUB', d: 'M12 5v14M5 12h14' }, { label: 'More: Edit Shelves, Reading Insights, Recently Deleted', d: 'dots' }, { label: 'Select', d: 'M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17zM8.2 12.2l2.6 2.6 5-5.3' }] };

}

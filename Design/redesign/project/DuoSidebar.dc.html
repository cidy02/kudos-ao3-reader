<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Sidebar" style="width: 232px; height: {{height}}px; border-radius: 26px; padding: 14px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; overflow: hidden; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 10px 32px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #000000">
  <label style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; margin-bottom: 10px; border-radius: 18px; background: rgba(118,118,128,0.12); color: #6C6C70; font-size: 15px; flex-shrink: 0">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
    <input type="search" placeholder="Search AO3 and Library" aria-label="Search" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #000000; outline: none">
  </label>
  <sc-for list="{{rows}}" as="i" hint-placeholder-count="12">
    <button aria-current="{{i.current}}" style="height: 34px; flex-shrink: 0; border: none; border-radius: 12px; padding: 0 10px 0 {{i.pad}}px; display: flex; align-items: center; gap: 10px; background: {{i.bg}}; color: {{i.fg}}; font-family: inherit; font-size: 15px; font-weight: {{i.weight}}; text-align: left; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{i.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.d}}"></path></svg>
      <span style="flex: 1">{{i.label}}</span>
      <span style="font-size: 13px; color: {{i.countColor}}">{{i.count}}</span>
      <sc-if value="{{i.chev}}" hint-placeholder-val="{{false}}">
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{i.countColor}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </sc-if>
    </button>
  </sc-for>
  <h2 style="margin: 14px 10px 4px; font-size: 13px; line-height: 18px; font-weight: 600; color: #6C6C70">Reading Queues</h2>
  <sc-for list="{{queues}}" as="q" hint-placeholder-count="3">
    <button style="height: 32px; flex-shrink: 0; border: none; border-radius: 12px; padding: 0 10px; display: flex; align-items: center; gap: 10px; background: transparent; color: #000000; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer">
      <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 6px; background: {{q.art}}"></span>
      <span style="flex: 1">{{q.label}}</span>
      <span style="font-size: 13px; color: #6C6C70">{{q.count}}</span>
    </button>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selected":{"editor":"enum","options":["home","all","reading","want","finished","downloaded","history","favorites","collections","browse","account"],"default":"home"},"height":{"editor":"int","default":649,"min":300,"max":1000},"accent":{"editor":null,"default":"#821019"},"$preview":{"width":232,"height":649}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#821019';
    const selected = this.props.selected ?? 'home';
    const icons = {
      home: 'M3.5 10.5 12 3.5l8.5 7M5.5 9v11h5v-6h3v6h5V9',
      library: 'M3.5 4h4v16h-4zM9.5 4h4v16h-4zM15.6 5.4l3.4-.9 3 15.2-3.4.9z',
      all: 'M4 6h16M4 12h16M4 18h16',
      reading: 'M4 5.5c3-1 5.5-.6 8 1 2.5-1.6 5-2 8-1v13c-3-1-5.5-.6-8 1-2.5-1.6-5-2-8-1zM12 6.5v13',
      want: 'M7 4h10v16l-5-4-5 4z',
      queues: 'M4 6h11M4 12h11M4 18h7M18 15v6M15 18h6',
      finished: 'M5 12.5l4.5 4.5L19 7.5',
      downloaded: 'M12 4v11M7 10.5l5 5 5-5M5 20h14',
      history: 'M12 7v5l3 2M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3h3',
      favorites: 'm12 3.8 2.5 5.2 5.6.8-4.1 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.8z',
      collections: 'M4 7h16v13H4zM7 4h10',
      browse: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      writing: 'M16 4.5l3.5 3.5L9 18.5 4.5 19.5l1-4.5zM12.5 20h7'
    };
    const list = [
      { id: 'home', label: 'Home' },
      { id: 'library', label: 'Library', chev: true, bold: true },
      { id: 'all', label: 'All Works', count: '214', sub: true },
      { id: 'reading', label: 'Reading Now', count: '6', sub: true },
      { id: 'want', label: 'Want to Read', count: '31', sub: true },
      { id: 'queues', label: 'Queues', count: '3', sub: true },
      { id: 'finished', label: 'Finished', count: '74', sub: true },
      { id: 'downloaded', label: 'Downloaded', count: '98', sub: true },
      { id: 'history', label: 'History', sub: true },
      { id: 'favorites', label: 'Favorites', count: '19', sub: true },
      { id: 'collections', label: 'Collections', count: '4', sub: true },
      { id: 'writing', label: 'Writing' },
      { id: 'browse', label: 'Browse' }
    ];
    const art = (h) => 'linear-gradient(155deg, hsl(' + h + ', 46%, 27%), hsl(' + ((h + 22) % 360) + ', 50%, 41%))';
    return {
      height: Number(this.props.height ?? 649),
      rows: list.map((i) => {
        const on = i.id === selected;
        return {
          ...i,
          d: icons[i.id],
          count: i.count || '',
          chev: !!i.chev,
          current: on ? 'page' : 'false',
          pad: i.sub ? 22 : 10,
          bg: on ? accent : 'transparent',
          fg: on ? '#FFFFFF' : '#000000',
          iconColor: on ? '#FFFFFF' : accent,
          countColor: on ? 'rgba(255,255,255,0.85)' : '#6C6C70',
          weight: on || i.bold ? 600 : 400
        };
      }),
      queues: [
        { label: 'Summer Reading', count: '8', art: art(181) },
        { label: 'Re-reads', count: '5', art: art(262) },
        { label: 'For the Train', count: '3', art: art(32) }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work › Edit downloaded date (sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Downloaded" subtitle="Imported works" mode="sheet" confirm="Save" height="844" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "rows": [
        {
          "label": "Date",
          "kind": "value",
          "detail": "Oct 22, 2026"
        },
        {
          "label": "Time",
          "kind": "value",
          "detail": "21:40"
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Use the file’s date",
          "kind": "button"
        }
      ],
      "footer": "Imports take the date you imported them."
    }
  ]
};
  }
}
</script>
</body>
</html>

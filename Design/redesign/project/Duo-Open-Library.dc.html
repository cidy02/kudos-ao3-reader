<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
a{color:#990000}a:hover{color:#6E0000}
</style>
</helmet>
<div style="width: 951px; height: 669px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box; display: flex">
  <div style="position: absolute; left: 10px; top: 10px; z-index: 2">
    <dc-import name="DuoSidebar" selected="reading" accent="#990000" hint-size="232px,649px"></dc-import>
  </div>

  <section aria-label="Reading Now" style="margin-left: 252px; width: 340px; flex-shrink: 0; height: 669px; border-right: 0.5px solid #D1D1D6; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
    <header style="padding: 18px 16px 10px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: 0.35px">Reading Now</h1>
        <p style="margin: 0; font-size: 13px; line-height: 18px; color: #6C6C70">6 works · 2 with new chapters</p>
      </div>
      <div style="height: 40px; border-radius: 20px; display: flex; align-items: center; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
        <a href="Library-Filters.dc.html" aria-label="Filter" style="width: 42px; height: 40px; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
        </a>
        <button aria-label="Sort" style="width: 42px; height: 40px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14M4.5 15.5 8 19l3.5-3.5M16 19V5M12.5 8.5 16 5l3.5 3.5"></path></svg>
        </button>
      </div>
    </header>
    <div style="display: flex; flex-direction: column; padding: 0 8px">
      <sc-for list="{{works}}" as="w" hint-placeholder-count="6">
        <div aria-current="{{w.current}}" style="border-radius: 16px; background: {{w.bg}}; overflow: hidden">
          <dc-import name="WorkRow" work="{{w}}" accent="#990000" hint-size="100%,100px"></dc-import>
        </div>
      </sc-for>
    </div>
  </section>

  <section aria-label="The Cartographer’s Daughter" style="flex: 1; min-width: 0; height: 669px; position: relative; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 340px; background: linear-gradient(to bottom, rgba(37,119,132,0.20), rgba(37,119,132,0.12) 35%, rgba(37,119,132,0.05) 65%, rgba(37,119,132,0))"></div>
    <div style="position: absolute; right: 16px; top: 14px; z-index: 1; height: 40px; border-radius: 20px; display: flex; align-items: center; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <button aria-label="Kudos given" aria-pressed="true" style="width: 44px; height: 40px; border: none; background: transparent; color: #990000; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg></button>
      <button aria-label="Bookmark on AO3" style="width: 44px; height: 40px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4z"></path></svg></button>
      <a href="Work-Actions.dc.html" aria-label="More actions" style="width: 44px; height: 40px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg></a>
    </div>
    <div style="position: relative; padding: 66px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <a href="Fandom-Works.dc.html" style="align-self: flex-start; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: hsl(188, 56%, 33%)">Original Work</a>
        <span aria-hidden="true" style="width: 14px; height: 2px; border-radius: 1px; background: hsl(188, 56%, 33%)"></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">The Cartographer’s Daughter</h2>
        <a href="Author.dc.html" style="align-self: flex-start; font-size: 15px; line-height: 20px; text-decoration: none">inkwell_moth</a>
      </div>
      <dc-import name="Symbols" variant="inline" rating="T" category="FM" warnings="none" status="wip" size="18" hint-size="327px,18px"></dc-import>
      <dc-import name="ResumeCard" variant="detail" width="327" accent="#990000" hint-size="327px,330px"></dc-import>
      <dl style="margin: 0; background: #F2F2F7; border-radius: 16px; padding: 10px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 10px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="9">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 1px; border-right: {{s.border}}">
            <dt style="font-size: 11px; line-height: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: #6C6C70">{{s.label}}</dt>
            <dd style="margin: 0; font-family: 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 21px; font-weight: 700">{{s.value}}</dd>
          </div>
        </sc-for>
      </dl>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":951,"height":669}}'>

    const works = [

    const stats = [

}
</script>
</body>
</html>

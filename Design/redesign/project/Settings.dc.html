<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1240px; position: relative; overflow: hidden; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <button aria-label="Back to Account" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
  </div>
  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0 4px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Settings</h1>
    <label style="height: 38px; border-radius: 19px; background: rgba(118,118,128,0.12); display: flex; align-items: center; gap: 6px; padding: 0 12px; color: #6C6C70; margin-top: -6px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
      <input type="search" aria-label="Search settings" placeholder="Search" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 16px; outline: none">
    </label>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 16px; font-size: 13px; line-height: 18px; font-weight: 400; color: #6C6C70">{{g.title}}</h2>
        <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; height: 46px; padding-left: 14px; gap: 12px">
              <span aria-hidden="true" style="width: 29px; height: 29px; flex-shrink: 0; border-radius: 7px; background: {{r.bg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
              </span>
              <div style="flex: 1; height: 46px; display: flex; align-items: center; gap: 8px; padding-right: 14px; border-top: {{r.sep}}">
                <span style="flex: 1; font-size: 16px">{{r.label}}</span>
                <span style="font-size: 16px; color: {{r.valueColor}}">{{r.value}}</span>
                <svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const r = (label, value, bg, d, valueColor) => ({ label, value, bg, d, valueColor: valueColor || '#6C6C70' });
    const groups = [
      { title: 'Reading', rows: [
        r('Appearance', 'Sepia', '#5856D6', 'M12 3a9 9 0 1 0 0 18V3z'),
        r('Font', 'New York', '#8E8E93', 'M4 19 9 5l5 14M6 14h6M15 19l3-8 3 8M16 16.5h4'),
        r('Reader', 'Pages', '#FF9500', 'M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6.5v13'),
        r('Listening', 'Kokoro · Bella', '#FF2D55', 'M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4.5 4.5 0 0 1 0 6')
      ] },
      { title: 'Downloads & storage', rows: [
        r('Downloads', 'Keep what you read', '#990000', 'M12 4v11M7 10.5l5 5 5-5M5 20h14'),
        r('Preservation', 'Auto up to 10 works', '#30B0C7', 'M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z'),
        r('Reading Queues', '412 MB', '#007AFF', 'M4 6h12M4 11h12M4 16h7M17 14v6M14 17h6')
      ] },
      { title: 'Library & sync', rows: [
        r('Library', '', '#A2845E', 'M3.5 4h4v16h-4zM9.5 4h4v16h-4zM15.6 5.4l3.4-.9 3 15.2-3.4.9z'),
        r('Backup', 'Oct 24', '#64D2FF', 'M12 20V9M7 13.5l5-5 5 5M6 4h12'),
        r('Sync Folder', 'On', '#007AFF', 'M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6-1.5A4 4 0 0 1 17 18z'),
        r('Import', '', '#AF52DE', 'M14 3H6v18h12V7zM14 3v4h4M12 11v6M9 14l3 3 3-3')
      ] },
      { title: 'Account & privacy', rows: [
        r('AO3 Account', 'saltwindow', accent, 'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4.5 20c1.4-3.8 4.2-5.8 7.5-5.8s6.1 2 7.5 5.8'),
        r('Privacy', 'Blur mature works', '#3A3A3C', 'M5 12s3-6 7-6 7 6 7 6-3 6-7 6-7-6-7-6zM12 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4z')
      ] },
      { title: 'About', rows: [
        r('About Kudos', 'Version 1.6', '#8E8E93', 'M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17zM12 11v5.5M12 7.8v.1'),
        r('Report a Bug', '', '#FF3B30', 'M8 8a4 4 0 0 1 8 0v6a4 4 0 0 1-8 0zM4 12h4M16 12h4M5 7l3 2M19 7l-3 2M5 18l3-2M19 18l-3-2')
      ] }
    ].map((g) => ({ ...g, rows: g.rows.map((x, i) => ({ ...x, sep: i ? '0.5px solid #E5E5EA' : 'none' })) }));
    return { accent, groups };
  }
}
</script>
</body>
</html>

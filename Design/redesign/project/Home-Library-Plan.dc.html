<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home launches, Library organises</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1290px; height: 640px; box-sizing: border-box; padding: 26px 34px; background: #FFFFFF; color: #1C1C1E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <header style="display: flex; align-items: baseline; gap: 14px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Home launches, Library organises</h1>
    <p style="margin: 0; font-size: 15px; color: #3A3A3C">Proposal, 2026-10-27. Each part of today's two tabs gets exactly one home.</p>
  </header>
  <div style="display: flex; align-items: flex-start; gap: 18px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 195px">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 26px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0"><dc-import name="Home-Launchpad" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>1</b> {{cap1}}</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 195px">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 26px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0"><dc-import name="Library-Organize" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>2</b> {{cap2}}</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 195px">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 26px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0"><dc-import name="Work-AddTo" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>3</b> {{cap3}}</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 195px">
      <div style="width: 195px; height: 422px; overflow: hidden; border-radius: 26px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 390px; height: 844px; transform: scale(0.5); transform-origin: 0 0"><dc-import name="Queue-Manage" hint-size="390px,844px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>4</b> {{cap4}}</figcaption>
    </figure>

    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Where each part lives</h2>
      <div style="border-top: 0.5px solid #D1D1D6">
        <sc-for list="{{moves}}" as="m" hint-placeholder-count="10">
          <div style="display: flex; gap: 10px; padding: 5px 0; border-bottom: 0.5px solid #E5E5EA; font-size: 13px; line-height: 18px">
            <span style="width: 150px; flex-shrink: 0; font-weight: 600">{{m.what}}</span>
            <span style="flex: 1; color: #3A3A3C">{{m.where}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1290,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cap1: 'Home: what to read now. Continue Reading, Subscriptions (new chapters and new works), each queue\'s next work, pinned collections.',
      cap2: 'Library: where you organise. Cover shelves first (Favourites, Collections, Downloaded), then six shelf tiles you choose and On AO3; New and Select live here, not on Home.',
      cap3: 'Long-press any work: quick row on top, queues and collections open in place, each with New… at the end.',
      cap4: 'In a queue: swipe right to Read Next, left to Remove, press and drag to reorder. The Move menu goes.',
      moves: [
        ['Resume hero', 'Home › Continue Reading'],
        ['Reading Now', 'Home › Also Reading; Library keeps a Reading Now tile'],
        ['New Chapters + Subscriptions', 'Home › Subscriptions: chapters, new works, series'],
        ['Queues', 'Home › Queues with Start; Library › Queues tile opens the organiser'],
        ['Want to Read', 'Library tile (it is the built-in queue)'],
        ['Finished, Downloaded, Favourites, History', 'Library tiles; Edit Shelves (••• menu) picks the six; All Works from the header'],
        ['Collections', 'Library grid with New Collection; pin one to Home'],
        ['Select, New, Import', 'Library toolbar'],
        ['Reading stats', 'Home header line › Insights'],
        ['Recently Deleted, Insights', 'Library ••• menu']
      ].map(([what, where]) => ({ what, where }))
    };
  }
}
</script>
</body>
</html>

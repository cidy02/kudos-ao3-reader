<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library filters sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1400px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="padding: 18px 16px 0">
    <span style="font-size: 34px; line-height: 41px; font-weight: 700">Library</span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.20)"></div>

  <section role="dialog" aria-label="Filters" style="position: absolute; left: 0; right: 0; top: 62px; bottom: 0; border-radius: 38px 38px 0 0; background: #F2F2F7; box-shadow: 0 -8px 30px rgba(0,0,0,0.18); overflow: hidden">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC; margin: 7px auto 0"></div>
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 10px">
      <button aria-label="Close" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.8); box-shadow: 0 4px 14px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.06)">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center">
        <h2 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600">Filters</h2>
        <span style="font-size: 13px; line-height: 18px; color: #6C6C70">42 works</span>
      </div>
      <button aria-label="Apply filters" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #990000; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.6L19.2 7.4"></path></svg>
      </button>
    </header>

    <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 6px">
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <sc-for list="{{top}}" as="r" hint-placeholder-count="3">
          <sc-if value="{{r.sep}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="margin-left: 16px; height: 0.5px; background: #D1D1D6"></div></sc-if>
          <div style="min-height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px">
            <span style="flex: 1; font-size: 17px">{{r.label}}</span>
            <button style="border: none; background: none; padding: 0; font-family: inherit; font-size: 17px; color: #990000; display: flex; align-items: center; gap: 4px">{{r.value}}<svg aria-hidden="true" width="12" height="16" viewBox="0 0 12 16" fill="none" stroke="#990000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6 6 2.5 9.5 6M2.5 10 6 13.5 9.5 10"></path></svg></button>
          </div>
        </sc-for>
      </div>

      <h3 style="margin: 16px 16px 2px; font-size: 13px; line-height: 18px; font-weight: 400; color: #6C6C70">Authors</h3>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <button style="width: 100%; min-height: 52px; padding: 0 16px; border: none; background: transparent; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 10px">
          <span aria-hidden="true" style="display: flex; padding-left: 6px">
            <sc-for list="{{authors}}" as="a" hint-placeholder-count="2"><span style="width: 28px; height: 28px; margin-left: -6px; border-radius: 14px; box-shadow: 0 0 0 2px #FFFFFF; background: {{a.bg}}; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{a.initial}}</span></sc-for>
          </span>
          <span style="flex: 1; font-size: 17px; color: #000000">quietharbor, wrenfield</span>
          <svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
        </button>
      </div>

      <sc-for list="{{facets}}" as="g" hint-placeholder-count="2">
        <h3 style="margin: 16px 16px 2px; font-size: 13px; line-height: 18px; font-weight: 400; color: #6C6C70">{{g.title}}</h3>
        <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="6">
            <sc-if value="{{r.sep}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="margin-left: 16px; height: 0.5px; background: #D1D1D6"></div></sc-if>
            <button aria-label="{{r.aria}}" style="width: 100%; min-height: 48px; padding: 8px 16px; box-sizing: border-box; border: none; background: transparent; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 10px; color: #000000">
              <span style="flex: 1; font-size: 17px; line-height: 22px">{{r.label}}</span>
              <sc-if value="{{r.isIn}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#990000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
              </sc-if>
              <sc-if value="{{r.isOut}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#990000"></circle><path d="M8 12h8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </sc-for>

      <div style="margin-top: 16px; background: #FFFFFF; border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; font-size: 17px"><span>Word count</span><span style="color: #6C6C70">10k – 150k</span></div>
        <div role="group" aria-label="Word count range" style="position: relative; height: 26px">
          <div style="position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: #E5E5EA"></div>
          <div style="position: absolute; left: 12%; right: 30%; top: 11px; height: 4px; border-radius: 2px; background: #990000"></div>
          <span style="position: absolute; left: 12%; top: 0; width: 26px; height: 26px; margin-left: -13px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.3)"></span>
          <span style="position: absolute; left: 70%; top: 0; width: 26px; height: 26px; margin-left: -13px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.3)"></span>
        </div>
      </div>

      <div style="margin-top: 16px; background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <div style="min-height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 0.5px solid #D1D1D6">
          <span style="flex: 1; font-size: 17px">Language</span>
          <button style="border: none; background: none; padding: 0; font-family: inherit; font-size: 17px; color: #990000; display: flex; align-items: center; gap: 4px">Any<svg aria-hidden="true" width="12" height="16" viewBox="0 0 12 16" fill="none" stroke="#990000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6 6 2.5 9.5 6M2.5 10 6 13.5 9.5 10"></path></svg></button>
        </div>
        <div style="min-height: 48px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
          <span style="width: 120px; font-size: 17px">Tags</span>
          <span style="height: 30px; padding: 0 10px; border-radius: 15px; background: rgba(153,0,0,0.10); color: #990000; font-size: 15px; line-height: 30px">✓ Slow Burn</span>
          <span style="font-size: 17px; color: #8E8E93">Add</span>
        </div>
      </div>
      <button style="margin-top: 16px; width: 100%; min-height: 48px; border: none; border-radius: 16px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #D70015; display: flex; align-items: center; justify-content: center">Reset Filters</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = (list) => list.map(([label, state], i) => ({
      label, sep: i > 0, isIn: state === 'in', isOut: state === 'out',
      aria: label + (state === 'in' ? ', included' : state === 'out' ? ', excluded' : '')
    }));
    const list = (items) => items.map((r, i) => ({ ...r, sep: i > 0 }));
    return {
      top: list([
        { label: 'Sort by', value: 'Recently read' },
        { label: 'Rating', value: 'General, Teen' },
        { label: 'Completion', value: 'Any' }
      ]),
      authors: [{ initial: 'Q', bg: '#5B2A4E' }, { initial: 'W', bg: '#2E5339' }],
      facets: [
        { title: 'Warnings', rows: rows([
          ['No Archive Warnings Apply', 'in'],
          ['Creator Chose Not To Use Archive Warnings', ''],
          ['Graphic Depictions Of Violence', ''],
          ['Major Character Death', ''],
          ['Rape/Non-Con', ''],
          ['Underage Sex', '']
        ]) },
        { title: 'Categories', rows: rows([
          ['F/F', ''], ['F/M', 'in'], ['Gen', 'in'], ['M/M', ''], ['Multi', ''], ['Other', '']
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>

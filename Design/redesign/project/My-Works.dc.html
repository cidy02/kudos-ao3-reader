<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your works, series and drafts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 122px; right: 122px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Your Writing</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <button aria-label="Back to Account" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <div style="display: flex; gap: 10px">
      <button aria-label="More: Select, Sort" aria-haspopup="menu" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg></button>
      <button aria-label="New Work" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #FFFFFF; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>
  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="padding: 0 4px; display: flex; flex-direction: column; gap: 2px">
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #6C6C70">Posting as saltwindow</p>
    </header>
    <div role="tablist" aria-label="Writing" style="height: 34px; border-radius: 17px; background: rgba(118,118,128,0.12); padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <button role="tab" aria-selected="true" style="border: none; border-radius: 15px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12); font-family: inherit; font-size: 14px; font-weight: 600">Works · 6</button>
      <button role="tab" aria-selected="false" style="border: none; border-radius: 15px; background: transparent; font-family: inherit; font-size: 14px">Series · 1</button>
      <button role="tab" aria-selected="false" style="border: none; border-radius: 15px; background: transparent; font-family: inherit; font-size: 14px">Drafts · 2</button>
    </div>
    <div style="margin: 0 -16px">
      <sc-for list="{{works}}" as="w" hint-placeholder-count="4">
        <dc-import name="WorkRow" work="{{w}}" divider="{{w.divider}}" accent="{{accent}}" hint-size="100%,100px"></dc-import>
      </sc-for>
    </div>
  </main>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="writing" accent="{{accent}}" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const works = [
      { title: 'Keeper of the Northern Light', author: 'saltwindow', fandom: 'Original Work', rating: 'T', category: 'FF', warnings: 'none', status: 'complete', words: '22,410', chapters: '7/7', kudos: '1,804', hits: '19.2k', updated: '286 comments' },
      { title: 'What the Tide Keeps', author: 'saltwindow', fandom: 'Original Work', rating: 'M', category: 'FF', warnings: 'undisclosed', status: 'wip', words: '9,800', chapters: '3/8', kudos: '412', hits: '4.1k', updated: 'Registered users only' },
      { title: 'Small Weathers', author: 'saltwindow', fandom: 'Persuasion', rating: 'G', category: 'Gen', warnings: 'none', status: 'complete', words: '2,300', chapters: '1/1', kudos: '220', hits: '1.9k' },
      { title: 'Lantern Season', author: 'saltwindow', fandom: 'Original Work', rating: 'T', category: 'Multi', warnings: 'none', status: 'complete', words: '15,050', chapters: '4/4', kudos: '640', hits: '7.7k' }
    ];
    return {
      accent: this.props.accent ?? '#990000',
      works: works.map((w, i) => ({ ...w, divider: i < works.length - 1 }))
    };
  }
}
</script>
</body>
</html>

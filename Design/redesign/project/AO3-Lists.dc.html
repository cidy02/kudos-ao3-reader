<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AO3 History list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 116px; right: 116px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">History</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
    <button aria-label="Back to Account" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <div style="height: 44px; border-radius: 22px; display: flex; align-items: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <button aria-label="Filters" style="width: 46px; height: 44px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
      </button>
      <button aria-label="More: Clear History, Open on AO3" style="width: 46px; height: 44px; border: none; background: transparent; color: #1C1C1E; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
      </button>
    </div>
  </div>
  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="padding: 0 4px; display: flex; flex-direction: column; gap: 2px">
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #6C6C70">On AO3 · 1,204 works · last visited first</p>
    </header>
    <div role="group" aria-label="Show" style="display: flex; gap: 8px">
      <button aria-pressed="true" style="height: 32px; padding: 0 14px; border: none; border-radius: 16px; background: #1C1C1E; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">All</button>
      <button aria-pressed="false" style="height: 32px; padding: 0 14px; border: none; border-radius: 16px; background: #EFEFF4; font-family: inherit; font-size: 14px">Marked for Later</button>
      <button aria-pressed="false" style="height: 32px; padding: 0 14px; border: none; border-radius: 16px; background: #EFEFF4; font-family: inherit; font-size: 14px">Flagged to Skip</button>
    </div>
    <div style="margin: 0 -16px">
      <sc-for list="{{works}}" as="w" hint-placeholder-count="5">
        <dc-import name="WorkRow" work="{{w}}" divider="{{w.divider}}" accent="{{accent}}" hint-size="100%,100px"></dc-import>
      </sc-for>
    </div>
  </main>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="library" accent="{{accent}}" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const works = [
      { title: 'Keeper of the Northern Light', author: 'saltwindow', fandom: 'Original Work', rating: 'T', category: 'FF', warnings: 'none', status: 'complete', words: '22,410', chapters: '7/7', kudos: '1,804', updated: 'Visited today · 3 times' },
      { title: 'Whatever Remains', author: 'deductive_reasoning', fandom: 'Sherlock Holmes', rating: 'E', category: 'MM', warnings: 'present', warningCount: 2, status: 'complete', words: '61,000', chapters: '14/14', kudos: '7,402', updated: 'Visited yesterday', badge: 'Later' },
      { title: 'Moor and Mist', author: 'brontebird', fandom: 'Jane Eyre', rating: 'M', category: 'FM', warnings: 'undisclosed', status: 'complete', words: '54,200', chapters: '18/18', kudos: '2,310', updated: 'Visited Oct 20' },
      { title: 'Small Gods of the Kitchen', author: 'hearthwitch', fandom: 'Original Work', rating: 'G', category: 'Gen', warnings: 'none', status: 'wip', words: '12,400', chapters: '3/?', kudos: '410', updated: 'Visited Oct 18' }
    ];
    return {
      accent: this.props.accent ?? '#990000',
      works: works.map((w, i) => ({ ...w, divider: i < works.length - 1 }))
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Errors and offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 1290px; height: 960px; box-sizing: border-box; padding: 24px 30px; background: #FFFFFF; color: #1C1C1E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; align-items: baseline; gap: 16px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">Errors and offline</h1>
    <p style="margin: 0; font-size: 15px; color: #3A3A3C">Every error says what happened in plain words, keeps a way out, and offers the fix. Raw error codes move behind Details.</p>
  </header>
  <div style="display: flex; gap: 40px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <figcaption style="font-size: 13px; font-weight: 600; color: #6C6C70">Reader can't open a book (today: no way out)</figcaption>
      <div style="width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; background: #FAF7F0; box-shadow: 0 0 0 1px #D1D1D6">
        <button aria-label="Close" style="position: absolute; left: 16px; top: 54px; width: 44px; height: 44px; border: none; border-radius: 22px; background: rgba(255,253,248,0.85); box-shadow: 0 6px 20px rgba(60,40,10,0.10), 0 0 0 0.5px rgba(60,40,10,0.08); color: #1F1B16; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
        <div style="position: absolute; left: 32px; right: 32px; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: #1F1B16">
          <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#8E8170" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6.5v13M9 10l6 6M15 10l-6 6"></path></svg>
          <h2 style="margin: 6px 0 0; font-size: 22px; font-weight: 700">This book won't open</h2>
          <p style="margin: 0; font-size: 15px; line-height: 21px; color: #6B645A">The downloaded file is incomplete. Your place in the story is safe.</p>
          <button style="margin-top: 10px; height: 46px; padding: 0 24px; border: none; border-radius: 23px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600">Download Again</button>
          <button style="border: none; background: none; font-family: inherit; font-size: 15px; color: {{accent}}">Rebuild from Original</button>
          <button style="margin-top: 14px; border: none; background: none; font-family: inherit; font-size: 13px; color: #6B645A">Details · Report a Bug</button>
        </div>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <figcaption style="font-size: 13px; font-weight: 600; color: #6C6C70">Offline: saved results stay usable</figcaption>
      <div style="width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; background: #F2F2F7; box-shadow: 0 0 0 1px #D1D1D6">
        <div style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 12px">
          <span aria-hidden="true" style="position: absolute; left: 16px; top: 54px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></span>
          <span style="position: absolute; left: 68px; right: 68px; top: 54px; text-align: center; font-size: 17px; line-height: 44px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Subscriptions</span>
          <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #FFFFFF">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a10 10 0 0 1 14 0M8 15.5a6 6 0 0 1 8 0M12 19h.01M3 3l18 18"></path></svg>
            <span style="flex: 1; font-size: 14px; line-height: 19px; color: #3A3A3C">You're offline. Showing what Kudos saved at 8:40.</span>
            <button style="border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 600; color: {{accent}}">Retry</button>
          </div>
          <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
            <dc-import name="WorkRow" work="{{w1}}" divider="{{true}}" accent="{{accent}}" hint-size="100%,100px"></dc-import>
            <dc-import name="WorkRow" work="{{w2}}" accent="{{accent}}" hint-size="100%,100px"></dc-import>
          </div>
        </div>
        <div style="position: absolute; left: 16px; bottom: 28px">
          <dc-import name="TabBar" selected="account" accent="{{accent}}" hint-size="358px,62px"></dc-import>
        </div>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <figcaption style="font-size: 13px; font-weight: 600; color: #6C6C70">AO3 refused a post</figcaption>
      <div style="width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; background: #F2F2F7; box-shadow: 0 0 0 1px #D1D1D6">
        <div aria-hidden="true" style="padding: 106px 20px 0; display: flex; flex-direction: column; gap: 14px">
          <span aria-hidden="true" style="position: absolute; left: 16px; top: 54px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></span>
          <span style="position: absolute; left: 68px; right: 68px; top: 54px; text-align: center; font-size: 17px; line-height: 44px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">New Work</span>
          <span style="height: 160px; border-radius: 14px; background: #FFFFFF"></span>
          <span style="height: 120px; border-radius: 14px; background: #FFFFFF"></span>
          <span style="height: 200px; border-radius: 14px; background: #FFFFFF"></span>
        </div>
        <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.2)"></div>
        <div role="alertdialog" aria-label="AO3 couldn't post this" style="position: absolute; left: 45px; right: 45px; top: 300px; border-radius: 30px; padding: 22px 18px 16px; background: rgba(250,250,252,0.94); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 20px 60px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 8px; text-align: center">
          <h2 style="margin: 0; font-size: 17px; font-weight: 600">AO3 couldn't post this</h2>
          <p style="margin: 0; font-size: 14px; line-height: 19px; color: #3A3A3C">AO3 says a fandom is required. Your text is saved on this iPhone.</p>
          <div style="display: flex; gap: 8px; margin-top: 10px">
            <button style="flex: 1; height: 44px; border: none; border-radius: 22px; background: rgba(118,118,128,0.14); font-family: inherit; font-size: 16px">Edit</button>
            <button style="flex: 1; height: 44px; border: none; border-radius: 22px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600">Add Fandom</button>
          </div>
        </div>
      </div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":1290,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#990000',
      w1: { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', words: '118,402', chapters: '15/30', kudos: '5,870', updated: 'Saved 8:40' },
      w2: { title: 'Northanger Nights', author: 'gothicnovelist', fandom: 'Northanger Abbey', rating: 'T', category: 'FM', warnings: 'none', status: 'wip', words: '47,300', chapters: '9/12', kudos: '980', updated: 'Saved 8:40' }
    };
  }
}
</script>
</body>
</html>

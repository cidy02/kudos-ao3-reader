<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post a work › Inspired by</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Inspired By" back="Back to Post" height="900" context="{{context}}" sections="{{sections}}" hint-size="390px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "context": {
    "kicker": "Original Work · new work",
    "kickerColour": "hsl(188, 56%, 33%)",
    "title": "Untitled lighthouse piece",
    "meta": "3,240 words · 1 chapter · not posted yet",
    "cover": "linear-gradient(155deg, hsl(188, 46%, 27%), hsl(210, 50%, 41%))"
  },
  "sections": [
    {
      "header": "Parent works",
      "rows": [
        {
          "label": "The Lighthouse Keepers",
          "sub": "tidewright · Original Work · 40,900 words",
          "meta": "Found on AO3",
          "metaColour": "#2F8F3A",
          "kind": "check",
          "on": true,
          "cover": "linear-gradient(155deg, hsl(188, 46%, 27%), hsl(210, 50%, 41%))"
        },
        {
          "label": "AO3 link",
          "kind": "field",
          "placeholder": "archiveofourown.org/works/…"
        }
      ],
      "footer": "AO3 tells the parent’s creator, unless they turned that off."
    },
    {
      "header": "From your reading",
      "rows": [
        {
          "label": "Salt & Starlight",
          "sub": "wrenfield · Original Work · read this month",
          "kind": "circle",
          "cover": "linear-gradient(155deg, hsl(196, 46%, 27%), hsl(218, 50%, 41%))"
        },
        {
          "label": "Under the Same Stars",
          "sub": "wrenfield · Original Work · finished Oct 19",
          "kind": "circle",
          "cover": "linear-gradient(155deg, hsl(240, 46%, 27%), hsl(262, 50%, 41%))"
        }
      ]
    },
    {
      "header": "Not on AO3",
      "rows": [
        {
          "label": "Title",
          "kind": "field",
          "placeholder": "Title"
        },
        {
          "label": "Link",
          "kind": "field",
          "placeholder": "https://"
        },
        {
          "label": "Translation of this work",
          "kind": "toggle",
          "on": false
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

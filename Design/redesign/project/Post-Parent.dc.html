<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post a work › Inspired by</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Inspired By" back="Back to Post" height="844" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "header": "Parent work",
      "footer": "AO3 lets the parent’s creator know, unless they turned that off.",
      "rows": [
        {
          "label": "AO3 link",
          "kind": "field",
          "text": "archiveofourown.org/works/48211093"
        },
        {
          "label": "The Lighthouse Keepers",
          "sub": "tidewright · Original Work · found on AO3",
          "kind": "check",
          "on": true
        }
      ]
    },
    {
      "header": "Not on AO3",
      "rows": [
        {
          "label": "Title",
          "kind": "field",
          "placeholder": "Title"
        },
        {
          "label": "Link",
          "kind": "field",
          "placeholder": "https://"
        },
        {
          "label": "Translation of this work",
          "kind": "toggle",
          "on": false
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

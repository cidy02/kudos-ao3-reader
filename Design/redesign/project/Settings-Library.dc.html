<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings › Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Library" back="Back to Settings" height="844" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "header": "Opening a work",
      "rows": [
        {
          "label": "Open straight into the reader",
          "kind": "toggle",
          "on": true,
          "sub": "Off: open Work Detail first"
        },
        {
          "label": "Ask before downloading on cellular",
          "kind": "toggle",
          "on": true
        }
      ]
    },
    {
      "header": "When you finish a work",
      "rows": [
        {
          "label": "Mark as Finished at the last page",
          "kind": "toggle",
          "on": true
        },
        {
          "label": "Keep the download",
          "kind": "segments",
          "options": [
            "Always",
            "30 days",
            "Never"
          ],
          "selected": 1
        }
      ]
    },
    {
      "header": "Shelves",
      "rows": [
        {
          "label": "Edit Shelves",
          "kind": "nav",
          "detail": "6 shown"
        },
        {
          "label": "Default sort",
          "kind": "nav",
          "detail": "Recently read"
        }
      ]
    },
    {
      "header": "Recently Deleted",
      "rows": [
        {
          "label": "Keep deleted works for",
          "kind": "value",
          "detail": "90 days"
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

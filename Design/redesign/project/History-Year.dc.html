<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading History · Year</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <h1 data-inline-title style="position: absolute; left: 110px; right: 110px; top: 54px; margin: 0; font-size: 17px; line-height: 44px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Reading History</h1>
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between; z-index: 2">
    <button aria-label="Back to Library" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button style="height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: inherit; font-size: 17px; color: #1C1C1E; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">Select</button>
  </div>

  <main style="padding: 106px 16px 0; display: flex; flex-direction: column; gap: 22px">
    <div role="tablist" aria-label="Range" style="height: 32px; border-radius: 16px; background: rgba(118,118,128,0.12); padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))"><button role="tab" aria-selected="false" style="border: none; border-radius: 14px; background: transparent; box-shadow: none; font-family: inherit; font-size: 13px; font-weight: 400">Week</button><button role="tab" aria-selected="false" style="border: none; border-radius: 14px; background: transparent; box-shadow: none; font-family: inherit; font-size: 13px; font-weight: 400">Month</button><button role="tab" aria-selected="true" style="border: none; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12); font-family: inherit; font-size: 13px; font-weight: 600">Year</button></div>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 13px; line-height: 18px; color: #6C6C70">2026 so far</span>
      <span style="font-size: 28px; line-height: 34px; font-weight: 700">212 h</span>
      <span style="font-size: 13px; line-height: 18px; color: #6C6C70">286 works · 74 finished · 4.1M words</span>
    </div>
    <div role="img" aria-label="{{chartLabel}}" style="display: flex; flex-direction: column; gap: 6px">
      <div style="height: 140px; display: flex; align-items: flex-end; gap: 6px; border-bottom: 0.5px solid #D1D1D6">
        <sc-for list="{{months}}" as="m" hint-placeholder-count="12">
          <span style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%">
            <span style="height: {{m.fin}}px; background: #821019; border-radius: 4px 4px 0 0"></span>
            <span style="height: {{m.rest}}px; background: {{m.restBg}}"></span>
          </span>
        </sc-for>
      </div>
      <div aria-hidden="true" style="display: flex; gap: 6px"><sc-for list="{{months}}" as="m" hint-placeholder-count="12"><span style="flex: 1; text-align: center; font-size: 11px; color: {{m.fg}}; font-weight: {{m.weight}}">{{m.l}}</span></sc-for></div>
      <div aria-hidden="true" style="display: flex; gap: 14px; font-size: 11px; color: #6C6C70"><span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #821019"></span>Finished works</span><span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: rgba(130,16,25,0.3)"></span>Hours read</span></div>
    </div>
    <section aria-label="Your year" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
        <a href="Insights.dc.html" style="text-decoration: none; color: #000000; border-radius: 16px; background: #F2F2F7; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; color: #6C6C70">{{f.label}}</span>
          <span style="font-size: 17px; line-height: 22px; font-weight: 700">{{f.value}}</span>
        </a>
      </sc-for>
    </section>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="library" accent="#821019" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const hrs = [14, 16, 21, 12, 18, 25, 22, 17, 19, 20, 0, 0];
    const fin = [5, 6, 9, 4, 7, 11, 8, 6, 9, 9, 0, 0];
    const L = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
    return {
      chartLabel: 'Hours read by month in 2026, highest in June with 25 hours and 11 finished works',
      months: hrs.map((h, i) => ({ fin: fin[i] * 4, rest: Math.max(0, h * 5 - fin[i] * 4), restBg: i > 9 ? 'transparent' : 'rgba(130,16,25,0.3)', l: L[i], fg: i === 9 ? '#821019' : '#6C6C70', weight: i === 9 ? 700 : 400 })),
      facts: [['Longest streak', '23 days'], ['Most-read fandom', 'Persuasion'], ['Longest work finished', '118k words'], ['Favourite time', 'After 10 pm']].map(([label, value]) => ({ label, value }))
    };
  }
}
</script>
</body>
</html>

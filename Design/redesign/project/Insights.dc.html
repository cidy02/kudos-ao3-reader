<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading Insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7">
  <dc-import name="Insights-Overview" height="844" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // First screen of Overview. All four Insights screens, the sheets and the
    // data spec live on the Reading Insights page.
    return { accent: this.props.accent ?? '#990000' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings › Restore from a backup (sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Restore Backup" mode="sheet" height="844" hero="{{hero}}" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "hero": {
    "title": "Kudos backup, Oct 21",
    "sub": "214 works · 6 queues · 4 collections · 31 MB",
    "colour": "#C25E00",
    "icon": "M12 4v11M7.5 10.5 12 15l4.5-4.5M4 19.5h16"
  },
  "sections": [
    {
      "rows": [
        {
          "label": "Merge with This Library",
          "sub": "Keeps both; newer progress and edits win",
          "kind": "circle",
          "on": true
        },
        {
          "label": "Replace This Library",
          "sub": "This library becomes the backup exactly",
          "kind": "circle",
          "on": false
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Restore",
          "kind": "button"
        }
      ],
      "footer": "Replacing moves today’s library to Recently Deleted for 90 days first."
    }
  ]
};
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home sections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
a{color:#821019}a:hover{color:#6E0000}
</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: {{gap}}px; color: #000000; font-family: {{font}}">
  <sc-if value="{{showAlso}}" hint-placeholder-val="{{true}}">
    <section aria-label="Also Reading" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Also Reading <span style="font-size: 15px; font-weight: 400; color: #6C6C70">6</span></h2>
        <a href="Shelf-ReadingNow.dc.html" style="font-size: 17px; text-decoration: none">See All</a>
      </div>
      <div style="display: flex; gap: 12px; overflow: hidden">
        <sc-for list="{{reading}}" as="w" hint-placeholder-count="3">
          <dc-import name="CoverCard" work="{{w}}" width="{{coverW}}" accent="#821019" hint-size="110px,240px"></dc-import>
        </sc-for>
        <a href="Shelf-ReadingNow.dc.html" aria-label="{{alsoMore}} more in Reading Now" style="width: 96px; flex-shrink: 0; height: {{tileH}}px; border-radius: 12px; background: #F2F2F7; color: #821019; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-weight: 600"><span style="font-size: 22px; line-height: 26px; font-weight: 700">+{{alsoMore}}</span>more<svg aria-hidden="true" width="7" height="12" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg></a>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{showSubs}}" hint-placeholder-val="{{true}}">
    <section aria-label="Subscriptions: new chapters and new works" style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Subscriptions <span style="font-size: 15px; font-weight: 400; color: #6C6C70">9 new</span></h2>
        <a href="Subscriptions.dc.html" style="font-size: 17px; text-decoration: none">See All</a>
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{updated}}" as="w" hint-placeholder-count="3">
          <sc-if value="{{w.sep}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="margin-left: 75px; height: 0.5px; background: #E5E5EA"></div></sc-if>
          <a href="iPhone-WorkDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 0; text-decoration: none; color: #000000">
            <dc-import name="Symbols" variant="grid" rating="{{w.rating}}" category="{{w.category}}" warnings="{{w.warnings}}" status="{{w.status}}" warning-count="{{w.wc}}" size="24" hint-size="63px,63px"></dc-import>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 17px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.title}}</span>
              <dc-import name="ChapterBars" planned="{{w.planned}}" posted="{{w.posted}}" fresh="{{w.fresh}}" seed="{{w.title}}" lengths="{{w.lengths}}" tone="paper" height="16" hint-size="100%,16px"></dc-import>
              <span style="font-size: 13px; line-height: 18px; color: #6C6C70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.author}} · {{w.fandom}} · {{w.when}}</span>
            </div>
            <span style="padding: 0 7px; border-radius: 9px; background: #821019; color: #FFFFFF; font-size: 12px; line-height: 18px; font-weight: 700">{{w.badge}}</span>
          </a>
        </sc-for>
        <a href="Subscriptions.dc.html" style="margin-left: 75px; padding: 10px 0 0; border-top: 0.5px solid #E5E5EA; color: #821019; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600">{{subsMore}} more updates<svg aria-hidden="true" width="7" height="12" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg></a>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{showQueues}}" hint-placeholder-val="{{true}}">
    <section aria-label="Queues" style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Queues</h2>
        <a href="Queues.dc.html" style="font-size: 17px; text-decoration: none">Organise</a>
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{nexts}}" as="n" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: {{n.sep}}">
            <dc-import name="CoverStack" tiles="{{n.tiles}}" colour="{{n.colour}}" initial="{{n.initial}}" kind="queue" width="52" height="52" hint-size="52px,52px"></dc-import>
            <a href="Queue.dc.html" style="flex: 1; min-width: 0; text-decoration: none; color: #000000; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: {{n.colour}}">{{n.queue}}</span>
              <span style="font-size: 17px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span>
              <span style="display: flex; align-items: center; gap: 8px; margin: 3px 0 2px"><span role="img" aria-label="{{n.progressLabel}}" style="flex: 1; display: flex; gap: 3px"><sc-for list="{{n.segs}}" as="g" hint-placeholder-count="8"><span style="flex: 1; height: 4px; border-radius: 2px; background: {{n.track}}; overflow: hidden"><span style="display: block; width: {{g.w}}; height: 4px; background: {{n.colour}}"></span></span></sc-for></span><span style="font-size: 12px; line-height: 16px; color: #6C6C70; white-space: nowrap">{{n.left}}</span></span>
              <span style="font-size: 13px; line-height: 18px; color: #6C6C70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.meta}}</span>
            </a>
            <button aria-label="{{n.actionLabel}}" style="height: 34px; padding: 0 14px; border: none; border-radius: 17px; background: rgba(130,16,25,0.10); color: #821019; font-family: inherit; font-size: 15px; font-weight: 600">{{n.action}}</button>
          </div>
        </sc-for>
        <sc-if value="{{hasQueuesMore}}" hint-placeholder-val="{{false}}">
          <a href="Queues.dc.html" style="margin-left: 64px; padding: 10px 0 0; border-top: 0.5px solid #E5E5EA; color: #821019; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600">{{queuesMore}}<svg aria-hidden="true" width="7" height="12" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg></a>
        </sc-if>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{showPinned}}" hint-placeholder-val="{{false}}">
    <section aria-label="Austen Variations" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700; display: flex; align-items: center; gap: 6px">Austen Variations <span style="font-size: 15px; font-weight: 400; color: #6C6C70">12</span><svg role="img" aria-label="Pinned to Home" width="14" height="14" viewBox="0 0 24 24" fill="#8E8E93"><path d="M15 3l6 6-3 1-4 4 .5 4.5L13 20l-4-4-5 5-1-1 5-5-4-4 1.5-1.5L10 10l4-4z"></path></svg></h2>
        <a href="Collection.dc.html" style="font-size: 17px; text-decoration: none">See All</a>
      </div>
      <div style="display: flex; gap: 12px; overflow: hidden">
        <sc-for list="{{collection}}" as="w" hint-placeholder-count="3">
          <dc-import name="CoverCard" work="{{w}}" width="{{coverW}}" accent="#821019" hint-size="110px,240px"></dc-import>
        </sc-for>
        <a href="Collection.dc.html" aria-label="{{pinnedMore}} more in Austen Variations" style="width: 96px; flex-shrink: 0; height: {{tileH}}px; border-radius: 12px; background: #F2F2F7; color: #821019; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-weight: 600"><span style="font-size: 22px; line-height: 26px; font-weight: 700">+{{pinnedMore}}</span>more<svg aria-hidden="true" width="7" height="12" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg></a>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"show":{"editor":"text","default":"also,subs,queues,pinned"},"covers":{"editor":"int","default":2,"min":1,"max":4},"coverWidth":{"editor":"int","default":120,"min":90,"max":140},"rows":{"editor":"int","default":4,"min":1,"max":4},"queues":{"editor":"int","default":3,"min":1,"max":3},"gap":{"editor":"int","default":26},"font":{"editor":null},"$preview":{"width":364,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    // The sections under the Resume card on Home (Home-Launchpad is the iPhone layout of the
    // same content). Every iPhone Duo pose mounts this, so the poses cannot drift apart:
    // show="also" | "subs" | "queues" | "pinned", comma-separated, in that fixed order.
    const p = this.props;
    const show = String(p.show ?? 'also,subs,queues,pinned').split(',').map((s) => s.trim());
    const int = (v, d) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : d; };
    const covers = int(p.covers, 2), rows = int(p.rows, 4), queues = int(p.queues, 3), coverW = int(p.coverWidth, 120);
    const art = (h) => 'linear-gradient(155deg, hsl(' + h + ', 46%, 27%), hsl(' + ((h + 22) % 360) + ', 50%, 41%))';
    const rgba = (hex, a) => { const x = hex.replace('#', ''); return 'rgba(' + parseInt(x.slice(0, 2), 16) + ',' + parseInt(x.slice(2, 4), 16) + ',' + parseInt(x.slice(4, 6), 16) + ',' + a + ')'; };
    // planned: null = the author has not set a total (AO3 "5/?"); 1 of 1 = a one-chapter work.
    const updated = [
      { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', planned: 30, posted: 15, fresh: 3, badge: '+3', when: '2 h ago' },
      { title: 'The Hound, Revisited', author: 'fogandlamplight', fandom: 'Sherlock Holmes', rating: 'T', category: 'MM', warnings: 'present', status: 'wip', planned: null, posted: 5, fresh: 1, badge: '+1', when: 'yesterday' },
      { title: 'Watson Abroad', author: 'fogandlamplight', fandom: 'Sherlock Holmes', rating: 'G', category: 'Gen', warnings: 'none', status: 'complete', planned: 1, posted: 1, fresh: 1, badge: 'New', when: 'new work · 5 h ago' },
      { title: 'Northanger Nights', author: 'gothicnovelist', fandom: 'Northanger Abbey', rating: 'T', category: 'FM', warnings: 'none', status: 'wip', planned: 12, posted: 9, fresh: 1, badge: '+1', when: 'Oct 24' }
    ].slice(0, rows).map((w, i) => ({ ...w, wc: 1, sep: i > 0 }));
    const nexts = [
      ['Summer Reading', '#C25E00', [181, 340, 28, 266], 'Five Times Elizabeth Laughed', 'quietharbor · 6,700 words · about 25 min', 'Start', [100, 100, 60, 0, 0, 0, 0, 0], '5 to go', '2 of 8 finished'],
      ['Re-reads', '#1E63C8', [262, 290, 196, 330], 'The Lighthouse Keepers', 'tidewright · Ch 4 of 10 · 30%', 'Resume', [100, 100, 100, 30, 0], '2 to go', '3 of 5 finished'],
      ['For the Train', '#2F8F3A', [32, 188, 340, 150], 'Small Gods of the Kitchen', 'hearthwitch · 12,400 words · not downloaded', 'Start', [0, 0, 0], '3 to go', 'none started']
    ].slice(0, queues).map(([queue, colour, hues, title, meta, action, fills, left, progressLabel], i) => ({
      queue, colour, title, meta, action, left, progressLabel, track: rgba(colour, 0.2), segs: fills.map((f) => ({ w: f + '%' })),
      initial: queue.charAt(0), tiles: hues.map(art),
      actionLabel: action + ' ' + title, sep: i ? '0.5px solid #E5E5EA' : 'none'
    }));
    return {
      gap: int(p.gap, 26),
      font: p.font || "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif",
      showAlso: show.includes('also'), showSubs: show.includes('subs'), showQueues: show.includes('queues'), showPinned: show.includes('pinned'),
      coverW, tileH: Math.round(coverW * 166 / 120),
      alsoMore: 6 - covers, pinnedMore: 12 - covers, subsMore: 9 - updated.length,
      hasQueuesMore: queues < 3, queuesMore: (3 - queues) + (3 - queues === 1 ? ' more queue' : ' more queues'),
      updated, nexts,
      reading: [
        { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', meta: coverW < 110 ? 'Ch 12 · 40%' : 'Ch 12 of 30 · 40%', progress: 40, badge: '+3' },
        { title: 'Whatever Remains', author: 'fogandlamplight', fandom: 'Sherlock Holmes', rating: 'E', category: 'MM', warnings: 'present', warningCount: 2, status: 'complete', hidden: true },
        { title: 'Letters Never Sent', author: 'marginalia', fandom: 'Persuasion', rating: 'T', category: 'FM', warnings: 'none', status: 'complete', meta: 'Ch 3 of 4 · 50%', progress: 50 },
        { title: 'Moor and Mist', author: 'brontebird', fandom: 'Jane Eyre', rating: 'M', category: 'FM', warnings: 'undisclosed', status: 'complete', meta: 'Ch 11 of 18 · 61%', progress: 61 }
      ].slice(0, covers),
      collection: [
        { title: 'A Map of Small Hours', author: 'quietharbor', fandom: 'Pride and Prejudice', rating: 'G', category: 'FM', warnings: 'none', status: 'complete', words: '32k', chapters: '9/9' },
        { title: 'Northanger Nights', author: 'gothicnovelist', fandom: 'Northanger Abbey', rating: 'T', category: 'FM', warnings: 'none', status: 'wip', words: '47k', chapters: '9/12', badge: '+1' },
        { title: 'Five Times Elizabeth Laughed', author: 'quietharbor', fandom: 'Pride and Prejudice', rating: 'G', category: 'Multi', warnings: 'none', status: 'complete', words: '6.7k', chapters: '1/1' },
        { title: 'Half Agony, Half Hope', author: 'anne_at_lyme', fandom: 'Persuasion', rating: 'T', category: 'FM', warnings: 'none', status: 'complete', words: '18k', chapters: '3/3' }
      ].slice(0, covers)
    };
  }
}
</script>
</body>
</html>

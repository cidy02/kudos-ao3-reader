<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1560px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div style="position: absolute; right: 16px; top: 54px">
    <button aria-label="AO3 website" style="width: 44px; height: 44px; border: none; border-radius: 22px; color: #1C1C1E; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12h17M12 3.5c2.5 2.6 3.6 5.4 3.6 8.5s-1.1 5.9-3.6 8.5c-2.5-2.6-3.6-5.4-3.6-8.5s1.1-5.9 3.6-8.5z"></path></svg>
    </button>
  </div>
  <main style="padding: 56px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0 4px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Browse</h1>
    <section aria-label="Jump back in" style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Jump Back In</h2>
      <div style="display: flex; gap: 8px; margin-right: -16px; overflow: hidden">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
          <button style="flex-shrink: 0; height: 56px; padding: 0 14px 0 8px; border: none; border-radius: 16px; background: #F2F2F7; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 10px">
            <span aria-hidden="true" style="width: 28px; height: 40px; flex-shrink: 0; border-radius: 6px; background: {{r.art}}"></span>
            <span style="display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #000000">{{r.name}}</span><span style="font-size: 13px; line-height: 18px; color: #6C6C70">{{r.detail}}</span></span>
          </button>
        </sc-for>
      </div>
    </section>
    <section aria-label="Categories" style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Categories</h2>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{media}}" as="c" hint-placeholder-count="11">
          <div style="border-radius: 16px; background: #F2F2F7; padding: 2px 12px 6px; display: flex; flex-direction: column">
            <button aria-label="{{c.label}}" style="height: 56px; border: none; background: transparent; padding: 0; font-family: inherit; text-align: left; color: #000000; display: flex; align-items: center; gap: 12px">
              <span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: {{c.art}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.d}}"></path></svg>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 16px; line-height: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
                <span style="font-size: 13px; line-height: 18px; color: #6C6C70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.stats}}</span>
              </span>
              <sc-if value="{{c.hasDownloads}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; gap: 3px; font-size: 13px; line-height: 18px; color: #6C6C70">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"></path></svg>{{c.downloaded}}
                </span>
              </sc-if>
              <svg aria-hidden="true" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
            </button>
            <div style="display: flex; align-items: center; gap: 6px; overflow: hidden">
              <sc-for list="{{c.chips}}" as="f" hint-placeholder-count="2">
                <button aria-label="{{f.label}}" style="height: 36px; min-width: 0; flex-shrink: 1; border: none; background: transparent; padding: 0; font-family: inherit; display: flex; align-items: center">
                  <span style="height: 28px; min-width: 0; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; padding: 0 9px; display: flex; align-items: center; gap: 5px">
                    <sc-if value="{{f.familiar}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 2.5px; height: 12px; flex-shrink: 0; border-radius: 2px; background: {{accent}}"></span></sc-if>
                    <span style="min-width: 0; font-size: 13px; line-height: 16px; font-weight: 500; color: #1C1C1E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span>
                    <span style="flex-shrink: 0; font-size: 11px; line-height: 14px; color: #6C6C70; white-space: nowrap">{{f.count}}</span>
                  </span>
                </button>
              </sc-for>
              <button aria-label="{{c.moreLabel}}" style="height: 36px; flex-shrink: 0; border: none; background: transparent; padding: 0; font-family: inherit; display: flex; align-items: center">
                <span style="height: 28px; box-sizing: border-box; border-radius: 14px; border: 1px dashed #AEAEB2; padding: 0 9px; display: flex; align-items: center; font-size: 12px; line-height: 16px; font-weight: 500; color: #6C6C70; white-space: nowrap">{{c.more}}</span>
              </button>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94) 72%); pointer-events: none"></div>
  <div style="position: absolute; left: 16px; bottom: 28px">
    <dc-import name="TabBar" selected="browse" accent="{{accent}}" hint-size="358px,62px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const hex = accent.replace('#', '');
    const tint = 'rgba(' + parseInt(hex.slice(0, 2), 16) + ',' + parseInt(hex.slice(2, 4), 16) + ',' + parseInt(hex.slice(4, 6), 16) + ',0.10)';
    const art = (h) => 'linear-gradient(155deg, hsl(' + h + ', 46%, 27%), hsl(' + ((h + 22) % 360) + ', 50%, 41%))';
    const seedOf = (t) => { let h = 7; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h; };
    const FAN = { 'Original Work': 188, 'Persuasion': 335, 'Sherlock Holmes': 32, 'Jane Eyre': 262, 'Northanger Abbey': 290, 'Pride and Prejudice': 150 };
    const fandomArt = (name) => { const k = Object.keys(FAN).find((f) => name.indexOf(f) === 0); return art(k ? FAN[k] : seedOf(name) % 360); };
    const chip = (name, count, familiar) => ({
      name,
      count,
      familiar: !!familiar,
      label: name + ', ' + count + ' works' + (familiar ? ', you have read from this fandom' : '')
    });
    const cat = (name, d, fandoms, works, chips, downloaded) => ({
      name,
      d,
      chips,
      stats: fandoms + ' fandoms · ' + works + ' works',
      label: name + ', ' + fandoms + ' fandoms, ' + works + ' works' + (downloaded ? ', ' + downloaded + ' downloaded' : ''),
      hasDownloads: !!downloaded,
      downloaded: downloaded || '',
      more: '+' + fandoms + ' more',
      moreLabel: 'All ' + fandoms + ' fandoms in ' + name
    });
    const out = {
      accent,
      accentTint: tint,
      recent: [
        { name: 'Sherlock Holmes', detail: 'Books · visited today' },
        { name: 'Pride and Prejudice', detail: 'Books · ★ favourite' },
        { name: 'Original Work', detail: 'Other Media' }
      ],
      media: [
        cat('Anime & Manga', 'M4 6h16v12H4zM9 10l5 2-5 2z', '6.1k', '~1.5M', [chip('Naruto', '190k'), chip('Haikyuu!!', '120k')]),
        cat('Books & Literature', 'M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6.5v13', '18k', '~2.1M', [chip('Sherlock Holmes', '~30k', true)], '26'),
        cat('Cartoons & Comics', 'M4 5h16v11H9l-5 4z', '3.4k', '~480k', [chip('Batman', '95k'), chip('Peanuts', '1.2k')]),
        cat('Celebrities & Real People', 'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4.5 20c1.4-3.8 4.2-5.8 7.5-5.8s6.1 2 7.5 5.8', '2.9k', '~610k', [chip('Historical RPF', '41k')]),
        cat('Movies', 'M4 6h16v12H4zM4 10h16M8 6l2 4M13 6l2 4', '9.8k', '~1.3M', [chip('Star Wars', '210k'), chip('Alien', '4.1k')]),
        cat('Music & Bands', 'M9 18V6l10-2v12M9 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM19 16a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z', '4.5k', '~520k', [chip('BTS', '150k'), chip('Queen', '8.4k')]),
        cat('Other Media', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z', '7.2k', '~640k', [chip('Original Work', '280k', true)], '3'),
        cat('Theater', 'M5 5h14v6a7 7 0 0 1-14 0zM9 10h.01M15 10h.01M9 14c2 1.5 4 1.5 6 0', '1.9k', '~150k', [chip('Hamilton', '52k'), chip('Hamlet', '2.3k')]),
        cat('TV Shows', 'M4 7h16v11H4zM9 3l3 4 3-4', '22k', '~2.4M', [chip('Supernatural', '300k'), chip('Merlin', '60k')]),
        cat('Video Games', 'M6 9h12a3 3 0 0 1 3 3v2a3 3 0 0 1-5.4 1.8L14 14h-4l-1.6 1.8A3 3 0 0 1 3 14v-2a3 3 0 0 1 3-3zM8 11v3M6.5 12.5h3', '8.3k', '~1.1M', [chip('Genshin Impact', '140k')]),
        cat('Uncategorized Fandoms', 'M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17zM9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.4V14M12 17v.1', '2.2k', '~95k', [chip('Fairy Tales', '3.1k')])
      ]
    };
    out.recent = out.recent.map((x) => ({ ...x, art: fandomArt(x.name) }));
    out.media = out.media.map((x) => ({ ...x, art: art(seedOf(x.name) % 360) }));
    return out;
  }
}
</script>
</body>
</html>

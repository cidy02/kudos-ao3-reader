<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow: iPhone Duo unfolding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1290px; height: 620px; box-sizing: border-box; padding: 26px 34px; background: #FFFFFF; color: #1C1C1E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <header style="display: flex; align-items: baseline; gap: 14px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Start on the cover, unfold to keep reading</h1>
    <p style="margin: 0; font-size: 15px; color: #3A3A3C">The same page stays put while the screen changes shape.</p>
  </header>
  <div style="display: flex; align-items: flex-start; gap: 10px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 177px">
      <div style="width: 177px; height: 258px; overflow: hidden; border-radius: 22px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 466px; height: 678px; transform: scale(0.38); transform-origin: 0 0"><dc-import name="Duo-Cover-Home" hint-size="466px,678px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>1</b> Closed: Home on the cover, tabs in a rail on the right. Resume.</figcaption>
    </figure>
    <span aria-hidden="true" style="align-self: flex-start; margin-top: 112px; font-size: 26px; color: #C7C7CC">→</span>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 177px">
      <div style="width: 177px; height: 258px; overflow: hidden; border-radius: 22px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 466px; height: 678px; transform: scale(0.38); transform-origin: 0 0"><dc-import name="Duo-Cover-Reader" hint-size="466px,678px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>2</b> One page at a time on the cover, with the same controls as iPhone.</figcaption>
    </figure>
    <span aria-hidden="true" style="align-self: flex-start; margin-top: 112px; font-size: 26px; color: #C7C7CC">→</span>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 361px">
      <div style="width: 361px; height: 254px; overflow: hidden; border-radius: 18px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 951px; height: 669px; transform: scale(0.38); transform-origin: 0 0"><dc-import name="Duo-Open-Reader" hint-size="951px,669px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>3</b> Unfold flat: the page you were on becomes the left half of a two-page spread.</figcaption>
    </figure>
    <span aria-hidden="true" style="align-self: flex-start; margin-top: 112px; font-size: 26px; color: #C7C7CC">→</span>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; width: 361px">
      <div style="width: 361px; height: 254px; overflow: hidden; border-radius: 18px; box-shadow: 0 0 0 1px #D1D1D6"><div style="width: 951px; height: 669px; transform: scale(0.38); transform-origin: 0 0"><dc-import name="Duo-Book-Comments" hint-size="951px,669px"></dc-import></div></div>
      <figcaption style="font-size: 13px; line-height: 18px"><b>4</b> Half-fold like a book: keep reading on one side, the chapter's comments on the other. Nothing sits on the fold.</figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1290,"height":620}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
a{color:#990000}a:hover{color:#6E0000}
</style>
</helmet>
<div style="width: 466px; height: 678px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <main style="padding: 28px 86px 0 16px; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; flex-direction: column; gap: 2px; padding-right: 80px">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Home</h1>
      <a href="Insights.dc.html" style="align-self: flex-start; text-decoration: none; font-size: 15px; line-height: 20px; color: #6C6C70"><span style="font-weight: 600; color: #3A3A3C">4 h 10 m</span> this week · <span style="font-weight: 600; color: #3A3A3C">9-day</span> streak ›</a>
    </header>

    <dc-import name="ResumeCard" variant="home" width="364" accent="#990000" hint-size="364px,280px"></dc-import>

    <section aria-label="Reading Now" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">Reading Now</h2>
        <a href="Library-Section.dc.html" style="font-size: 17px; text-decoration: none">See All</a>
      </div>
      <div style="width: 364px; display: flex; gap: 12px; overflow: hidden">
        <sc-for list="{{reading}}" as="w" hint-placeholder-count="3">
          <dc-import name="CoverCard" work="{{w}}" width="110" accent="#990000" hint-size="110px,240px"></dc-import>
        </sc-for>
      </div>
    </section>

    <section aria-label="New Chapters" style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 700">New Chapters</h2>
      <div style="margin-left: -16px"><dc-import name="WorkRow" work="{{fresh}}" accent="#990000" hint-size="100%,100px"></dc-import></div>
    </section>
  </main>

  <button style="position: absolute; right: 16px; top: 27px; height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: inherit; font-size: 17px; color: #1C1C1E; background: rgba(255,255,255,0.74); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">Select</button>

  <div style="position: absolute; right: 10px; top: 182px">
    <dc-import name="TabRail" selected="home" accent="#990000" hint-size="64px,312px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":466,"height":678}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      reading: [
        { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', meta: 'Ch 12 of 30 · 40%', progress: 40, badge: '+3' },
        { title: 'Whatever Remains', author: 'fogandlamplight', fandom: 'Sherlock Holmes', rating: 'E', category: 'MM', warnings: 'present', warningCount: 2, status: 'complete', hidden: true },
        { title: 'Letters Never Sent', author: 'marginalia', fandom: 'Persuasion', rating: 'T', category: 'FM', warnings: 'none', status: 'complete', meta: 'Ch 3 of 4 · 50%', progress: 50 },
        { title: 'Moor and Mist', author: 'brontebird', fandom: 'Jane Eyre', rating: 'M', category: 'FM', warnings: 'undisclosed', status: 'complete', meta: 'Ch 11 of 18 · 61%', progress: 61 }
      ],
      fresh: { title: 'Salt & Starlight', author: 'wrenfield', fandom: 'Original Work', rating: 'M', category: 'Gen', warnings: 'undisclosed', status: 'wip', words: '118,402', chapters: '15/30', kudos: '5,870', updated: '3 new chapters · 2 h ago', badge: '+3' }
    };
  }
}
</script>
</body>
</html>

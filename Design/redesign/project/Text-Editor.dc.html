<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chapter text editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1250px; height: 880px; display: flex; gap: 40px; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif">
  <sc-for list="{{phones}}" as="p" hint-placeholder-count="3">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-size: 13px; line-height: 26px; font-weight: 600; color: #6C6C70">{{p.caption}}</figcaption>
      <div style="width: 390px; height: 844px; overflow: hidden; border-radius: 0">
        <dc-import name="ChapterEditor" view="{{p.view}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
      </div>
    </figure>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":1250,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#990000',
      phones: [
        { caption: 'Writing: shortcut bar over the keyboard', view: 'keyboard' },
        { caption: 'Format panel in place of the keyboard', view: 'format' },
        { caption: 'Reading view (Preview)', view: 'preview' }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Queues › Smart Queue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Smart Queue" mode="sheet" confirm="Save" height="844" sections="{{sections}}" context="{{context}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Idea: a queue that fills itself from the library by rules, like a smart playlist.
    // It needs no fetching: it only reads what the library already knows about each work.
    return {
      "sections": [
        {
          "header": "Name",
          "rows": [
            {
              "kind": "field",
              "text": "Short and finished"
            }
          ]
        },
        {
          "header": "Works in my library that match",
          "rows": [
            {
              "label": "Match",
              "kind": "segments",
              "options": [
                "All rules",
                "Any rule"
              ],
              "selected": 0
            },
            {
              "label": "Length",
              "kind": "nav",
              "detail": "Under 20,000 words"
            },
            {
              "label": "Status",
              "kind": "nav",
              "detail": "Complete"
            },
            {
              "label": "Progress",
              "kind": "nav",
              "detail": "Not started"
            },
            {
              "label": "Add Rule…",
              "kind": "button"
            }
          ]
        },
        {
          "header": "Order",
          "rows": [
            {
              "label": "Sort",
              "kind": "nav",
              "detail": "Shortest first"
            },
            {
              "label": "Limit",
              "kind": "nav",
              "detail": "25 works"
            }
          ]
        },
        {
          "header": "Preview",
          "footer": "A smart queue updates itself as your library changes. A work leaves when it stops matching, for example when you finish it.",
          "rows": [
            {
              "label": "Matches now",
              "kind": "nav",
              "detail": "12 works",
              "sub": "About 3 h 10 min · 9 offline"
            }
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>

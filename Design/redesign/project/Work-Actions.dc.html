<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work actions menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 380px; background: linear-gradient(to bottom, rgba(37,119,132,0.20), rgba(37,119,132,0.12) 35%, rgba(37,119,132,0.05) 65%, rgba(37,119,132,0))"></div>
  <div aria-hidden="true" style="position: relative; padding: 108px 16px 0; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: hsl(188, 56%, 33%)">Original Work</span>
    <span style="width: 16px; height: 2px; border-radius: 1px; background: hsl(188, 56%, 33%)"></span>
    <span style="font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">The Cartographer’s Daughter</span>
    <span style="font-size: 17px; color: {{accent}}">inkwell_moth</span>
    <div style="margin-top: 14px; height: 300px; border-radius: 16px; background: linear-gradient(155deg, hsl(188, 46%, 27%), hsl(210, 50%, 41%))"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.16)"></div>

  <div style="position: absolute; right: 16px; top: 54px; height: 44px; border-radius: 22px; display: flex; align-items: center; background: rgba(255,255,255,0.74); box-shadow: 0 6px 20px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)">
    <span style="width: 46px"></span><span style="width: 46px"></span>
    <button aria-label="More actions" aria-expanded="true" style="width: 46px; height: 44px; border: none; border-radius: 22px; background: rgba(0,0,0,0.06); color: #1C1C1E; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
    </button>
  </div>

  <div role="menu" aria-label="Work actions" style="position: absolute; right: 16px; top: 104px; width: 270px; border-radius: 24px; padding: 4px 0; background: rgba(250,250,252,0.88); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 18px 50px rgba(0,0,0,0.22), 0 0 0 0.5px rgba(0,0,0,0.08)">
    <sc-for list="{{items}}" as="m" hint-placeholder-count="12">
      <sc-if value="{{m.isHeader}}" hint-placeholder-val="{{false}}">
        <div style="padding: 8px 16px 4px; font-size: 13px; font-weight: 400; color: #6C6C70; border-top: {{m.sep}}">{{m.label}}</div>
      </sc-if>
      <sc-if value="{{m.isItem}}" hint-placeholder-val="{{true}}">
        <button role="menuitem" style="width: 100%; height: 42px; border: none; background: transparent; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-family: inherit; font-size: 16px; color: {{m.color}}; text-align: left">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.d}}"></path></svg>
          <span style="flex: 1">{{m.label}}</span>
          <span style="font-size: 14px; color: #6C6C70">{{m.detail}}</span>
        </button>
      </sc-if>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#990000","options":["#990000","#B3261E","#7A1F2B","#1F4E5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#990000';
    const sep = '0.5px solid rgba(60,60,67,0.18)';
    const H = (label, first) => ({ isHeader: true, isItem: false, label, sep: first ? 'none' : sep, d: '', color: '', detail: '' });
    const I = (label, d, detail, color) => ({ isHeader: false, isItem: true, label, d, detail: detail || '', color: color || '#000000', sep: 'none' });
    return {
      accent,
      items: [
        H('On AO3', true),
        I('Give Kudos', 'M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z'),
        I('Edit Bookmark…', 'M7 4h10v16l-5-4-5 4z', 'saved'),
        I('Subscribe', 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4'),
        I('Mark for Later', 'M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 8v4l3 2'),
        I('Comments', 'M4 5h16v11H9l-5 4z', '286'),
        H('Library'),
        I('Favourite', 'm12 3.8 2.5 5.2 5.6.8-4.1 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.8z'),
        I('Want to Read', 'M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 8v4l3 2'),
        I('Mark as Finished', 'M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17zM8 12.5l2.8 2.8L16.5 9.5'),
        I('Add to Queue…', 'M4 6h12M4 11h12M4 16h7M17 14v6M14 17h6'),
        I('Add to Collection…', 'M6 8h12v12H6zM8 5h8'),
        I('Rebuild from Original', 'M19 12a7 7 0 1 1-2.1-5M19 4v4h-4'),
        H('Share'),
        I('Share…', 'M12 15V4M8 8l4-4 4 4M5 12v8h14v-8'),
        I('Open on AO3', 'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6'),
        I('Delete from Library', 'M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13', '', '#D70015')
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in to AO3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: rgba(0,0,0,0.3); color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <section role="dialog" aria-label="Log in to AO3" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; border-radius: 38px 38px 0 0; background: #F2F2F7; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC; margin: 7px auto 0"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px">
      <button aria-label="Close" style="width: 40px; height: 40px; border: none; border-radius: 20px; background: rgba(118,118,128,0.14); color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      <h2 style="margin: 0; font-size: 17px; font-weight: 600">Log In to AO3</h2>
      <span style="width: 40px"></span>
    </div>
    <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px">
      <div style="padding: 12px 14px; border-radius: 16px; background: #FFFFFF; display: flex; gap: 10px; align-items: flex-start">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F8F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>
        <p style="margin: 0; font-size: 14px; line-height: 19px; color: #3A3A3C">This is AO3's own sign-in page. Your password goes straight to AO3; Kudos keeps only the session, in this device's Keychain.</p>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <label style="display: flex; align-items: center; height: 50px; padding: 0 16px; gap: 12px; border-bottom: 0.5px solid #E5E5EA">
          <span style="width: 96px; font-size: 16px">Username</span>
          <input type="text" autocomplete="username" placeholder="or email" style="flex: 1; border: none; font-family: inherit; font-size: 16px; outline: none; background: transparent">
        </label>
        <label style="display: flex; align-items: center; height: 50px; padding: 0 16px; gap: 12px">
          <span style="width: 96px; font-size: 16px">Password</span>
          <input type="password" autocomplete="current-password" style="flex: 1; border: none; font-family: inherit; font-size: 16px; outline: none; background: transparent">
        </label>
      </div>
      <button style="height: 50px; border: none; border-radius: 25px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">Log In</button>
      <div style="display: flex; justify-content: space-between; padding: 0 4px">
        <button style="border: none; background: none; padding: 0; font-family: inherit; font-size: 15px; color: {{accent}}">Forgot your password?</button>
        <button style="border: none; background: none; padding: 0; font-family: inherit; font-size: 15px; color: {{accent}}">Create an AO3 account</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":null,"default":"#990000"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#990000' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Writing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
a{color:#821019}a:hover{color:#6E0000}
</style>
</helmet>
<div style="width: 951px; height: 669px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div style="position: absolute; left: 24px; top: 18px; width: 431px">
    <dc-import name="Writing" embed="a" hint-size="431px,640px"></dc-import>
  </div>
  <div style="position: absolute; left: 495px; top: 26px; width: 376px">
    <dc-import name="Writing" embed="b" hint-size="376px,640px"></dc-import>
  </div>
  <div style="position: absolute; right: 8px; top: 0; z-index: 2">
    <dc-import name="DuoSideBar" height="669" tabs="writing" actions="{{side}}" accent="#821019" hint-size="64px,669px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":951,"height":669}}'>
class Component extends DCLogic {
  renderVals() {
    // Open, flat: the Writing tab in two panes (the Writing board's own sections). Left: the
    // draft in progress, stats, due dates. Right: drafts, new comments, your works. The tab
    // shows only for accounts that write (see Writing-Tab-Rule).
    return { none: [], side: [{ label: 'New Work', d: 'M12 5v14M5 12h14' }, { label: 'More: Import a Work, Stats, Select, Sort', d: 'dots' }] };
  }
}
</script>
</body>
</html>

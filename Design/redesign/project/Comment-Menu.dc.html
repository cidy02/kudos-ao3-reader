<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comment menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; inset: 0; filter: blur(6px); opacity: 0.7; pointer-events: none">
    <dc-import name="Comments" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.10)"></div>

  <article aria-label="Preview" style="position: absolute; left: 16px; right: 16px; top: 150px; border-radius: 22px; padding: 14px 16px; background: #FFFFFF; box-shadow: 0 18px 50px rgba(0,0,0,0.20); display: flex; gap: 12px">
    <span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #6B4E23; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">M</span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 13px; line-height: 18px; color: #6C6C70"><span style="font-weight: 600; color: #000000">marginalia</span> · Chapter 7 · 4 days ago</span>
      <p style="margin: 0; font-size: 16px; line-height: 22px">Tomas not laughing at the end is going to live in my head for weeks.</p>
      <span style="font-size: 13px; line-height: 18px; color: #821019; font-weight: 600">2 replies</span>
    </div>
  </article>

  <div role="menu" aria-label="Comment actions" style="position: absolute; left: 16px; top: 296px; width: 270px; border-radius: 24px; padding: 0 0 4px; overflow: hidden; background: rgba(250,250,252,0.9); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 18px 50px rgba(0,0,0,0.22), 0 0 0 0.5px rgba(0,0,0,0.08)">
    <dc-import name="MenuTopRow" items="{{top}}" width="270" hint-size="270px,66px"></dc-import>
    <sc-for list="{{rows}}" as="m" hint-placeholder-count="3">
      <button role="menuitem" style="width: 100%; height: 42px; border: none; border-top: {{m.sep}}; background: transparent; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-family: inherit; font-size: 16px; color: {{m.color}}; text-align: left">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.d}}"></path></svg>
        <span style="flex: 1">{{m.label}}</span>
        <span style="font-size: 14px; color: #6C6C70">{{m.detail}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sep = '0.5px solid rgba(60,60,67,0.18)';
    // Someone else's comment: Reply, Copy Link and Share on top; the thread, the chapter and
    // Hide below. Your own comment swaps Hide for Edit Comment and a red Delete Comment.
    return {
      top: [
        { label: 'Reply', d: 'M9 7 4 12l5 5M4 12h10a6 6 0 0 1 6 6' },
        { label: 'Copy Link', d: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1' },
        { label: 'Share', d: 'M12 15V4M8 8l4-4 4 4M5 12v8h14v-8' }
      ],
      rows: [
        ['Show Thread', 'M5 6h14M5 12h10M5 18h6', '2 replies', '#000000', 'none'],
        ['Go to Chapter 7', 'M4 5.5c3-1 5.5-.6 8 1 2.5-1.6 5-2 8-1v13c-3-1-5.5-.6-8 1-2.5-1.6-5-2-8-1zM12 6.5v13', '', '#000000', 'none'],
        ['Hide This Commenter', 'M3 3l18 18M10.6 6.1A9.6 9.6 0 0 1 12 6c5.5 0 9 6 9 6a15.7 15.7 0 0 1-3.1 3.8M6.2 7.6C4 9.2 3 12 3 12s3.5 6 9 6c1.4 0 2.6-.3 3.7-.8', '', '#000000', sep]
      ].map(([label, d, detail, color, s]) => ({ label, d, detail, color, sep: s }))
    };
  }
}
</script>
</body>
</html>

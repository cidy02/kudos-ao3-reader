<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restricted work opened from a link</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform: translateY(10px) scale(0.92); transform-origin: 50% 0; border-radius: 38px; overflow: hidden; pointer-events: none">
    <dc-import name="Home-Launchpad" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; left: 0; top: 0">
    <dc-import name="Login" context="restricted" hint-size="390px,844px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // A link to a work its author limits to logged-in users, opened while logged out. The app
    // already has one way to ask for a login (the Log In to AO3 sheet), so this is that sheet,
    // the Login board itself, with one card on top saying why it opened. After logging in the
    // work opens as Link-Landing.
    return {};
  }
}
</script>
</body>
</html>

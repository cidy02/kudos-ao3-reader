<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Writing › Edit Series</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="Edit Series" subtitle="Lantern Season" back="Back" confirm="Save" height="844" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "header": "Title",
      "rows": [
        {
          "kind": "field",
          "text": "Lantern Season"
        }
      ]
    },
    {
      "header": "Summary",
      "rows": [
        {
          "kind": "textarea",
          "text": "Three keepers, three winters, one light.",
          "rows": 2
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Complete",
          "kind": "toggle",
          "on": false
        },
        {
          "label": "Reorder Works",
          "kind": "nav",
          "detail": "3"
        },
        {
          "label": "Remove Works",
          "kind": "nav"
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Delete Series",
          "kind": "destructive"
        }
      ],
      "footer": "The works stay; only the series goes."
    }
  ]
};
  }
}
</script>
</body>
</html>

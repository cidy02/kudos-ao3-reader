<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collections › New Collection (sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="New Collection" mode="sheet" confirm="Create" height="844" sections="{{sections}}" context="{{context}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "header": "Name",
      "rows": [
        {
          "kind": "field",
          "placeholder": "Collection name"
        }
      ]
    },
    {
      "header": "Description",
      "rows": [
        {
          "kind": "textarea",
          "placeholder": "Optional",
          "rows": 2
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Colour",
          "kind": "swatches",
          "colours": [
            "#753E59",
            "#684E0C",
            "#2B5F39",
            "#365281",
            "#524A7E",
            "#4F5359"
          ],
          "selected": 3
        },
        {
          "label": "Pin to Home",
          "kind": "toggle",
          "on": false
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Add Works…",
          "kind": "nav",
          "detail": "None yet",
          "tile": "#365281",
          "icon": "M4 6h16M4 12h16M4 18h16"
        }
      ]
    }
  ],
  "context": {
    "kicker": "New collection",
    "kickerColour": "#365281",
    "title": "Untitled collection",
    "meta": "No works yet · only in Kudos",
    "collection": { "name": "Untitled collection", "colour": "#365281" }
  }
};
  }
}
</script>
</body>
</html>

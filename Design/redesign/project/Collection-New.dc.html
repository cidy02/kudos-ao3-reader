<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collections › New Collection (sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <dc-import name="FormScreen" title="New Collection" mode="sheet" confirm="Create" height="844" sections="{{sections}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
  "sections": [
    {
      "header": "Name",
      "rows": [
        {
          "kind": "field",
          "placeholder": "Collection name"
        }
      ]
    },
    {
      "header": "Description",
      "rows": [
        {
          "kind": "textarea",
          "placeholder": "Optional",
          "rows": 2
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Colour",
          "kind": "swatches",
          "colours": [
            "#9C2F6B",
            "#B8892A",
            "#2F7A4A",
            "#1E63C8",
            "#7B3FA0",
            "#6C6C70"
          ],
          "selected": 3
        },
        {
          "label": "Pin to Home",
          "kind": "toggle",
          "on": false
        }
      ]
    },
    {
      "rows": [
        {
          "label": "Add Works…",
          "kind": "nav",
          "detail": "None yet"
        }
      ]
    }
  ]
};
  }
}
</script>
</body>
</html>

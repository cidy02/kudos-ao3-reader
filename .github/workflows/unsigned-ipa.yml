name: Unsigned IPA

# Builds a sideloadable, unsigned .ipa and publishes it to GitHub Releases, so
# a build can be installed with AltStore / Sideloadly / SideStore without
# needing a Mac — or a GitHub account.
#
# Releases rather than run artifacts, because an artifact is the wrong shape for
# a download you hand to someone: it needs a signed-in GitHub account even on a
# public repo, arrives wrapped in a .zip, hides at the bottom of a run summary,
# and expires after 30 days. A release asset has none of those problems. The
# artifact upload stays as well — it is free, and it keeps a per-commit history
# the rolling release deliberately does not.
#
# It is a separate workflow from ci.yml on purpose. ci.yml deliberately omits a
# build job because this project targets an iOS SDK that GitHub-hosted runner
# images have historically lagged behind (see the note at the top of that file);
# keeping the build here means a runner image without the SDK reddens only this
# workflow, and the lint gate stays meaningful.
#
# It also doubles as the compile check for agents working on this repo from a
# Linux container, where no Swift toolchain exists at all.
#
# If hosted runners cannot build this SDK yet, the fix is one of:
#   - point `runs-on` at a self-hosted macOS runner with the right Xcode, or
#   - run `Scripts/build-unsigned-ipa.sh` locally, which is what this calls.

# Publishing a release writes to the repository.
permissions:
  contents: write

on:
  push:
    branches:
      - 'codex/kudos-redesign'
      - 'claude/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: false
        default: ''

# Keyed on the commit, not the branch, so every commit really does get its own
# IPA — which is the point of this workflow.
#
# Two earlier attempts got this wrong. `cancel-in-progress: true` killed each run
# on the next push, so no run ever finished. Setting it to `false` was closer but
# not enough: GitHub keeps only ONE *pending* run per concurrency group, so a
# fresh push still supersedes a queued run, and commits pushed in a burst were
# silently skipped. A per-SHA group has no such collision.
#
# The cost is real: runs go in parallel rather than in a queue, and each is
# several minutes of a macOS runner. The MuPDF cache keeps that to the app build
# alone after the first run. If the minutes matter more than per-commit
# artifacts, move back to `${{ github.ref }}` with cancel-in-progress false and
# accept that only the newest commit of a burst is built.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      # Both prerequisites are gitignored: MuPDF is ~48 MB of built binaries and
      # FluidAudio is a patched checkout of a pinned upstream revision. Cache the
      # expensive one; the other is a clone plus a 106-line patch.
      - name: Cache MuPDF xcframework
        id: mupdf-cache
        uses: actions/cache@v4
        with:
          path: Vendor/MuPDF.xcframework
          key: mupdf-${{ runner.os }}-${{ hashFiles('Scripts/build-mupdf.sh') }}-xcode26

      # build-mupdf.sh writes to build-mupdf/ and deliberately does not install
      # anywhere — it is normally run by hand. The project links the framework
      # from Vendor/, so the copy is this workflow's job.
      - name: Build MuPDF
        if: steps.mupdf-cache.outputs.cache-hit != 'true'
        run: |
          Scripts/build-mupdf.sh
          mkdir -p Vendor
          rm -rf Vendor/MuPDF.xcframework
          cp -R build-mupdf/MuPDF.xcframework Vendor/

      # Each slice's compiler output is redirected to its own log file, so a
      # failure above prints nothing but an exit code. Surface the tail of every
      # log — without this the only signal is "exit code 2".
      - name: MuPDF build logs
        if: failure()
        run: |
          for log in build-mupdf/*.log; do
            [ -f "$log" ] || continue
            echo "===== $log (last 80 lines) ====="
            tail -80 "$log"
          done

      - name: Fetch FluidAudio
        run: Scripts/fetch-fluidaudio.sh

      - name: Build unsigned IPA
        run: Scripts/build-unsigned-ipa.sh

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kudos-unsigned-${{ github.sha }}
          path: .build/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 30

      # One rolling pre-release per branch, replaced on every successful build,
      # rather than a release per commit: this branch takes a dozen commits a
      # session and a dozen release entries would bury the real releases under
      # build noise. The artifact above keeps the per-commit history for anyone
      # who needs an older build.
      #
      # Deleted and recreated rather than edited, because the tag has to move to
      # the commit that was actually built — `gh release edit --target` does not
      # move an existing tag — and because recreating leaves exactly one asset
      # attached instead of accumulating one per build.
      - name: Publish to Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          IPA="$(ls .build/ipa/*.ipa | head -1)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # Slashes are legal in a branch name and not in a tag.
          TAG="build-${GITHUB_REF_NAME//\//-}"

          NOTES=$(cat <<EOF
          Unsigned build of \`$GITHUB_REF_NAME\` at \`$SHORT_SHA\`.

          **This IPA is not signed and will not install as-is.** Sign it with
          AltStore, Sideloadly or SideStore using your own certificate. Nothing
          in this repository carries an Apple \`DEVELOPMENT_TEAM\`, which is a
          deliberate rule (see AGENTS.md), so there is no signed build to hand
          out.

          This tag is rolling: it is replaced by the next successful build of
          this branch. For a specific older commit, take the artifact from that
          commit's [workflow run](../../actions/workflows/unsigned-ipa.yml).

          Built from $GITHUB_SHA.
          EOF
          )

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$IPA" \
            --title "Unsigned build — $GITHUB_REF_NAME ($SHORT_SHA)" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"
          echo "Published $TAG -> $(basename "$IPA")"

      # The build log is the useful half when the IPA step fails, and a failed
      # xcodebuild on this repo is usually a missing SDK rather than bad code.
      - name: Report
        if: failure()
        run: |
          echo "The IPA build failed. Check, in this order:"
          echo "  1. Does this runner's Xcode ship the iOS SDK the project targets?"
          echo "     IPHONEOS_DEPLOYMENT_TARGET is in AO3_App_OpenSource.xcodeproj/project.pbxproj."
          echo "  2. Did Vendor/MuPDF.xcframework and Packages/FluidAudio get built/fetched?"
          echo "  3. Is it an actual compile error in the diff?"

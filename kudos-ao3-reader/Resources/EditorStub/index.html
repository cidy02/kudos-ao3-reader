<!doctype html>
<!--
  TEMPORARY STUB — T-576b (Apple Rich Text host, parts 1 & 2).
  Replaced by the built `editor-core` ProseMirror bundle (T-576a) via the single
  constant `RichEditorBundleLocation.bundleDirectory`.
  Implements the §7.2 bridge protocol, §7.10 mirrorBlocks, §7.11 verifySwitch,
  and §10.3 N4/N5/N6 native-feel messages trivially so the host can run and be
  tested before `editor-core` lands.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Kudos Rich Text Editor Stub</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --fg: #1E1E1E;
      --accent: #821019;
      --link: #0B66C2;
      --font: 'New York', ui-serif, Georgia, serif;
      --font-size: 15.5px;
      --font-weight: 400;
      --line-height: 1.62;
    }
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: visible;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: var(--font-size);
      font-weight: var(--font-weight);
      line-height: var(--line-height);
      -webkit-text-size-adjust: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html[data-contrast="high"] {
      --fg: currentColor;
    }
    #editor-stub-banner {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 11px;
      opacity: 0.6;
      padding: 6px 12px 0 12px;
      user-select: none;
      -webkit-user-select: none;
    }
    #editor-root {
      min-height: calc(100vh - 36px);
      box-sizing: border-box;
      padding: 12px;
      outline: none;
      overflow: visible;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      caret-color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="editor-stub-banner" aria-hidden="true">Rich Text stub (awaiting editor-core)</div>
  <div id="editor-root"
       role="textbox"
       aria-multiline="true"
       aria-label="Rich Text editor stub"
       contenteditable="false"
       spellcheck="true"
       autocorrect="on"
       autocapitalize="sentences"></div>
  <script src="editor-stub.js"></script>
</body>
</html>
